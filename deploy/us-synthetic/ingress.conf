# Fixed synthetic profile only; external-host rendering requires separate review.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_header_buffer_size 64k;
  large_client_header_buffers 1 64k;
  client_max_body_size 512k;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  map "$request_method:$uri" $us_route {
    default 0;
    "~^GET:/api/us/deployment$" 1;
    "~^GET:/api/us/health/(?:live|ready)$" 1;
    "~^GET:/api/us/traceability/(?:access|profile|events|readiness|search|cases/lookup)$" 1;
    "~^PUT:/api/us/traceability/profile$" 1;
    "~^(?:GET|POST):/api/us/traceability/(?:parties|locations|catalog/products|lots|receiving|plans|reference-documents)$" 1;
    "~^(?:GET|PATCH):/api/us/traceability/(?:parties|locations|catalog/products)/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 1;
    "~^(?:GET|PUT):/api/us/traceability/products/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 1;
    "~^GET:/api/us/traceability/lots/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/(?:receiving-basis|shipping-balance|cases|trace(?:/history)?|card(?:/evidence)?))?$" 1;
    "~^PATCH:/api/us/traceability/lots/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/source$" 1;
    "~^POST:/api/us/traceability/lots/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(?:status|cases)$" 1;
    "~^POST:/api/us/traceability/lots/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/cases/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/unlink$" 1;
    "~^(?:GET|PUT):/api/us/traceability/(?:receiving|transformation|shipments|plans)/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 1;
    "~^GET:/api/us/traceability/(?:receiving|transformation|shipments)/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(?:readiness|revisions)$" 1;
    "~^POST:/api/us/traceability/(?:receiving|transformation|shipments)/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(?:finalize|amend|void)$" 1;
    "~^GET:/api/us/traceability/receiving/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/export\\.csv$" 1;
    "~^POST:/api/us/traceability/receiving/imports/preview$" 1;
    "~^GET:/api/us/traceability/receiving/imports/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 1;
    "~^POST:/api/us/traceability/receiving/imports/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/apply$" 1;
    "~^POST:/api/us/traceability/(?:transformation|shipments)$" 1;
    "~^POST:/api/us/traceability/transformation/genealogy/query$" 1;
    "~^GET:/api/us/traceability/reference-documents/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 1;
    "~^POST:/api/us/traceability/plans/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(?:validate|preview|approve|discard)$" 1;
    "~^GET:/api/us/traceability/plans/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/pdf$" 1;
    "~^(?:GET|POST):/api/us/traceability/requests$" 1;
    "~^(?:GET|PATCH):/api/us/traceability/requests/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" 1;
    "~^POST:/api/us/traceability/requests/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(?:close|validate|acknowledge-warnings|prepare)$" 1;
    "~^GET:/api/us/traceability/requests/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/runs$" 1;
    "~^GET:/api/us/traceability/export-runs/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:/attempts)?$" 1;
    "~^POST:/api/us/traceability/export-runs/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/retry$" 1;
    "~^GET:/api/us/traceability/export-runs/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/artifacts/(?:xlsx|plan_pdf|validation_report|request_report|manifest|package_zip)$" 1;
    "~^POST:/api/us-auth/sign-in/email$" 1;
    "~^POST:/api/us-auth/sign-out$" 1;
    "~^GET:/api/us-auth/get-session$" 1;
    "~^GET:/api/us-auth/organization/list$" 1;
    "~^POST:/api/us-auth/organization/set-active$" 1;
    "~^POST:/api/us-auth/two-factor/(?:enable|verify-totp|verify-backup-code)$" 1;
  }
  server {
    listen 8443 ssl default_server;
    server_name us-demo.invalid;
    ssl_certificate /run/secrets/us-demo/public-cert.pem;
    ssl_certificate_key /run/secrets/us-demo/public-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/us-static;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    if ($http_host != us-demo.invalid) { return 404; }
    # Do not let URI normalization turn aliases into admitted routes.
    if ($request_uri ~ "^[^?]*%") { return 404; }
    if ($request_uri ~ "^[^?]*//") { return 404; }
    if ($request_uri ~ "^[^?]*/\\.\\.?(/|\\?|$)") { return 404; }
    location = / {
      if ($request_method != GET) { return 404; }
      try_files /index.html =404;
    }
    location ~ "^/assets/[A-Za-z0-9._-]+\\.(?:js|css|woff2?|ttf|svg|png|webp|jpg|ico)$" {
      if ($request_method != GET) { return 404; }
      try_files $uri =404;
    }
    location ~ ^/api/ {
      if ($us_route = 0) { return 404; }
      if ($http_range != "") { return 404; }
      rewrite ^/api/us/(.*)$ /$1 break;
      proxy_pass https://api.us-demo.internal:8443;
      proxy_ssl_verify on;
      proxy_ssl_server_name on;
      proxy_ssl_name api.us-demo.internal;
      proxy_ssl_trusted_certificate /run/secrets/us-demo/api-ca.pem;
      proxy_set_header Host us-demo.invalid;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header Connection "";
      proxy_hide_header Cache-Control;
      proxy_buffering off;
    }
    location / { return 404; }
  }
}
