services:
  migrate:
    image: ghcr.io/thevladbog/markiro-api@${MARKIRO_API_IMAGE_DIGEST:?MARKIRO_API_IMAGE_DIGEST is required}
    env_file:
      - path: ${MARKIRO_PLATFORM_MIGRATION_ENV_FILE:?MARKIRO_PLATFORM_MIGRATION_ENV_FILE is required}
        format: raw
    environment:
      SERVER_PROFILE: platform-only
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"
    restart: "no"
    command: node node_modules/@markiro/db/dist/migrate-cli.js
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/thevladbog/markiro-api@${MARKIRO_API_IMAGE_DIGEST:?MARKIRO_API_IMAGE_DIGEST is required}
    restart: unless-stopped
    deploy:
      replicas: 1
    mem_limit: 3g
    env_file:
      - path: ${MARKIRO_PLATFORM_ENV_FILE:?MARKIRO_PLATFORM_ENV_FILE is required}
        format: raw
    environment:
      SERVER_PROFILE: platform-only
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=2048"
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"
      VALIDATION_DM_DUPLICATE_ENABLED: "false"
      NATIONAL_CATALOG_OWN_IMPORT_ENABLED: "false"
      NATIONAL_CATALOG_GTIN_IMPORT_ENABLED: "false"
      NATIONAL_CATALOG_IMAGE_IMPORT_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "/opt/markiro/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  edge:
    image: ghcr.io/thevladbog/markiro-platform-edge@${MARKIRO_PLATFORM_EDGE_IMAGE_DIGEST:?MARKIRO_PLATFORM_EDGE_IMAGE_DIGEST is required}
    restart: unless-stopped
    environment:
      MARKIRO_RETIRED_ADMIN_DOMAIN: ${MARKIRO_RETIRED_ADMIN_DOMAIN:?MARKIRO_RETIRED_ADMIN_DOMAIN is required}
      MARKIRO_SAAS_ADMIN_DOMAIN: ${MARKIRO_SAAS_ADMIN_DOMAIN:?MARKIRO_SAAS_ADMIN_DOMAIN is required}
      MARKIRO_RETIRED_KIOSK_DOMAIN: ${MARKIRO_RETIRED_KIOSK_DOMAIN:?MARKIRO_RETIRED_KIOSK_DOMAIN is required}
      MARKIRO_LANDING_DOMAIN: ${MARKIRO_LANDING_DOMAIN:?MARKIRO_LANDING_DOMAIN is required}
      MARKIRO_RELEASES_DOMAIN: ${MARKIRO_RELEASES_DOMAIN:?MARKIRO_RELEASES_DOMAIN is required}
      MARKIRO_RELEASES_BUCKET: ${MARKIRO_RELEASES_BUCKET:?MARKIRO_RELEASES_BUCKET is required}
      SERVER_PROFILE: platform-only
      VITE_SERVER_PROFILE: platform-only
      MARKIRO_RELEASE_SHA: ${MARKIRO_SOURCE_SHA:?MARKIRO_SOURCE_SHA is required}
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:?S3_PUBLIC_ORIGIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    depends_on:
      api:
        condition: service_healthy
    user: "10001:10001"
    ports:
      - "${MARKIRO_HTTP_PORT:-80}:8080"
      - "${MARKIRO_HTTPS_PORT:-443}:8443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
