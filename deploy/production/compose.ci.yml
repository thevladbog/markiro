services:
  migrate:
    image: ghcr.io/thevladbog/markiro-api:${MARKIRO_IMAGE_TAG:?MARKIRO_IMAGE_TAG is required}

  api:
    image: ghcr.io/thevladbog/markiro-api:${MARKIRO_IMAGE_TAG:?MARKIRO_IMAGE_TAG is required}

  edge:
    image: ghcr.io/thevladbog/markiro-edge:${MARKIRO_IMAGE_TAG:?MARKIRO_IMAGE_TAG is required}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: markiro
      POSTGRES_PASSWORD: markiro
      POSTGRES_DB: markiro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markiro -d markiro"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_DATABASE: /tmp/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: markiro
      MINIO_ROOT_PASSWORD: markiro-development-only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: markiro
      MINIO_ROOT_PASSWORD: markiro-development-only
      MINIO_BUCKET: markiro-private
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_BUCKET}"
