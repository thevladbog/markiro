services:
  migrate:
    image: ghcr.io/thevladbog/markiro-api:${MARKIRO_IMAGE_TAG:?MARKIRO_IMAGE_TAG is required}

  api:
    image: ghcr.io/thevladbog/markiro-api:${MARKIRO_IMAGE_TAG:?MARKIRO_IMAGE_TAG is required}

  edge:
    image: ghcr.io/thevladbog/markiro-edge:${MARKIRO_IMAGE_TAG:?MARKIRO_IMAGE_TAG is required}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: markiro
      POSTGRES_PASSWORD: markiro
      POSTGRES_DB: markiro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markiro -d markiro"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_DATABASE: /tmp/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    environment:
      AWS_ACCESS_KEY_ID: markiro
      AWS_SECRET_ACCESS_KEY: markiro-development-only
      S3_BUCKET: markiro-private
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test "$$(curl -sS -o /dev/null -w ''%{http_code}'' http://127.0.0.1:8333/$${S3_BUCKET}/healthcheck)" = 403',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
