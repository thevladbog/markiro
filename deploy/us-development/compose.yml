name: markiro-us-development

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: markiro_us
      POSTGRES_PASSWORD: markiro-us-development-only
      POSTGRES_DB: markiro_us_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markiro_us -d markiro_us_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    volumes:
      - mailpitdata:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - mini
      - -dir=/data
      - -s3.port=8333
      - -s3.config=/etc/us-s3.json
      - -bucket=markiro-us-development
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.telemetry=false
      - -s3.autoCreateBucket=false
    ports:
      - "127.0.0.1:19000:8333"
    volumes:
      - s3data:/data
      - ./s3-identities.example.json:/etc/us-s3.json:ro
volumes:
  pgdata:
  mailpitdata:
  s3data:
