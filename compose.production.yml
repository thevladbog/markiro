services:
  migrate:
    image: ghcr.io/thevladbog/markiro-api:${MARKIRO_IMAGE_TAG:?MARKIRO_IMAGE_TAG is required}
    env_file:
      - ${MARKIRO_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"
    restart: "no"
    command: node node_modules/@markiro/db/dist/migrate-cli.js
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    image: ghcr.io/thevladbog/markiro-api:${MARKIRO_IMAGE_TAG:?MARKIRO_IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - ${MARKIRO_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY_HOPS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "/opt/markiro/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  edge:
    image: ghcr.io/thevladbog/markiro-edge:${MARKIRO_IMAGE_TAG:?MARKIRO_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      MARKIRO_DOMAIN: ${MARKIRO_DOMAIN:?MARKIRO_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    depends_on:
      api:
        condition: service_healthy
    user: "10001:10001"
    ports:
      - "${MARKIRO_HTTP_PORT:-80}:8080"
      - "${MARKIRO_HTTPS_PORT:-443}:8443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
