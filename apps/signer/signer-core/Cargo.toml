[package]
name = "signer-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Chestny ZNAK signer agent core: cloud protocol, True API auth, GOST signing"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
tokio = { version = "=1.53.1", features = ["sync", "time", "rt"] }
base64 = "0.22"
zeroize = "=1.9.0"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_SystemInformation",
] }
# COM/IDispatch (CAdESCOM automation) is not in windows-sys, hence the
# separate windows-rs dependency alongside windows-sys.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }
