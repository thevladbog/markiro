[package]
name = "markiro-host"
version = "1.1.2"
description = "Markiro standalone host: the LAN service with the master database"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

[lib]
name = "markiro_host"
path = "src/lib.rs"

[[bin]]
name = "markiro-host"
path = "src/main.rs"

[dependencies]
aws-lc-rs = "=1.18.1"
axum = "=0.8.9"
base64 = "=0.22.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = "=0.3.34"
if-addrs = "=0.15.0"
markiro-proto = { path = "../proto" }
markiro-backup-cloud = { path = "../backup-cloud" }
zeroize = "=1.9.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tracing = "0.1"
tracing-appender = "=0.2.5"
tracing-subscriber = "=0.3.23"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
http-body-util = "0.1"
# The domain's test keys join the built-in keysets in the host's tests (plan
# ЛЦ-1); a release build, which has no dev-dependency, never trusts them.
markiro-proto = { path = "../proto", features = ["test-keys"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
