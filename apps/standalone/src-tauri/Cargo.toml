[package]
name = "markiro-standalone"
version = "1.1.1"
description = "Markiro standalone station and office"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

[lib]
name = "markiro_standalone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "=0.22.1"
markiro-proto = { path = "../proto" }
markiro-backup-cloud = { path = "../backup-cloud" }
zeroize = "=1.9.0"
uuid = {version="1",features=["v4"]}
time = "=0.3.55"
# `stream`: the installer goes to the host as a stream of the file (plan ОБН-3).
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "=4.9.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2"
# `fs`, `io-util`: the downloaded installer is written to the disk (plan ОБН-3).
tokio = { version = "=1.53.1", features = ["sync", "macros", "time", "fs", "io-util"] }

[target.'cfg(windows)'.dependencies]
# Win32_Graphics_Gdi and Win32_UI_WindowsAndMessaging: kiosk mode (lockdown.rs).
# Win32_Graphics_Printing with Win32_Graphics_Gdi and Win32_Security: the
# spooler (printer/spooler.rs; PRINTER_INFO_2W needs all three, and
# Win32_Security_Cryptography would bring Win32_Security in anyway).
# Win32_Storage_Xps: StartDocW and DOCINFOW of driver printing (printer/driver.rs).
# Win32_System_Power with Win32_System_Threading: set_system_awake
# (power/windows.rs; PowerCreateRequest takes a REASON_CONTEXT).
# Win32_Storage_FileSystem: GetLogicalDrives and GetDriveTypeW, the removable
# drives an update is looked for on (update/package.rs). Win32_UI_Shell with
# Win32_System_Registry: ShellExecuteExW with the "runas" verb
# (update/launch.rs; SHELLEXECUTEINFOW holds an HKEY, so windows-sys gates
# the struct and the function on Win32_System_Registry).
# Win32_System_Com with Win32_UI_Shell_Common: SHBrowseForFolderW, the
# folder dialog of the office (folder_dialog.rs; CoInitializeEx, BROWSEINFOW).
# Win32_System_Diagnostics_Debug: SetThreadErrorMode, so a search of an empty
# card reader shows no «no disk» window over the kiosk (update/package.rs).
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_UI_Controls_Dialogs",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
markiro-host = { path = "../host" }
# The test keys of plan ЛЦ-1 for the shell's tests only; resolver 2 keeps
# them out of the app's own build.
markiro-proto = { path = "../proto", features = ["test-keys"] }
tauri = { version = "2.11", features = ["test"] }
tempfile = "3"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
