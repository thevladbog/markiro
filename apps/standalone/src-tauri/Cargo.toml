[package]
name = "markiro-standalone"
version = "0.1.0"
description = "Markiro standalone station and office"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

[lib]
name = "markiro_standalone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
markiro-proto = { path = "../proto" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rustls = { version = "=0.23.43", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
base64 = "=0.22.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
markiro-host = { path = "../host" }
tempfile = "3"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
