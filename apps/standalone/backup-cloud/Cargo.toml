[package]
name = "markiro-backup-cloud"
version = "0.1.0"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

[dependencies]
age = { version = "=0.12.1", default-features = false }
aws-lc-rs = "=1.18.1"
base64 = "=0.22.1"
httpdate = "=1.0.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "=1.53.3", features = ["fs", "io-util", "net", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "=1.9.0"

[dev-dependencies]
http = "=1.5.0"
tempfile = "3"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "test-util"] }
