<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Пилот способа нанесения Data Matrix</title>
  <desc id="desc">Проверка тары, серии, отказов и результата перед масштабированием.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ПРИЁМОЧНЫЙ ПИЛОТ</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Метод подтверждает серия, а не один красивый образец</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 170)"><rect width="310" height="280" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">01 / ТАРА И SKU</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Худший сценарий</text><text x="26" y="123" fill="#a8a4ad" font-size="16">блики · изгиб · влага</text><text x="26" y="154" fill="#a8a4ad" font-size="16">переналадка · старт серии</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Проверяется реальная</text><text x="26" y="247" fill="#d8d5dc" font-size="15">потребительская упаковка</text></g>
    <g transform="translate(445 170)"><rect width="310" height="280" rx="2" fill="#242228" stroke="#39ef8a" stroke-width="2"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">02 / СЕРИЯ</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Устойчивый поток</text><text x="26" y="123" fill="#d8d5dc" font-size="16">скорость · остановка · рестарт</text><text x="26" y="154" fill="#d8d5dc" font-size="16">чтение · дубли · отбраковка</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Считаются все исходы,</text><text x="26" y="247" fill="#d8d5dc" font-size="15">не только успешные коды</text></g>
    <g transform="translate(832 170)"><rect width="310" height="280" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">03 / РЕЗУЛЬТАТ</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Граница процесса</text><text x="26" y="123" fill="#a8a4ad" font-size="16">принято · брак · остаток</text><text x="26" y="154" fill="#a8a4ad" font-size="16">журнал · отчёт · владелец</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Можно повторить смену</text><text x="26" y="247" fill="#d8d5dc" font-size="15">без ручного восстановления</text></g>
    <path d="M378 310h54m-13-12 13 12-13 12M765 310h54m-13-12 13 12-13 12" fill="none" stroke="#39ef8a" stroke-width="3"/>
    <rect x="58" y="502" width="1084" height="64" rx="2" fill="#242228"/><text x="84" y="530" fill="#39ef8a" font-size="13" font-weight="700">КРИТЕРИЙ</text><text x="84" y="553" fill="#d8d5dc" font-size="16">После пилота известны не только скорость, но и судьба каждого напечатанного кода.</text>
  </g>
</svg>
