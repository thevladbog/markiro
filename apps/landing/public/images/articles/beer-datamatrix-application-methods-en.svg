<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three Data Matrix application methods for beer</title>
  <desc id="desc">A comparison of labelling, preprinted packaging, and direct print.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">THREE WORKABLE METHODS</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Choose for the process, not for the technology label</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 158)"><rect width="332" height="334" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">01 / LABEL</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Flexible start</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#a8a4ad" font-size="17">manual or automatic</text><text x="28" y="188" fill="#a8a4ad" font-size="17">fast SKU changeover</text><text x="28" y="225" fill="#a8a4ad" font-size="17">media and application</text><text x="28" y="276" fill="#d8d5dc" font-size="15">Useful for pilots</text><text x="28" y="301" fill="#d8d5dc" font-size="15">and smaller batches</text></g>
    <g transform="translate(434 158)"><rect width="332" height="334" rx="2" fill="#242228" stroke="#39ef8a" stroke-width="2"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">02 / PREPRINT</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Code before filling</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#d8d5dc" font-size="17">ready label or packaging</text><text x="28" y="188" fill="#d8d5dc" font-size="17">supplier-side validation</text><text x="28" y="225" fill="#d8d5dc" font-size="17">coded stock control</text><text x="28" y="276" fill="#39ef8a" font-size="15" font-weight="700">TRACEABILITY MATTERS</text><text x="28" y="301" fill="#d8d5dc" font-size="15">for lots and waste</text></g>
    <g transform="translate(810 158)"><rect width="332" height="334" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">03 / DIRECT PRINT</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Inline flow</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#a8a4ad" font-size="17">stable presentation</text><text x="28" y="188" fill="#a8a4ad" font-size="17">print · vision · reject</text><text x="28" y="225" fill="#a8a4ad" font-size="17">precise synchronisation</text><text x="28" y="276" fill="#d8d5dc" font-size="15">For repeatable flow</text><text x="28" y="301" fill="#d8d5dc" font-size="15">after line trials</text></g>
    <rect x="58" y="526" width="1084" height="48" rx="24" fill="#242228"/><circle cx="86" cy="550" r="7" fill="#39ef8a"/><text x="106" y="556" fill="#d8d5dc" font-size="16">Every method ends with code reading, waste accounting, and a confirmed application report.</text>
  </g>
</svg>
