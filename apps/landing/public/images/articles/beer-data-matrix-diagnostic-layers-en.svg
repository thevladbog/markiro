<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Four layers of Data Matrix diagnosis</title>
  <desc id="desc">A sequence for checking the symbol, scanner stream, software decision, and external exchange.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="64" y="72" fill="#3ddc7a" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">WHERE DID THE CODE FAIL?</text>
  <text x="64" y="118" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="32" font-weight="700">One symptom, four different failure layers</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 174)"><rect width="246" height="292" fill="#1d1c21" stroke="#3b3941"/><text x="24" y="42" fill="#3ddc7a" font-size="17" font-weight="700">01 / SYMBOL</text><text x="24" y="88" fill="#f4f2f5" font-size="24" font-weight="700">Camera cannot</text><text x="24" y="119" fill="#f4f2f5" font-size="24" font-weight="700">decode</text><text x="24" y="164" fill="#aaa7b0" font-size="17">Print · glare · curve</text><text x="24" y="194" fill="#aaa7b0" font-size="17">size · quiet zone</text><path d="M24 242h198" stroke="#3ddc7a" stroke-width="4"/><text x="24" y="270" fill="#f4f2f5" font-size="15">Test: any decode event?</text></g>
    <path d="M321 320h29m-12-12 12 12-12 12" fill="none" stroke="#3ddc7a" stroke-width="3"/>
    <g transform="translate(362 174)"><rect width="246" height="292" fill="#1d1c21" stroke="#3b3941"/><text x="24" y="42" fill="#3ddc7a" font-size="17" font-weight="700">02 / SCANNER</text><text x="24" y="88" fill="#f4f2f5" font-size="24" font-weight="700">Data stream</text><text x="24" y="119" fill="#f4f2f5" font-size="24" font-weight="700">is altered</text><text x="24" y="164" fill="#aaa7b0" font-size="17">FNC1 · GS · layout</text><text x="24" y="194" fill="#aaa7b0" font-size="17">prefix · suffix</text><path d="M24 242h198" stroke="#3ddc7a" stroke-width="4"/><text x="24" y="270" fill="#f4f2f5" font-size="15">Test: do bytes match?</text></g>
    <path d="M619 320h29m-12-12 12 12-12 12" fill="none" stroke="#3ddc7a" stroke-width="3"/>
    <g transform="translate(660 174)"><rect width="246" height="292" fill="#1d1c21" stroke="#3b3941"/><text x="24" y="42" fill="#3ddc7a" font-size="17" font-weight="700">03 / SOFTWARE</text><text x="24" y="88" fill="#f4f2f5" font-size="24" font-weight="700">Rule rejects</text><text x="24" y="119" fill="#f4f2f5" font-size="24" font-weight="700">the code</text><text x="24" y="164" fill="#aaa7b0" font-size="17">Format · GTIN · duplicate</text><text x="24" y="194" fill="#aaa7b0" font-size="17">wrong production job</text><path d="M24 242h198" stroke="#3ddc7a" stroke-width="4"/><text x="24" y="270" fill="#f4f2f5" font-size="15">Test: which verdict?</text></g>
    <path d="M917 320h29m-12-12 12 12-12 12" fill="none" stroke="#3ddc7a" stroke-width="3"/>
    <g transform="translate(958 174)"><rect width="178" height="292" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="42" fill="#3ddc7a" font-size="17" font-weight="700">04 / EXCHANGE</text><text x="20" y="88" fill="#f4f2f5" font-size="22" font-weight="700">State is</text><text x="20" y="117" fill="#f4f2f5" font-size="22" font-weight="700">rejected</text><text x="20" y="164" fill="#aaa7b0" font-size="16">GIS MT · EDI</text><text x="20" y="192" fill="#aaa7b0" font-size="16">integration</text><path d="M20 242h138" stroke="#3ddc7a" stroke-width="4"/><text x="20" y="270" fill="#f4f2f5" font-size="15">Test: system reply</text></g>
  </g>
  <rect x="64" y="500" width="1072" height="68" fill="#202d25" stroke="#3ddc7a"/>
  <text x="88" y="542" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="20" font-weight="700">Do not change print settings until the failure is proven to be at layer one.</text>
</svg>
