<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Four different meanings of a duplicate marking code message</title>
  <desc id="desc">The diagram separates a repeated scan, one code on two items, a duplicate report, and a controlled reprint.</desc>
  <rect width="1200" height="620" fill="#111014"/>
  <text x="70" y="74" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="700" letter-spacing="2">CLASSIFY THE DUPLICATE FIRST</text>
  <text x="70" y="116" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="700">One warning can describe four different events</text>
  <g transform="translate(70 162)"><rect width="505" height="170" fill="#1a191e" stroke="#38363f"/><text x="26" y="38" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">01 / REPEATED SCAN</text><text x="26" y="75" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="23" font-weight="700">One physical item scanned twice</text><text x="26" y="110" fill="#b8b5bd" font-family="IBM Plex Sans, sans-serif" font-size="17">Do not increase the count.</text><text x="26" y="138" fill="#b8b5bd" font-family="IBM Plex Sans, sans-serif" font-size="17">Retain the attempt in the audit trail.</text></g>
  <g transform="translate(625 162)"><rect width="505" height="170" fill="#1a191e" stroke="#ff7a66"/><text x="26" y="38" fill="#ff7a66" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">02 / TWO ITEMS</text><text x="26" y="75" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="23" font-weight="700">One code applied to two units</text><text x="26" y="110" fill="#b8b5bd" font-family="IBM Plex Sans, sans-serif" font-size="17">Quarantine the second unit.</text><text x="26" y="138" fill="#b8b5bd" font-family="IBM Plex Sans, sans-serif" font-size="17">Never release it under that identity.</text></g>
  <g transform="translate(70 366)"><rect width="505" height="170" fill="#1a191e" stroke="#e9b949"/><text x="26" y="38" fill="#e9b949" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">03 / DOCUMENT</text><text x="26" y="75" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="23" font-weight="700">A code or report was sent twice</text><text x="26" y="110" fill="#b8b5bd" font-family="IBM Plex Sans, sans-serif" font-size="17">Check status and original document.</text><text x="26" y="138" fill="#b8b5bd" font-family="IBM Plex Sans, sans-serif" font-size="17">Do not create a new operation blindly.</text></g>
  <g transform="translate(625 366)"><rect width="505" height="170" fill="#1a191e" stroke="#31e981"/><text x="26" y="38" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">04 / CONTROLLED REPRINT</text><text x="26" y="75" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="23" font-weight="700">The same identity is printed again</text><text x="26" y="110" fill="#b8b5bd" font-family="IBM Plex Sans, sans-serif" font-size="17">Only for the same item or package.</text><text x="26" y="138" fill="#b8b5bd" font-family="IBM Plex Sans, sans-serif" font-size="17">A copy must not become a new product.</text></g>
</svg>
