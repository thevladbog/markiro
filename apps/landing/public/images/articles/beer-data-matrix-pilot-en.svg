<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Pilot matrix for Beer Data Matrix reading</title>
  <desc id="desc">Five scenarios for testing codes on actual packaging, at line speed, and under production lighting.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="64" y="72" fill="#3ddc7a" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PILOT ON THE ACTUAL LINE</text>
  <text x="64" y="118" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="32" font-weight="700">Test a range of conditions, not one perfect sample</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">01</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Package</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Bottle · can</text><text x="20" y="152" fill="#aaa7b0" font-size="16">label · cap</text><text x="20" y="204" fill="#f4f2f5" font-size="16">Flat and curved</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
    <g transform="translate(282 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">02</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Print</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Roll start</text><text x="20" y="152" fill="#aaa7b0" font-size="16">middle · end</text><text x="20" y="204" fill="#f4f2f5" font-size="16">After a line stop</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
    <g transform="translate(500 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">03</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Speed</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Start · nominal</text><text x="20" y="152" fill="#aaa7b0" font-size="16">upper boundary</text><text x="20" y="204" fill="#f4f2f5" font-size="16">No manual pause</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
    <g transform="translate(718 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">04</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Environment</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Glare · moisture</text><text x="20" y="152" fill="#aaa7b0" font-size="16">condensation · dust</text><text x="20" y="204" fill="#f4f2f5" font-size="16">Production light</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
    <g transform="translate(936 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">05</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Failure</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Duplicate · noise</text><text x="20" y="152" fill="#aaa7b0" font-size="16">disconnect · restart</text><text x="20" y="204" fill="#f4f2f5" font-size="16">Clear next action</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
  </g>
  <rect x="64" y="510" width="1072" height="62" fill="#202d25" stroke="#3ddc7a"/>
  <text x="88" y="549" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="20" font-weight="700">Pilot output: read rate, cause of each failure, and a clear operator instruction.</text>
</svg>
