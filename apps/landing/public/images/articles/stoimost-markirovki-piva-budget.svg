<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Три слоя бюджета маркировки пива</title>
  <desc id="desc">Обязательные расходы, минимальный рабочий контур и автоматизация после пилота.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">БЮДЖЕТ БЕЗ ЛИШНЕГО ОБОРУДОВАНИЯ</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Сначала обязательное, затем доказанные улучшения</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 158)"><rect width="332" height="330" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">01 / ПОСТОЯННО</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Коды и расходники</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#a8a4ad" font-size="17">код маркировки</text><text x="28" y="188" fill="#a8a4ad" font-size="17">этикетка · риббон · чернила</text><text x="28" y="225" fill="#a8a4ad" font-size="17">обслуживание печати</text><text x="28" y="276" fill="#d8d5dc" font-size="15">Считается по объёму</text><text x="28" y="301" fill="#d8d5dc" font-size="15">и технологии нанесения</text></g>
    <g transform="translate(434 158)"><rect width="332" height="330" rx="2" fill="#242228" stroke="#39ef8a" stroke-width="2"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">02 / СТАРТ</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Рабочий контур</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#d8d5dc" font-size="17">станция · принтер · сканер</text><text x="28" y="188" fill="#d8d5dc" font-size="17">ПО · настройка · обучение</text><text x="28" y="225" fill="#d8d5dc" font-size="17">пилот и поддержка</text><text x="28" y="276" fill="#39ef8a" font-size="15" font-weight="700">ОБЯЗАТЕЛЬНАЯ ОСНОВА</text><text x="28" y="301" fill="#d8d5dc" font-size="15">без покупки лишней механики</text></g>
    <g transform="translate(810 158)"><rect width="332" height="330" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">03 / ПОСЛЕ ПИЛОТА</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Автоматизация</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#a8a4ad" font-size="17">аппликатор · камера</text><text x="28" y="188" fill="#a8a4ad" font-size="17">отбраковка · датчики</text><text x="28" y="225" fill="#a8a4ad" font-size="17">доработка конвейера</text><text x="28" y="276" fill="#d8d5dc" font-size="15">Только если окупает</text><text x="28" y="301" fill="#d8d5dc" font-size="15">измеренное ограничение</text></g>
    <path d="M400 323h22m-8-8 8 8-8 8M776 323h22m-8-8 8 8-8 8" fill="none" stroke="#39ef8a" stroke-width="3"/>
    <rect x="58" y="526" width="1084" height="48" rx="24" fill="#242228"/><circle cx="86" cy="550" r="7" fill="#39ef8a"/><text x="106" y="556" fill="#d8d5dc" font-size="16">Совместимое оборудование остаётся в контуре после приёмочного теста.</text>
  </g>
</svg>
