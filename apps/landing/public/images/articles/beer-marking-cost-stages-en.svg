<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three stages of an accessible beer marking launch</title>
  <desc id="desc">Inventory, a one-station pilot, and evidence-led scale-up.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">STAGED LAUNCH</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Evidence authorises every next expense</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 170)"><rect width="310" height="280" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">01 / INVENTORY</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">What already works</text><text x="26" y="123" fill="#a8a4ad" font-size="16">computer · printer</text><text x="26" y="154" fill="#a8a4ad" font-size="16">2D scanner · network</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Output: accepted devices</text><text x="26" y="247" fill="#d8d5dc" font-size="15">and genuine gaps</text></g>
    <g transform="translate(445 170)"><rect width="310" height="280" rx="2" fill="#242228" stroke="#39ef8a" stroke-width="2"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">02 / ONE STATION</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Production pilot</text><text x="26" y="123" fill="#d8d5dc" font-size="16">actual pack · speed</text><text x="26" y="154" fill="#d8d5dc" font-size="16">duplicate · offline · restart</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Output: stable rate</text><text x="26" y="247" fill="#d8d5dc" font-size="15">and measured constraints</text></g>
    <g transform="translate(832 170)"><rect width="310" height="280" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">03 / SCALE</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Only needed nodes</text><text x="26" y="123" fill="#a8a4ad" font-size="16">station · vision</text><text x="26" y="154" fill="#a8a4ad" font-size="16">applicator · integration</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Output: growth without</text><text x="26" y="247" fill="#d8d5dc" font-size="15">replacing proven foundations</text></g>
    <path d="M378 310h54m-13-12 13 12-13 12M765 310h54m-13-12 13 12-13 12" fill="none" stroke="#39ef8a" stroke-width="3"/>
    <rect x="58" y="502" width="1084" height="64" rx="2" fill="#242228"/><text x="84" y="530" fill="#39ef8a" font-size="13" font-weight="700">RULE</text><text x="84" y="553" fill="#d8d5dc" font-size="16">Do not scale an assumption. Scale only the process that passed the pilot.</text>
  </g>
</svg>
