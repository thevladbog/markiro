<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Три способа нанесения Data Matrix на пиво</title>
  <desc id="desc">Сравнение этикетирования, типографского нанесения и прямой печати.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ТРИ РАБОЧИХ МЕТОДА</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Выбор зависит от процесса, а не от названия технологии</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 158)"><rect width="332" height="334" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">01 / ЭТИКЕТКА</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Гибкий старт</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#a8a4ad" font-size="17">ручное или автоматическое</text><text x="28" y="188" fill="#a8a4ad" font-size="17">быстрая смена SKU</text><text x="28" y="225" fill="#a8a4ad" font-size="17">расходники и аппликация</text><text x="28" y="276" fill="#d8d5dc" font-size="15">Подходит для пилота</text><text x="28" y="301" fill="#d8d5dc" font-size="15">и небольших партий</text></g>
    <g transform="translate(434 158)"><rect width="332" height="334" rx="2" fill="#242228" stroke="#39ef8a" stroke-width="2"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">02 / ТИПОГРАФИЯ</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Код до розлива</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#d8d5dc" font-size="17">готовая этикетка или тара</text><text x="28" y="188" fill="#d8d5dc" font-size="17">контроль у подрядчика</text><text x="28" y="225" fill="#d8d5dc" font-size="17">управление остатками</text><text x="28" y="276" fill="#39ef8a" font-size="15" font-weight="700">ВАЖНА ПРОСЛЕЖИВАЕМОСТЬ</text><text x="28" y="301" fill="#d8d5dc" font-size="15">тиража и списания брака</text></g>
    <g transform="translate(810 158)"><rect width="332" height="334" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">03 / ПРЯМАЯ ПЕЧАТЬ</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Поток на линии</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#a8a4ad" font-size="17">стабильная геометрия</text><text x="28" y="188" fill="#a8a4ad" font-size="17">печать · камера · отбраковка</text><text x="28" y="225" fill="#a8a4ad" font-size="17">точная синхронизация</text><text x="28" y="276" fill="#d8d5dc" font-size="15">Для устойчивого потока</text><text x="28" y="301" fill="#d8d5dc" font-size="15">после испытаний</text></g>
    <rect x="58" y="526" width="1084" height="48" rx="24" fill="#242228"/><circle cx="86" cy="550" r="7" fill="#39ef8a"/><text x="106" y="556" fill="#d8d5dc" font-size="16">Любой метод должен завершаться чтением кода, учётом брака и подтверждённым отчётом.</text>
  </g>
</svg>
