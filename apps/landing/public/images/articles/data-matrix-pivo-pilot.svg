<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Матрица пилотной проверки чтения Data Matrix</title>
  <desc id="desc">Пять сценариев проверки кода на реальной таре, скорости и освещении.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="64" y="72" fill="#3ddc7a" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">ПИЛОТ НА РЕАЛЬНОЙ ЛИНИИ</text>
  <text x="64" y="118" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="32" font-weight="700">Проверяйте не образец, а диапазон условий</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">01</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Тара</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Бутылка · банка</text><text x="20" y="152" fill="#aaa7b0" font-size="16">этикетка · крышка</text><text x="20" y="204" fill="#f4f2f5" font-size="16">Плоскость и изгиб</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
    <g transform="translate(282 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">02</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Печать</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Начало рулона</text><text x="20" y="152" fill="#aaa7b0" font-size="16">середина · конец</text><text x="20" y="204" fill="#f4f2f5" font-size="16">После остановки</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
    <g transform="translate(500 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">03</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Скорость</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Пуск · номинал</text><text x="20" y="152" fill="#aaa7b0" font-size="16">верхняя граница</text><text x="20" y="204" fill="#f4f2f5" font-size="16">Без ручной паузы</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
    <g transform="translate(718 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">04</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Среда</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Блик · влага</text><text x="20" y="152" fill="#aaa7b0" font-size="16">конденсат · пыль</text><text x="20" y="204" fill="#f4f2f5" font-size="16">Рабочий свет</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
    <g transform="translate(936 170)"><rect width="200" height="304" fill="#1d1c21" stroke="#3b3941"/><text x="20" y="38" fill="#3ddc7a" font-size="16" font-weight="700">05</text><text x="20" y="82" fill="#f4f2f5" font-size="22" font-weight="700">Отказ</text><text x="20" y="124" fill="#aaa7b0" font-size="16">Дубль · шум</text><text x="20" y="152" fill="#aaa7b0" font-size="16">обрыв · перезапуск</text><text x="20" y="204" fill="#f4f2f5" font-size="16">Ясный следующий шаг</text><path d="M20 256h160" stroke="#3ddc7a" stroke-width="4"/></g>
  </g>
  <rect x="64" y="510" width="1072" height="62" fill="#202d25" stroke="#3ddc7a"/>
  <text x="88" y="549" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="20" font-weight="700">Результат пилота: доля чтения, причина каждого отказа и инструкция оператору.</text>
</svg>
