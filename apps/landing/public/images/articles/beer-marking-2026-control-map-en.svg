<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Beer-marking production-line readiness map</title>
  <desc id="description">Product data flows through code application and verification into packing and aggregation. A local journal links production events to external systems.</desc>
  <rect width="1200" height="620" fill="#131216"/><rect x="1" y="1" width="1198" height="618" fill="none" stroke="#343238" stroke-width="2"/>
  <text x="64" y="67" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600" letter-spacing="2" fill="#3ddc7a">READINESS IS AN END-TO-END PROCESS</text>
  <g font-family="IBM Plex Sans, sans-serif">
    <g transform="translate(64 112)"><rect width="300" height="216" fill="#1b1a1f" stroke="#45434a"/><text x="28" y="44" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="#3ddc7a">01 / DATA</text><text x="28" y="88" font-size="25" font-weight="600" fill="#f5f4f1">Product and job</text><text x="28" y="126" font-size="17" fill="#aaa7af">GTIN · pack · batch</text><text x="28" y="156" font-size="17" fill="#aaa7af">application parameters</text><rect x="28" y="180" width="244" height="4" fill="#3ddc7a"/></g>
    <path d="M382 220h54" stroke="#3ddc7a" stroke-width="3"/><path d="m425 209 12 11-12 11" fill="none" stroke="#3ddc7a" stroke-width="3"/>
    <g transform="translate(454 112)"><rect width="300" height="216" fill="#1b1a1f" stroke="#45434a"/><text x="28" y="44" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="#3ddc7a">02 / LINE</text><text x="28" y="81" font-size="23" font-weight="600" fill="#f5f4f1">Apply and</text><text x="28" y="109" font-size="23" font-weight="600" fill="#f5f4f1">verify</text><text x="28" y="143" font-size="16" fill="#aaa7af">Data Matrix · scanner</text><text x="28" y="169" font-size="16" fill="#aaa7af">printer · result</text><rect x="28" y="190" width="244" height="4" fill="#3ddc7a"/></g>
    <path d="M772 220h54" stroke="#3ddc7a" stroke-width="3"/><path d="m815 209 12 11-12 11" fill="none" stroke="#3ddc7a" stroke-width="3"/>
    <g transform="translate(844 112)"><rect width="292" height="216" fill="#1b1a1f" stroke="#45434a"/><text x="28" y="44" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" fill="#3ddc7a">03 / PACKING</text><text x="28" y="88" font-size="25" font-weight="600" fill="#f5f4f1">Contents and SSCC</text><text x="28" y="126" font-size="17" fill="#aaa7af">item → case</text><text x="28" y="156" font-size="17" fill="#aaa7af">duplicate and content checks</text><rect x="28" y="180" width="236" height="4" fill="#3ddc7a"/></g>
  </g>
  <g transform="translate(64 378)"><rect width="1072" height="166" fill="#202026" stroke="#5b5861"/><circle cx="58" cy="58" r="24" fill="#3ddc7a"/><path d="M58 45v27m0 16v2" stroke="#131216" stroke-width="5" stroke-linecap="square"/><text x="104" y="48" font-family="IBM Plex Sans, sans-serif" font-size="25" font-weight="600" fill="#f5f4f1">Local journal</text><text x="104" y="80" font-family="IBM Plex Sans, sans-serif" font-size="20" font-weight="600" fill="#f5f4f1">Evidence and recovery point</text><text x="104" y="116" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#aaa7af">Accepted · rejected · reprinted · restarted · synchronized</text><path d="M760 31v104" stroke="#45434a" stroke-width="2"/><text x="798" y="72" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="600" letter-spacing="1" fill="#3ddc7a">EXTERNAL SYSTEMS</text><text x="798" y="108" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#f5f4f1">GIS MT · EDI · 1C</text></g>
</svg>
