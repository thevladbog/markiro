<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Beer marking equipment acceptance matrix</title>
  <desc id="desc">Five test groups: packaging, speed, quality, failures, and recovery.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ACCEPTANCE ON THE ACTUAL LINE</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Five scenario groups before scale-up</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">01 / PACKAGING</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">Material</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">and geometry</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">glass · can</text><text x="22" y="197" fill="#a8a4ad" font-size="15">PET · keg</text><text x="22" y="225" fill="#a8a4ad" font-size="15">code position</text><text x="22" y="253" fill="#a8a4ad" font-size="15">edge-case SKUs</text></g>
    <g transform="translate(279 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">02 / SPEED</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">Full operating</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">range</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">start · normal</text><text x="22" y="197" fill="#a8a4ad" font-size="15">short peak</text><text x="22" y="225" fill="#a8a4ad" font-size="15">accumulation</text><text x="22" y="253" fill="#a8a4ad" font-size="15">stop · restart</text></g>
    <g transform="translate(500 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">03 / QUALITY</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">Good and</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">borderline</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">glare · shift</text><text x="22" y="197" fill="#a8a4ad" font-size="15">wrinkle · water</text><text x="22" y="225" fill="#a8a4ad" font-size="15">contamination</text><text x="22" y="253" fill="#a8a4ad" font-size="15">print wear</text></g>
    <g transform="translate(721 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">04 / FAILURES</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">Controlled</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">faults</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">no read</text><text x="22" y="197" fill="#a8a4ad" font-size="15">wrong GTIN</text><text x="22" y="225" fill="#a8a4ad" font-size="15">duplicate · jam</text><text x="22" y="253" fill="#a8a4ad" font-size="15">printer offline</text></g>
    <g transform="translate(942 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">05 / RECOVERY</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">No loss</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">after failure</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">network loss</text><text x="22" y="197" fill="#a8a4ad" font-size="15">restart</text><text x="22" y="225" fill="#a8a4ad" font-size="15">reprint</text><text x="22" y="253" fill="#a8a4ad" font-size="15">case reconcile</text></g>
    <rect x="58" y="492" width="1084" height="70" rx="2" fill="#242228"/><text x="82" y="520" fill="#39ef8a" font-size="13" font-weight="700">EVIDENCE</text><text x="82" y="547" fill="#d8d5dc" font-size="17">configuration · sample · speed · expected result · actual result · deviation owner</text>
  </g>
</svg>
