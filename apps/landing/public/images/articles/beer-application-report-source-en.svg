<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Preparing the source for a beer code application report</title>
  <desc id="desc">Five checks from a closed production shift to a report draft ready for signature.</desc>
  <rect width="1200" height="620" fill="#111014"/>
  <text x="70" y="72" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="700" letter-spacing="2">FROM PRODUCTION FACT TO DOCUMENT</text>
  <text x="70" y="116" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="700">Only reconciled codes from a closed shift enter the report</text>
  <g font-family="IBM Plex Sans, sans-serif">
    <g transform="translate(70 190)"><rect width="188" height="230" fill="#1a191e" stroke="#38363f"/><text x="20" y="38" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">01 / SHIFT</text><text x="20" y="82" fill="#f4f3f5" font-size="22" font-weight="700">Close</text><text x="20" y="112" fill="#f4f3f5" font-size="22" font-weight="700">production</text><text x="20" y="160" fill="#b8b5bd" font-size="16">date</text><text x="20" y="188" fill="#b8b5bd" font-size="16">product</text><text x="20" y="216" fill="#b8b5bd" font-size="16">operator</text></g>
    <path d="M268 305H292" stroke="#31e981" stroke-width="3"/><path d="m284 297 9 8-9 8" fill="none" stroke="#31e981" stroke-width="3"/>
    <g transform="translate(304 190)"><rect width="188" height="230" fill="#1a191e" stroke="#38363f"/><text x="20" y="38" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">02 / CODES</text><text x="20" y="82" fill="#f4f3f5" font-size="22" font-weight="700">Select</text><text x="20" y="112" fill="#f4f3f5" font-size="22" font-weight="700">accepted</text><text x="20" y="160" fill="#b8b5bd" font-size="16">full code</text><text x="20" y="188" fill="#b8b5bd" font-size="16">GTIN</text><text x="20" y="216" fill="#b8b5bd" font-size="16">serial</text></g>
    <path d="M502 305H526" stroke="#31e981" stroke-width="3"/><path d="m518 297 9 8-9 8" fill="none" stroke="#31e981" stroke-width="3"/>
    <g transform="translate(538 190)"><rect width="188" height="230" fill="#1a191e" stroke="#ff7a66"/><text x="20" y="38" fill="#ff7a66" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">03 / EXCLUDE</text><text x="20" y="82" fill="#f4f3f5" font-size="22" font-weight="700">Remove</text><text x="20" y="112" fill="#f4f3f5" font-size="22" font-weight="700">invalid</text><text x="20" y="160" fill="#b8b5bd" font-size="16">duplicates</text><text x="20" y="188" fill="#b8b5bd" font-size="16">rejects</text><text x="20" y="216" fill="#b8b5bd" font-size="16">undo events</text></g>
    <path d="M736 305H760" stroke="#31e981" stroke-width="3"/><path d="m752 297 9 8-9 8" fill="none" stroke="#31e981" stroke-width="3"/>
    <g transform="translate(772 190)"><rect width="188" height="230" fill="#1a191e" stroke="#e9b949"/><text x="20" y="38" fill="#e9b949" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">04 / RECONCILE</text><text x="20" y="82" fill="#f4f3f5" font-size="22" font-weight="700">Compare</text><text x="20" y="112" fill="#f4f3f5" font-size="22" font-weight="700">totals</text><text x="20" y="160" fill="#b8b5bd" font-size="16">items</text><text x="20" y="188" fill="#b8b5bd" font-size="16">cases</text><text x="20" y="216" fill="#b8b5bd" font-size="16">SSCCs</text></g>
    <path d="M970 305H994" stroke="#31e981" stroke-width="3"/><path d="m986 297 9 8-9 8" fill="none" stroke="#31e981" stroke-width="3"/>
    <g transform="translate(1006 190)"><rect width="124" height="230" fill="#1f4f38" stroke="#31e981"/><text x="16" y="38" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">05</text><text x="16" y="82" fill="#f4f3f5" font-size="21" font-weight="700">Build</text><text x="16" y="112" fill="#f4f3f5" font-size="21" font-weight="700">draft</text><text x="16" y="160" fill="#dff9ea" font-size="15">fields</text><text x="16" y="188" fill="#dff9ea" font-size="15">codes</text><text x="16" y="216" fill="#dff9ea" font-size="15">signature</text></g>
  </g>
  <rect x="70" y="466" width="1060" height="92" fill="#1a191e" stroke="#38363f"/>
  <text x="100" y="505" fill="#ffcf66" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700">CONTROL TOTAL</text>
  <text x="100" y="536" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="21" font-weight="700">Codes in the draft = eligible physical units after every exclusion.</text>
</svg>
