<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Data Matrix application acceptance pilot</title>
  <desc id="desc">Testing packaging, a production run, failure paths, and accountable output before scale-up.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ACCEPTANCE PILOT</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">A production run proves the method, not one perfect sample</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 170)"><rect width="310" height="280" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">01 / PACK AND SKU</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Worst case</text><text x="26" y="123" fill="#a8a4ad" font-size="16">glare · curve · moisture</text><text x="26" y="154" fill="#a8a4ad" font-size="16">changeover · run start</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Use the actual</text><text x="26" y="247" fill="#d8d5dc" font-size="15">consumer packaging</text></g>
    <g transform="translate(445 170)"><rect width="310" height="280" rx="2" fill="#242228" stroke="#39ef8a" stroke-width="2"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">02 / RUN</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Repeatable flow</text><text x="26" y="123" fill="#d8d5dc" font-size="16">speed · stop · restart</text><text x="26" y="154" fill="#d8d5dc" font-size="16">read · duplicate · reject</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Count every outcome,</text><text x="26" y="247" fill="#d8d5dc" font-size="15">not only accepted codes</text></g>
    <g transform="translate(832 170)"><rect width="310" height="280" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">03 / OUTPUT</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Process boundary</text><text x="26" y="123" fill="#a8a4ad" font-size="16">accepted · waste · stock</text><text x="26" y="154" fill="#a8a4ad" font-size="16">journal · report · owner</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">The next shift can run</text><text x="26" y="247" fill="#d8d5dc" font-size="15">without manual recovery</text></g>
    <path d="M378 310h54m-13-12 13 12-13 12M765 310h54m-13-12 13 12-13 12" fill="none" stroke="#39ef8a" stroke-width="3"/>
    <rect x="58" y="502" width="1084" height="64" rx="2" fill="#242228"/><text x="84" y="530" fill="#39ef8a" font-size="13" font-weight="700">PASS CONDITION</text><text x="84" y="553" fill="#d8d5dc" font-size="16">The pilot proves both production rate and the fate of every printed code.</text>
  </g>
</svg>
