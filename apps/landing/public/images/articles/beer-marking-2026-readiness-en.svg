<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Five production-line checks before beer marking goes live</title><desc id="description">Five checks cover real codes, duplicate rejection, reprinting, offline operation, and restart recovery.</desc>
  <rect width="1200" height="620" fill="#131216"/><rect x="1" y="1" width="1198" height="618" fill="none" stroke="#343238" stroke-width="2"/>
  <text x="64" y="67" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="600" letter-spacing="2" fill="#3ddc7a">TEST FAILURE PATHS, NOT ONLY THE HAPPY PATH</text><path d="M118 168v334" stroke="#45434a" stroke-width="4"/>
  <g font-family="IBM Plex Sans, sans-serif">
    <g transform="translate(82 112)"><circle cx="36" cy="36" r="34" fill="#3ddc7a"/><text x="36" y="44" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="700" fill="#131216">01</text><text x="96" y="31" font-size="23" font-weight="600" fill="#f5f4f1">Read a real code at production speed</text><text x="96" y="59" font-size="17" fill="#aaa7af">Use the actual container and label, not a test PDF.</text></g>
    <g transform="translate(82 204)"><circle cx="36" cy="36" r="34" fill="#242329" stroke="#3ddc7a" stroke-width="3"/><text x="36" y="44" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="700" fill="#3ddc7a">02</text><text x="96" y="31" font-size="23" font-weight="600" fill="#f5f4f1">Reject a duplicate without changing contents</text><text x="96" y="59" font-size="17" fill="#aaa7af">Show a clear result and retain the event in the journal.</text></g>
    <g transform="translate(82 296)"><circle cx="36" cy="36" r="34" fill="#242329" stroke="#3ddc7a" stroke-width="3"/><text x="36" y="44" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="700" fill="#3ddc7a">03</text><text x="96" y="31" font-size="23" font-weight="600" fill="#f5f4f1">Reprint without changing the identifier</text><text x="96" y="59" font-size="17" fill="#aaa7af">A printer failure must not create a second case or SSCC.</text></g>
    <g transform="translate(82 388)"><circle cx="36" cy="36" r="34" fill="#242329" stroke="#3ddc7a" stroke-width="3"/><text x="36" y="44" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="700" fill="#3ddc7a">04</text><text x="96" y="31" font-size="23" font-weight="600" fill="#f5f4f1">Continue permitted work without a network</text><text x="96" y="59" font-size="17" fill="#aaa7af">Keep the queue visible and durable through a connection loss.</text></g>
    <g transform="translate(82 480)"><circle cx="36" cy="36" r="34" fill="#242329" stroke="#3ddc7a" stroke-width="3"/><text x="36" y="44" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" font-weight="700" fill="#3ddc7a">05</text><text x="96" y="31" font-size="23" font-weight="600" fill="#f5f4f1">Resume from a known point after restart</text><text x="96" y="59" font-size="17" fill="#aaa7af">Restore the shift, open case, and unsent events.</text></g>
  </g>
</svg>
