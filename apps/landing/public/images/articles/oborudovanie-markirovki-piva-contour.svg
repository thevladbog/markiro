<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Функциональный контур линии маркировки пива</title>
  <desc id="desc">Шесть связанных функций: задание, нанесение, чтение, решение, короб и локальный журнал.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="68" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">НЕ НАБОР УСТРОЙСТВ, А СВЯЗАННЫЙ КОНТУР</text>
  <text x="58" y="112" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">От задания до подтверждённого короба</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 158)"><rect width="320" height="126" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="24" y="34" fill="#39ef8a" font-size="13" font-weight="700">01 / ЗАДАНИЕ</text><text x="24" y="68" fill="#f4f2f5" font-size="21" font-weight="700">GTIN · партия · коды</text><text x="24" y="98" fill="#a8a4ad" font-size="15">активная версия на линии</text></g>
    <g transform="translate(440 158)"><rect width="320" height="126" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="24" y="34" fill="#39ef8a" font-size="13" font-weight="700">02 / НАНЕСЕНИЕ</text><text x="24" y="68" fill="#f4f2f5" font-size="21" font-weight="700">Печать · аппликация</text><text x="24" y="98" fill="#a8a4ad" font-size="15">код на реальной упаковке</text></g>
    <g transform="translate(822 158)"><rect width="320" height="126" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="24" y="34" fill="#39ef8a" font-size="13" font-weight="700">03 / ЧТЕНИЕ</text><text x="24" y="68" fill="#f4f2f5" font-size="21" font-weight="700">Сканер · камера</text><text x="24" y="98" fill="#a8a4ad" font-size="15">неизменный поток данных</text></g>
    <path d="M388 221h38m-11-10 11 10-11 10M770 221h38m-11-10 11 10-11 10" fill="none" stroke="#39ef8a" stroke-width="3"/>
    <g transform="translate(58 336)"><rect width="320" height="126" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="24" y="34" fill="#39ef8a" font-size="13" font-weight="700">04 / РЕШЕНИЕ</text><text x="24" y="68" fill="#f4f2f5" font-size="21" font-weight="700">Принять · отбраковать</text><text x="24" y="98" fill="#a8a4ad" font-size="15">причина и действие оператора</text></g>
    <g transform="translate(440 336)"><rect width="320" height="126" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="24" y="34" fill="#39ef8a" font-size="13" font-weight="700">05 / УПАКОВКА</text><text x="24" y="68" fill="#f4f2f5" font-size="21" font-weight="700">Единица → короб → SSCC</text><text x="24" y="98" fill="#a8a4ad" font-size="15">проверенный состав</text></g>
    <g transform="translate(822 336)"><rect width="320" height="126" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="24" y="34" fill="#39ef8a" font-size="13" font-weight="700">06 / ЖУРНАЛ</text><text x="24" y="68" fill="#f4f2f5" font-size="21" font-weight="700">Локально · затем обмен</text><text x="24" y="98" fill="#a8a4ad" font-size="15">восстановление без дублей</text></g>
    <path d="M388 399h38m-11-10 11 10-11 10M770 399h38m-11-10 11 10-11 10" fill="none" stroke="#39ef8a" stroke-width="3"/>
    <path d="M982 298v22H218v-22" fill="none" stroke="#625f69" stroke-width="2" stroke-dasharray="6 7"/>
    <rect x="58" y="512" width="1084" height="54" rx="27" fill="#242228"/><circle cx="87" cy="539" r="8" fill="#39ef8a"/><text x="108" y="545" fill="#d8d5dc" font-size="16">Каждый переход имеет подтверждение, владельца ошибки и сценарий восстановления.</text>
  </g>
</svg>
