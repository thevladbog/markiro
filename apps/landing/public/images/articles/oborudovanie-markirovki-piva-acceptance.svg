<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Матрица приёмки оборудования линии маркировки</title>
  <desc id="desc">Пять групп испытаний: тара, скорость, качество, отказы и восстановление.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ПРИЁМКА НА РЕАЛЬНОЙ ЛИНИИ</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Пять групп сценариев до масштабирования</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">01 / ТАРА</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">Материал</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">и геометрия</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">стекло · банка</text><text x="22" y="197" fill="#a8a4ad" font-size="15">ПЭТ · кег</text><text x="22" y="225" fill="#a8a4ad" font-size="15">позиция кода</text><text x="22" y="253" fill="#a8a4ad" font-size="15">крайние SKU</text></g>
    <g transform="translate(279 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">02 / СКОРОСТЬ</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">Весь рабочий</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">диапазон</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">пуск · штатно</text><text x="22" y="197" fill="#a8a4ad" font-size="15">краткий пик</text><text x="22" y="225" fill="#a8a4ad" font-size="15">накопление</text><text x="22" y="253" fill="#a8a4ad" font-size="15">стоп · рестарт</text></g>
    <g transform="translate(500 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">03 / КАЧЕСТВО</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">Хорошие</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">и пограничные</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">блик · смещение</text><text x="22" y="197" fill="#a8a4ad" font-size="15">складка · влага</text><text x="22" y="225" fill="#a8a4ad" font-size="15">загрязнение</text><text x="22" y="253" fill="#a8a4ad" font-size="15">износ печати</text></g>
    <g transform="translate(721 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">04 / ОТКАЗЫ</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">Контрольные</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">ошибки</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">нет чтения</text><text x="22" y="197" fill="#a8a4ad" font-size="15">неверный GTIN</text><text x="22" y="225" fill="#a8a4ad" font-size="15">дубль · замятие</text><text x="22" y="253" fill="#a8a4ad" font-size="15">нет принтера</text></g>
    <g transform="translate(942 154)"><rect width="200" height="290" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="22" y="38" fill="#39ef8a" font-size="13" font-weight="700">05 / ВОССТАНОВЛЕНИЕ</text><text x="22" y="78" fill="#f4f2f5" font-size="20" font-weight="700">После сбоя</text><text x="22" y="106" fill="#f4f2f5" font-size="20" font-weight="700">без потерь</text><path d="M22 132h156" stroke="#39ef8a" stroke-width="3"/><text x="22" y="169" fill="#a8a4ad" font-size="15">нет сети</text><text x="22" y="197" fill="#a8a4ad" font-size="15">перезапуск</text><text x="22" y="225" fill="#a8a4ad" font-size="15">повтор печати</text><text x="22" y="253" fill="#a8a4ad" font-size="15">сверка короба</text></g>
    <rect x="58" y="492" width="1084" height="70" rx="2" fill="#242228"/><text x="82" y="520" fill="#39ef8a" font-size="13" font-weight="700">ДОКАЗАТЕЛЬСТВО</text><text x="82" y="547" fill="#d8d5dc" font-size="17">конфигурация · образец · скорость · ожидаемый результат · факт · владелец отклонения</text>
