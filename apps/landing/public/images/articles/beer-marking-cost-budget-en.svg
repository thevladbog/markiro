<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three layers of a Russian beer marking budget</title>
  <desc id="desc">Mandatory variable costs, the minimum working loop, and automation after the pilot.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">BUDGET WITHOUT UNNECESSARY EQUIPMENT</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Mandatory first, evidence-led improvements next</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 158)"><rect width="332" height="330" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">01 / RECURRING</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Codes and media</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#a8a4ad" font-size="17">marking codes</text><text x="28" y="188" fill="#a8a4ad" font-size="17">labels · ribbon · ink</text><text x="28" y="225" fill="#a8a4ad" font-size="17">print maintenance</text><text x="28" y="276" fill="#d8d5dc" font-size="15">Driven by volume</text><text x="28" y="301" fill="#d8d5dc" font-size="15">and application method</text></g>
    <g transform="translate(434 158)"><rect width="332" height="330" rx="2" fill="#242228" stroke="#39ef8a" stroke-width="2"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">02 / LAUNCH</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Working loop</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#d8d5dc" font-size="17">station · printer · scanner</text><text x="28" y="188" fill="#d8d5dc" font-size="17">software · setup · training</text><text x="28" y="225" fill="#d8d5dc" font-size="17">pilot and support</text><text x="28" y="276" fill="#39ef8a" font-size="15" font-weight="700">REQUIRED FOUNDATION</text><text x="28" y="301" fill="#d8d5dc" font-size="15">without premature mechanics</text></g>
    <g transform="translate(810 158)"><rect width="332" height="330" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="28" y="42" fill="#39ef8a" font-size="13" font-weight="700">03 / AFTER PILOT</text><text x="28" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Automation</text><path d="M28 108h276" stroke="#39ef8a" stroke-width="3"/><text x="28" y="151" fill="#a8a4ad" font-size="17">applicator · vision</text><text x="28" y="188" fill="#a8a4ad" font-size="17">reject · sensors</text><text x="28" y="225" fill="#a8a4ad" font-size="17">conveyor engineering</text><text x="28" y="276" fill="#d8d5dc" font-size="15">Only where it repays</text><text x="28" y="301" fill="#d8d5dc" font-size="15">a measured constraint</text></g>
    <path d="M400 323h22m-8-8 8 8-8 8M776 323h22m-8-8 8 8-8 8" fill="none" stroke="#39ef8a" stroke-width="3"/>
    <rect x="58" y="526" width="1084" height="48" rx="24" fill="#242228"/><circle cx="86" cy="550" r="7" fill="#39ef8a"/><text x="106" y="556" fill="#d8d5dc" font-size="16">Compatible equipment remains in the loop after an acceptance test.</text>
  </g>
</svg>
