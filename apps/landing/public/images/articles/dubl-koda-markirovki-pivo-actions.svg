<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Порядок диагностики дубликата кода маркировки</title>
  <desc id="desc">Шесть шагов от сохранения исходного кода до сверки результата и корректного действия.</desc>
  <rect width="1200" height="620" fill="#111014"/>
  <text x="70" y="72" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="700" letter-spacing="2">ДИАГНОСТИКА БЕЗ ДОГАДОК</text>
  <text x="70" y="114" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="700">Сначала восстановите факт, затем выбирайте действие</text>
  <path d="M125 258H1075" stroke="#31e981" stroke-width="3"/>
  <g font-family="IBM Plex Sans, sans-serif">
    <g transform="translate(70 180)"><circle cx="55" cy="78" r="42" fill="#1a191e" stroke="#31e981" stroke-width="2"/><text x="55" y="86" fill="#31e981" font-size="23" font-weight="700" text-anchor="middle">01</text><text x="55" y="156" fill="#f4f3f5" font-size="18" font-weight="700" text-anchor="middle">Код</text><text x="55" y="184" fill="#b8b5bd" font-size="15" text-anchor="middle">сохранить raw</text></g>
    <g transform="translate(260 180)"><circle cx="55" cy="78" r="42" fill="#1a191e" stroke="#31e981" stroke-width="2"/><text x="55" y="86" fill="#31e981" font-size="23" font-weight="700" text-anchor="middle">02</text><text x="55" y="156" fill="#f4f3f5" font-size="18" font-weight="700" text-anchor="middle">Журнал</text><text x="55" y="184" fill="#b8b5bd" font-size="15" text-anchor="middle">где был впервые</text></g>
    <g transform="translate(450 180)"><circle cx="55" cy="78" r="42" fill="#1a191e" stroke="#31e981" stroke-width="2"/><text x="55" y="86" fill="#31e981" font-size="23" font-weight="700" text-anchor="middle">03</text><text x="55" y="156" fill="#f4f3f5" font-size="18" font-weight="700" text-anchor="middle">Товар</text><text x="55" y="184" fill="#b8b5bd" font-size="15" text-anchor="middle">найти обе единицы</text></g>
    <g transform="translate(640 180)"><circle cx="55" cy="78" r="42" fill="#1a191e" stroke="#31e981" stroke-width="2"/><text x="55" y="86" fill="#31e981" font-size="23" font-weight="700" text-anchor="middle">04</text><text x="55" y="156" fill="#f4f3f5" font-size="18" font-weight="700" text-anchor="middle">Документ</text><text x="55" y="184" fill="#b8b5bd" font-size="15" text-anchor="middle">номер и статус</text></g>
    <g transform="translate(830 180)"><circle cx="55" cy="78" r="42" fill="#1a191e" stroke="#31e981" stroke-width="2"/><text x="55" y="86" fill="#31e981" font-size="23" font-weight="700" text-anchor="middle">05</text><text x="55" y="156" fill="#f4f3f5" font-size="18" font-weight="700" text-anchor="middle">Класс</text><text x="55" y="184" fill="#b8b5bd" font-size="15" text-anchor="middle">тип конфликта</text></g>
    <g transform="translate(1020 180)"><circle cx="55" cy="78" r="42" fill="#31e981"/><text x="55" y="86" fill="#111014" font-size="23" font-weight="700" text-anchor="middle">06</text><text x="55" y="156" fill="#f4f3f5" font-size="18" font-weight="700" text-anchor="middle">Действие</text><text x="55" y="184" fill="#b8b5bd" font-size="15" text-anchor="middle">исправить и сверить</text></g>
  </g>
  <rect x="70" y="432" width="1060" height="112" fill="#1a191e" stroke="#38363f"/>
  <text x="100" y="475" fill="#ffcf66" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700">КРИТИЧЕСКОЕ ПРАВИЛО</text>
  <text x="100" y="515" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="700">Не печатайте новый код и не отправляйте новый отчёт, пока не понятен исход первого действия.</text>
</svg>
