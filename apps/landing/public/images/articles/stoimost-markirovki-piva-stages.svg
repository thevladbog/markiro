<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Три этапа доступного запуска маркировки пива</title>
  <desc id="desc">Инвентаризация, пилот одной станции и масштабирование по данным.</desc>
  <rect width="1200" height="620" fill="#131216"/>
  <text x="58" y="66" fill="#39ef8a" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ПОЭТАПНЫЙ ЗАПУСК</text>
  <text x="58" y="108" fill="#f4f2f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Каждый следующий расход подтверждают данные</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 170)"><rect width="310" height="280" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">01 / ИНВЕНТАРИЗАЦИЯ</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Что уже работает</text><text x="26" y="123" fill="#a8a4ad" font-size="16">компьютер · принтер</text><text x="26" y="154" fill="#a8a4ad" font-size="16">2D-сканер · сеть</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Выход: список принятого</text><text x="26" y="247" fill="#d8d5dc" font-size="15">и реально недостающего</text></g>
    <g transform="translate(445 170)"><rect width="310" height="280" rx="2" fill="#242228" stroke="#39ef8a" stroke-width="2"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">02 / ОДНА СТАНЦИЯ</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Пилот на смене</text><text x="26" y="123" fill="#d8d5dc" font-size="16">реальная тара · скорость</text><text x="26" y="154" fill="#d8d5dc" font-size="16">дубль · нет сети · рестарт</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Выход: устойчивая норма</text><text x="26" y="247" fill="#d8d5dc" font-size="15">и измеренные ограничения</text></g>
    <g transform="translate(832 170)"><rect width="310" height="280" rx="2" fill="#1d1c21" stroke="#3b3941"/><text x="26" y="40" fill="#39ef8a" font-size="13" font-weight="700">03 / МАСШТАБ</text><text x="26" y="83" fill="#f4f2f5" font-size="23" font-weight="700">Только нужные узлы</text><text x="26" y="123" fill="#a8a4ad" font-size="16">станция · камера</text><text x="26" y="154" fill="#a8a4ad" font-size="16">аппликатор · интеграция</text><path d="M26 184h258" stroke="#39ef8a" stroke-width="3"/><text x="26" y="221" fill="#d8d5dc" font-size="15">Выход: рост без замены</text><text x="26" y="247" fill="#d8d5dc" font-size="15">проверенной основы</text></g>
    <path d="M378 310h54m-13-12 13 12-13 12M765 310h54m-13-12 13 12-13 12" fill="none" stroke="#39ef8a" stroke-width="3"/>
    <rect x="58" y="502" width="1084" height="64" rx="2" fill="#242228"/><text x="84" y="530" fill="#39ef8a" font-size="13" font-weight="700">ПРАВИЛО</text><text x="84" y="553" fill="#d8d5dc" font-size="16">Не масштабировать предположение. Масштабировать только проверенный процесс.</text>
  </g>
</svg>
