<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Подготовка источника для отчёта о нанесении</title>
  <desc id="desc">Пять проверок от закрытой смены до подписываемого черновика отчёта.</desc>
  <rect width="1200" height="620" fill="#111014"/>
  <text x="70" y="72" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="700" letter-spacing="2">ОТ ФАКТА ПРОИЗВОДСТВА К ДОКУМЕНТУ</text>
  <text x="70" y="116" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="700">В отчёт попадают только сверенные коды закрытой смены</text>
  <g font-family="IBM Plex Sans, sans-serif">
    <g transform="translate(70 190)"><rect width="188" height="230" fill="#1a191e" stroke="#38363f"/><text x="20" y="38" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">01 / СМЕНА</text><text x="20" y="82" fill="#f4f3f5" font-size="22" font-weight="700">Закрыть</text><text x="20" y="112" fill="#f4f3f5" font-size="22" font-weight="700">выпуск</text><text x="20" y="160" fill="#b8b5bd" font-size="16">дата</text><text x="20" y="188" fill="#b8b5bd" font-size="16">товар</text><text x="20" y="216" fill="#b8b5bd" font-size="16">оператор</text></g>
    <path d="M268 305H292" stroke="#31e981" stroke-width="3"/><path d="m284 297 9 8-9 8" fill="none" stroke="#31e981" stroke-width="3"/>
    <g transform="translate(304 190)"><rect width="188" height="230" fill="#1a191e" stroke="#38363f"/><text x="20" y="38" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">02 / КОДЫ</text><text x="20" y="82" fill="#f4f3f5" font-size="22" font-weight="700">Взять</text><text x="20" y="112" fill="#f4f3f5" font-size="22" font-weight="700">принятые</text><text x="20" y="160" fill="#b8b5bd" font-size="16">полный КМ</text><text x="20" y="188" fill="#b8b5bd" font-size="16">GTIN</text><text x="20" y="216" fill="#b8b5bd" font-size="16">серия</text></g>
    <path d="M502 305H526" stroke="#31e981" stroke-width="3"/><path d="m518 297 9 8-9 8" fill="none" stroke="#31e981" stroke-width="3"/>
    <g transform="translate(538 190)"><rect width="188" height="230" fill="#1a191e" stroke="#ff7a66"/><text x="20" y="38" fill="#ff7a66" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">03 / ИСКЛЮЧИТЬ</text><text x="20" y="82" fill="#f4f3f5" font-size="22" font-weight="700">Убрать</text><text x="20" y="112" fill="#f4f3f5" font-size="22" font-weight="700">лишнее</text><text x="20" y="160" fill="#b8b5bd" font-size="16">дубли</text><text x="20" y="188" fill="#b8b5bd" font-size="16">брак</text><text x="20" y="216" fill="#b8b5bd" font-size="16">отмены</text></g>
    <path d="M736 305H760" stroke="#31e981" stroke-width="3"/><path d="m752 297 9 8-9 8" fill="none" stroke="#31e981" stroke-width="3"/>
    <g transform="translate(772 190)"><rect width="188" height="230" fill="#1a191e" stroke="#e9b949"/><text x="20" y="38" fill="#e9b949" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">04 / СВЕРИТЬ</text><text x="20" y="82" fill="#f4f3f5" font-size="22" font-weight="700">Сопоставить</text><text x="20" y="112" fill="#f4f3f5" font-size="22" font-weight="700">итоги</text><text x="20" y="160" fill="#b8b5bd" font-size="16">единицы</text><text x="20" y="188" fill="#b8b5bd" font-size="16">короба</text><text x="20" y="216" fill="#b8b5bd" font-size="16">SSCC</text></g>
    <path d="M970 305H994" stroke="#31e981" stroke-width="3"/><path d="m986 297 9 8-9 8" fill="none" stroke="#31e981" stroke-width="3"/>
    <g transform="translate(1006 190)"><rect width="124" height="230" fill="#1f4f38" stroke="#31e981"/><text x="16" y="38" fill="#31e981" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700">05</text><text x="16" y="82" fill="#f4f3f5" font-size="21" font-weight="700">Создать</text><text x="16" y="112" fill="#f4f3f5" font-size="21" font-weight="700">черновик</text><text x="16" y="160" fill="#dff9ea" font-size="15">поля</text><text x="16" y="188" fill="#dff9ea" font-size="15">КМ</text><text x="16" y="216" fill="#dff9ea" font-size="15">подпись</text></g>
  </g>
  <rect x="70" y="466" width="1060" height="92" fill="#1a191e" stroke="#38363f"/>
  <text x="100" y="505" fill="#ffcf66" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700">КОНТРОЛЬНАЯ СУММА</text>
  <text x="100" y="536" fill="#f4f3f5" font-family="IBM Plex Sans, sans-serif" font-size="21" font-weight="700">Количество КМ в черновике = количество допустимых единиц после всех исключений.</text>
</svg>
