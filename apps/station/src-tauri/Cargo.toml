[package]
name = "markiro-station"
version = "1.2.0-beta.5"
description = "Markiro line station"
edition = "2021"
license = "Apache-2.0 OR MIT"

[lib]
name = "markiro_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
serialport = "4"
base64 = "0.22"
futures-util = "=0.3.33"
minisign-verify = "=0.2.5"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream"] }
tokio = { version = "=1.53.1", features = ["sync", "time"] }
zeroize = "=1.9.0"

[dev-dependencies]
futures-core = "=0.3.33"
http = "=1.4.2"
tauri = { version = "=2.11.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Printing",
  # PRINTER_INFO_2W (used by the spooler enumeration in printer.rs) is
  # gated behind these two features in windows-sys 0.61, on top of
  # Win32_Graphics_Printing.
  "Win32_Security",
  "Win32_System_Power",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
legacy-github-updater = []
