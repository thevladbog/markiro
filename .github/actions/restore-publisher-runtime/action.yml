name: Restore verified release catalog runtime
description: Restore only the dependencies built by the pinned preparation job
inputs:
  artifact-id:
    description: Immutable artifact ID from the preparation job
    required: true
  sha256:
    description: SHA-256 of the runtime archive from the preparation job
    required: true
runs:
  using: composite
  steps:
    - name: Require exact runtime artifact identity
      shell: bash
      env:
        RUNTIME_ARTIFACT_ID: ${{ inputs.artifact-id }}
        RUNTIME_SHA256: ${{ inputs.sha256 }}
      run: '[[ "$RUNTIME_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$RUNTIME_SHA256" =~ ^[0-9a-f]{64}$ ]]'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        artifact-ids: ${{ inputs.artifact-id }}
        digest-mismatch: error
        path: ${{ runner.temp }}/publisher-runtime
    - name: Verify and restore publisher dependencies
      shell: bash
      env:
        RUNTIME_SHA256: ${{ inputs.sha256 }}
      run: python3 -I tools/release-catalog/runtime-archive.py restore "$RUNNER_TEMP/publisher-runtime/publisher-runtime.zip" "$RUNTIME_SHA256"
