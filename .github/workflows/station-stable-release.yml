name: Publish station stable

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish, repair, or seed the one-time stable rollback baseline
        required: true
        type: choice
        default: publish
        options: [publish, promote-existing, seed-baseline]
      source_beta_tag:
        description: Exact accepted dual-origin Station beta tag; empty for seed-baseline
        required: false
        type: string
        default: ""
      acceptance_confirmed:
        description: Confirm beta acceptance; must remain false for seed-baseline
        required: true
        type: boolean
        default: false
      highlights:
        description: Optional Russian release highlights; publish only
        required: false
        type: string
        default: ""
      seed_stable_tag:
        description: Exact current legacy GitHub stable tag; seed-baseline only
        required: false
        type: string
        default: ""
      seed_infrastructure_evidence:
        description: Exact applied DNS-disabled infrastructure evidence JSON; seed-baseline only
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: station-stable-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    environment: station-stable
    permissions:
      actions: read
      contents: read
    env:
      VITE_STATION_API_URL: https://admin.markiro.app
    outputs:
      beta_version: ${{ steps.stable-state.outputs.beta_version }}
      base_sha: ${{ steps.stable-state.outputs.base_sha }}
      beta_release_sha: ${{ steps.stable-state.outputs.beta_release_sha }}
      github_beta_evidence_sha256: ${{ steps.stable-state.outputs.github_beta_evidence_sha256 }}
      yandex_beta_evidence_sha256: ${{ steps.stable-state.outputs.yandex_beta_evidence_sha256 }}
      version: ${{ steps.stable-state.outputs.version }}
      tag: ${{ steps.stable-state.outputs.tag }}
      previous_stable_tag: ${{ steps.stable-state.outputs.previous_stable_tag }}
      first_beta_tag: ${{ steps.stable-state.outputs.first_beta_tag }}
      release_sha: ${{ steps.stable-source.outputs.release_sha }}

    steps:
      - name: Checkout stable release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate stable dispatch inputs
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_BETA_TAG: ${{ inputs.source_beta_tag }}
          ACCEPTANCE_CONFIRMED: ${{ inputs.acceptance_confirmed }}
          HIGHLIGHTS: ${{ inputs.highlights }}
          SEED_STABLE_TAG: ${{ inputs.seed_stable_tag }}
          SEED_INFRASTRUCTURE_EVIDENCE: ${{ inputs.seed_infrastructure_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || exit 1
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || exit 1
          test "$MODE" = "publish" -o "$MODE" = "promote-existing" -o "$MODE" = "seed-baseline" || exit 1
          if [ "$MODE" = "seed-baseline" ]; then
            test -z "$SOURCE_BETA_TAG" || exit 1
            test "$ACCEPTANCE_CONFIRMED" = "false" || exit 1
            test -z "$HIGHLIGHTS" || exit 1
            [[ "$SEED_STABLE_TAG" =~ ^station-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
            test -n "$SEED_INFRASTRUCTURE_EVIDENCE" || exit 1
            test "$(printf '%s' "$SEED_INFRASTRUCTURE_EVIDENCE" | wc -c)" -le 262144 || exit 1
          else
            test "$ACCEPTANCE_CONFIRMED" = "true" || exit 1
            [[ "$SOURCE_BETA_TAG" =~ ^station-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.([1-9][0-9]*)$ ]] || exit 1
            test -z "$SEED_STABLE_TAG" || exit 1
            test -z "$SEED_INFRASTRUCTURE_EVIDENCE" || exit 1
          fi
          highlights_file="$RUNNER_TEMP/station-stable-highlights.txt"
          printf '%s' "$HIGHLIGHTS" > "$highlights_file"
          node --input-type=module - "$highlights_file" <<'NODE'
          import { readFileSync } from "node:fs";
          const text = readFileSync(process.argv[2], "utf8");
          if (
            Buffer.byteLength(text) > 8192 ||
            /[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/.test(text) ||
            /ghp_|github_pat_|TAURI_SIGNING_PRIVATE_KEY|api[_ -]?key|pairing_code/i.test(text)
          ) throw new Error("invalid station stable highlights");
          NODE
          printf 'mode=%s\nsource_beta_tag=%s\nhighlights_file=%s\nseed_stable_tag=%s\n' \
            "$MODE" "$SOURCE_BETA_TAG" "$highlights_file" "$SEED_STABLE_TAG" >> "$GITHUB_ENV"

      - name: Resolve and verify dual-origin accepted beta
        id: stable-state
        if: inputs.mode == 'publish' || inputs.mode == 'promote-existing'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          beta_release_json="$RUNNER_TEMP/station-beta-release.json"
          github_beta_dir="$RUNNER_TEMP/station-accepted-beta-github"
          yandex_beta_dir="$RUNNER_TEMP/station-accepted-beta-yandex"
          rm -rf "$github_beta_dir" "$yandex_beta_dir"
          mkdir "$yandex_beta_dir"
          gh release view "$source_beta_tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish > "$beta_release_json"
          beta_version="${source_beta_tag#station-v}"
          env -u GH_TOKEN -u GITHUB_TOKEN node tools/station-release/github-public.mjs \
            download-release beta "$beta_version" "$github_beta_dir"
          installer="markiro-station-${beta_version}-windows-x86_64-setup.exe"
          bundle="markiro-station-${beta_version}-windows-x86_64.nsis.zip"
          yandex_beta_base="https://releases.markiro.app/station/beta/releases/$beta_version"
          for asset in \
            "$installer" \
            "$bundle" \
            "$bundle.sig" \
            latest.json \
            SHA256SUMS \
            release-evidence.json \
            release-notes.md; do
            curl --fail --silent --show-error --max-redirs 0 --connect-timeout 15 \
              --output "$yandex_beta_dir/$asset" "$yandex_beta_base/$asset"
          done
          node tools/station-release/artifacts.mjs validate-origin github beta \
            "$github_beta_dir" "$beta_version"
          node tools/station-release/artifacts.mjs validate-origin yandex beta \
            "$yandex_beta_dir" "$beta_version"
          node tools/station-release/artifacts.mjs compare-origins \
            "$github_beta_dir" "$yandex_beta_dir" beta "$beta_version"
          github_evidence_path="$github_beta_dir/release-evidence.json"
          yandex_evidence_path="$yandex_beta_dir/release-evidence.json"
          base_sha="$(node -e 'const e=require(process.argv[1]);process.stdout.write(e.baseSha)' "$github_evidence_path")"
          beta_release_sha="$(node -e 'const e=require(process.argv[1]);process.stdout.write(e.releaseSha)' "$github_evidence_path")"
          beta_target_sha="$(node -e 'const r=require(process.argv[1]);process.stdout.write(r.targetCommitish)' "$beta_release_json")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$beta_release_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$beta_release_sha" = "$beta_target_sha"
          git cat-file -e "$base_sha^{commit}"
          git cat-file -e "$beta_release_sha^{commit}"
          diff_paths="$RUNNER_TEMP/station-beta-diff-paths.txt"
          git diff --name-only "$base_sha" "$beta_release_sha" > "$diff_paths"
          promotion_output="$RUNNER_TEMP/station-beta-promotion.txt"
          node tools/station-release/promotion.mjs validate-beta \
            "$beta_release_json" \
            "$github_evidence_path" \
            "$yandex_evidence_path" \
            "$github_beta_dir" \
            "$yandex_beta_dir" \
            "$diff_paths" \
            "$promotion_output"
          test "$base_sha" = "$(sed -n 's/^base_sha=//p' "$promotion_output")"
          test "$beta_release_sha" = "$(sed -n 's/^beta_release_sha=//p' "$promotion_output")"
          for required_path in \
            apps/station/src-tauri/tauri.stable.conf.json \
            tools/station-release/promotion.mjs \
            tools/station-release/changelog.mjs \
            tools/station-release/github-public.mjs \
            tools/station-release/origins.mjs \
            tools/station-release/release-summary.mjs \
            tools/station-release/stable-boundary.mjs \
            tools/station-release/yandex-publisher.mjs \
            .github/workflows/station-stable-release.yml; do
            git cat-file -e "$base_sha:$required_path"
          done
          git merge-base --is-ancestor "$base_sha" origin/main
          ci_ok=false
          for attempt in {1..90}; do
            ci_state="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$base_sha" --limit 20 --json status,conclusion,headSha --jq '.[] | select(.headSha == "'"$base_sha"'") | [.status, (.conclusion // "")] | @tsv' | head -n 1)"
            ci_status="${ci_state%%$'\t'*}"
            ci_conclusion="${ci_state#*$'\t'}"
            if [ "$ci_status" = "completed" ]; then
              test "$ci_conclusion" = "success"
              ci_ok=true
              break
            fi
            echo "Waiting for CI for accepted beta base (attempt $attempt/90; status: ${ci_status:-not found})"
            sleep 20
          done
          test "$ci_ok" = true
          github_beta_evidence_sha256="$(node -e 'const{createHash}=require("node:crypto"),{readFileSync}=require("node:fs");process.stdout.write(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"))' "$github_evidence_path")"
          yandex_beta_evidence_sha256="$(node -e 'const{createHash}=require("node:crypto"),{readFileSync}=require("node:fs");process.stdout.write(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"))' "$yandex_evidence_path")"
          tags_file="$RUNNER_TEMP/station-tags.txt"
          git tag --list 'station-v*' > "$tags_file"
          releases_file="$RUNNER_TEMP/station-releases.json"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 10001 \
            --json tagName,isDraft,isPrerelease,publishedAt > "$releases_file"
          release_state="$RUNNER_TEMP/station-stable-state.txt"
          node tools/station-release/stable-boundary.mjs resolve-state \
            "$mode" "$source_beta_tag" "$releases_file" "$tags_file" "$release_state"
          version="$(sed -n 's/^version=//p' "$release_state")"
          tag="$(sed -n 's/^tag=//p' "$release_state")"
          previous_stable_tag="$(sed -n 's/^previous_stable_tag=//p' "$release_state")"
          first_beta_tag="$(sed -n 's/^first_beta_tag=//p' "$release_state")"
          if [ "$mode" = "publish" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "immutable stable release already exists" >&2
              exit 1
            fi
          else
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,targetCommitish > "$RUNNER_TEMP/station-stable-release.json"
            node -e 'const r=require(process.argv[1]);if(r.tagName!==process.argv[2]||r.isDraft||r.isPrerelease||!/^[0-9a-f]{40}$/.test(r.targetCommitish))process.exit(1)' \
              "$RUNNER_TEMP/station-stable-release.json" "$tag"
          fi
          for output in "$GITHUB_ENV" "$GITHUB_OUTPUT"; do
            printf 'beta_version=%s\nbase_sha=%s\nbeta_release_sha=%s\ngithub_beta_evidence_sha256=%s\nyandex_beta_evidence_sha256=%s\nversion=%s\ntag=%s\nprevious_stable_tag=%s\nfirst_beta_tag=%s\n' \
              "$beta_version" "$base_sha" "$beta_release_sha" \
              "$github_beta_evidence_sha256" "$yandex_beta_evidence_sha256" \
              "$version" "$tag" "$previous_stable_tag" "$first_beta_tag" >> "$output"
          done

      - name: Prepare stable release source
        id: stable-source
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$base_sha"
          version_output="$RUNNER_TEMP/station-stable-version.txt"
          node tools/station-release/version.mjs set-stable "$version" "$version_output"
          test "$(sed -n 's/^version=//p' "$version_output")" = "$version"
          test "$(sed -n 's/^tag=//p' "$version_output")" = "$tag"
          test "$(git diff --name-only)" = $'apps/station/src-tauri/Cargo.toml\napps/station/src-tauri/tauri.conf.json'
          git diff --check
          git config user.name "markiro-release-bot"
          git config user.email "release-bot@markiro.local"
          git add apps/station/src-tauri/Cargo.toml apps/station/src-tauri/tauri.conf.json
          git commit -m "chore(station): prepare stable $version"
          release_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$base_sha"
          node --test tools/station-release/test/channel-config.test.mjs
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_ENV"
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Install locked workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build and verify stable source
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @markiro/domain build
          pnpm --filter @markiro/ui build
          pnpm --filter @markiro/db build
          pnpm --filter @markiro/station exec vitest run --maxWorkers=2 --testTimeout=30000
          pnpm --filter @markiro/station typecheck
          pnpm --filter @markiro/station lint
          pnpm --filter @markiro/station build
          pnpm test:station-release:contract
          cargo test --manifest-path apps/station/src-tauri/Cargo.toml
          git diff --check

      - name: Verify production station CORS
        if: inputs.mode == 'publish' || inputs.mode == 'promote-existing'
        run: pnpm verify:station-production-cors

      - name: Build signed stable Windows artifacts
        if: inputs.mode == 'publish'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | node tools/station-release/normalize-signing-key.mjs > /dev/null
          signing_key_file="$RUNNER_TEMP/station-stable-updater.key"
          trap 'rm -f "$signing_key_file"' EXIT
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$signing_key_file"
          chmod 600 "$signing_key_file"
          export TAURI_SIGNING_PRIVATE_KEY="$signing_key_file"
          pnpm --filter @markiro/station tauri build \
            --config src-tauri/tauri.stable.conf.json
          bundle_dir="apps/station/src-tauri/target/release/bundle/nsis"
          installer="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.exe' -print -quit)"
          bundle="$installer"
          signature="$bundle.sig"
          test -f "$installer" -a -f "$bundle" -a -f "$signature"
          input_dir="$RUNNER_TEMP/station-stable-input"
          rm -rf "$input_dir"
          mkdir "$input_dir"
          cp "$installer" "$input_dir/markiro-station-${version}-windows-x86_64-setup.exe"
          cp "$bundle" "$input_dir/markiro-station-${version}-windows-x86_64.nsis.zip"
          cp "$signature" "$input_dir/markiro-station-${version}-windows-x86_64.nsis.zip.sig"

      - name: Stage and validate dual-origin stable trees
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_metadata="-"
          previous_tree="-"
          first_beta_metadata="-"
          first_beta_tree="-"
          boundary_flags=()
          if [ -n "$previous_stable_tag" ]; then
            previous_metadata="$RUNNER_TEMP/station-previous-stable.json"
            previous_tree="$RUNNER_TEMP/station-previous-stable-public"
            gh release view "$previous_stable_tag" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,targetCommitish > "$previous_metadata"
            rm -rf "$previous_tree"
            env -u GH_TOKEN -u GITHUB_TOKEN node tools/station-release/github-public.mjs \
              download-release stable "${previous_stable_tag#station-v}" "$previous_tree"
            boundary_flags+=(--allow-legacy-previous)
          else
            first_beta_metadata="$RUNNER_TEMP/station-first-beta.json"
            first_beta_tree="$RUNNER_TEMP/station-first-beta-public"
            gh release view "$first_beta_tag" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,targetCommitish > "$first_beta_metadata"
            rm -rf "$first_beta_tree"
            env -u GH_TOKEN -u GITHUB_TOKEN node tools/station-release/github-public.mjs \
              download-release beta "${first_beta_tag#station-v}" "$first_beta_tree"
          fi
          boundary_output="$RUNNER_TEMP/station-stable-boundary.txt"
          node tools/station-release/stable-boundary.mjs resolve-changelog \
            "$base_sha" "$source_beta_tag" "$previous_metadata" "$previous_tree" \
            "$first_beta_metadata" "$first_beta_tree" "$boundary_output" \
            "${boundary_flags[@]}"
          from_sha="$(sed -n 's/^from_sha=//p' "$boundary_output")"
          previous_stable_base_sha="$(sed -n 's/^previous_stable_base_sha=//p' "$boundary_output")"
          to_sha="$base_sha"
          compare_url="https://github.com/$GITHUB_REPOSITORY/compare/${from_sha}...${to_sha}"
          metadata_path="$RUNNER_TEMP/station-stable-changelog.json"
          VERSION="$version" SOURCE_BETA_TAG="$source_beta_tag" \
          PREVIOUS_STABLE_TAG="$previous_stable_tag" FROM_SHA="$from_sha" TO_SHA="$to_sha" \
          COMPARE_URL="$compare_url" METADATA_PATH="$metadata_path" node --input-type=module <<'NODE'
          import { openSync, writeFileSync, closeSync } from "node:fs";
          const metadata = {
            version: process.env.VERSION,
            sourceBetaTag: process.env.SOURCE_BETA_TAG,
            previousStableTag: process.env.PREVIOUS_STABLE_TAG || null,
            fromSha: process.env.FROM_SHA,
            toSha: process.env.TO_SHA,
            compareUrl: process.env.COMPARE_URL,
          };
          const handle = openSync(process.env.METADATA_PATH, "wx", 0o600);
          try { writeFileSync(handle, `${JSON.stringify(metadata)}\n`); } finally { closeSync(handle); }
          NODE
          notes_path="$RUNNER_TEMP/station-stable-release-notes.md"
          node tools/station-release/changelog.mjs generate \
            "$metadata_path" "$highlights_file" "$notes_path"
          provenance_path="$RUNNER_TEMP/station-stable-provenance.json"
          SOURCE_BETA_TAG="$source_beta_tag" BETA_VERSION="$beta_version" \
          BETA_RELEASE_SHA="$beta_release_sha" BETA_EVIDENCE_SHA256="$github_beta_evidence_sha256" \
          PREVIOUS_STABLE_TAG="$previous_stable_tag" PREVIOUS_STABLE_BASE_SHA="$previous_stable_base_sha" \
          FROM_SHA="$from_sha" TO_SHA="$to_sha" PROVENANCE_PATH="$provenance_path" \
          node --input-type=module <<'NODE'
          import { openSync, writeFileSync, closeSync } from "node:fs";
          const provenance = {
            sourceBetaTag: process.env.SOURCE_BETA_TAG,
            betaVersion: process.env.BETA_VERSION,
            betaReleaseSha: process.env.BETA_RELEASE_SHA,
            betaEvidenceSha256: process.env.BETA_EVIDENCE_SHA256,
            acceptanceConfirmed: true,
            previousStableTag: process.env.PREVIOUS_STABLE_TAG || null,
            previousStableBaseSha: process.env.PREVIOUS_STABLE_BASE_SHA || null,
            changelogFromSha: process.env.FROM_SHA,
            changelogToSha: process.env.TO_SHA,
          };
          const handle = openSync(process.env.PROVENANCE_PATH, "wx", 0o600);
          try { writeFileSync(handle, `${JSON.stringify(provenance)}\n`); } finally { closeSync(handle); }
          NODE
          github_tree="$RUNNER_TEMP/station-stable-github"
          yandex_tree="$RUNNER_TEMP/station-stable-yandex"
          candidate="$RUNNER_TEMP/station-stable-candidate"
          rm -rf "$github_tree" "$yandex_tree" "$candidate"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          node tools/station-release/artifacts.mjs stage-origin github stable \
            "$RUNNER_TEMP/station-stable-input" "$github_tree" "$version" "$published_at" \
            "$base_sha" "$release_sha" "$notes_path" "$provenance_path"
          node tools/station-release/artifacts.mjs stage-origin yandex stable \
            "$RUNNER_TEMP/station-stable-input" "$yandex_tree" "$version" "$published_at" \
            "$base_sha" "$release_sha" "$notes_path" "$provenance_path"
          node tools/station-release/artifacts.mjs validate-origin github stable \
            "$github_tree" "$version"
          node tools/station-release/artifacts.mjs validate-origin yandex stable \
            "$yandex_tree" "$version"
          node tools/station-release/artifacts.mjs compare-origins \
            "$github_tree" "$yandex_tree" stable "$version"
          mkdir "$candidate"
          mv "$github_tree" "$candidate/github"
          mv "$yandex_tree" "$candidate/yandex"
          git bundle create "$RUNNER_TEMP/station-stable-candidate/source.bundle" \
            HEAD "^$base_sha"
          printf 'beta_version=%s\nbase_sha=%s\nbeta_release_sha=%s\ngithub_beta_evidence_sha256=%s\nyandex_beta_evidence_sha256=%s\nversion=%s\ntag=%s\nprevious_stable_tag=%s\nrelease_sha=%s\n' \
            "$beta_version" "$base_sha" "$beta_release_sha" \
            "$github_beta_evidence_sha256" "$yandex_beta_evidence_sha256" \
            "$version" "$tag" "$previous_stable_tag" "$release_sha" > "$candidate/release-state.txt"

      - name: Upload dual-origin stable candidate
        if: inputs.mode == 'publish'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: station-stable-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/station-stable-candidate
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    environment: station-release
    permissions:
      actions: read
      contents: write
    env:
      VITE_STATION_API_URL: https://admin.markiro.app

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Initialize bounded stable release summary
        env:
          INPUT_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/station-release/release-summary.mjs init \
            "$INPUT_MODE" "$RUNNER_TEMP/station-stable-release-summary.json"

      - name: Install locked publisher dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Download dual-origin stable candidate
        if: inputs.mode == 'publish'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: station-stable-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/station-stable-candidate

      - name: Resolve stable publication candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE_BETA_TAG: ${{ inputs.source_beta_tag }}
          INPUT_SEED_STABLE_TAG: ${{ inputs.seed_stable_tag }}
          BUILD_BETA_VERSION: ${{ needs.build.outputs.beta_version }}
          BUILD_BASE_SHA: ${{ needs.build.outputs.base_sha }}
          BUILD_BETA_RELEASE_SHA: ${{ needs.build.outputs.beta_release_sha }}
          BUILD_GITHUB_BETA_EVIDENCE_SHA256: ${{ needs.build.outputs.github_beta_evidence_sha256 }}
          BUILD_YANDEX_BETA_EVIDENCE_SHA256: ${{ needs.build.outputs.yandex_beta_evidence_sha256 }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          BUILD_TAG: ${{ needs.build.outputs.tag }}
          BUILD_PREVIOUS_STABLE_TAG: ${{ needs.build.outputs.previous_stable_tag }}
          BUILD_RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_beta_tag="$INPUT_SOURCE_BETA_TAG"
          if [ "$INPUT_MODE" = "publish" ]; then
            state="$RUNNER_TEMP/station-stable-candidate/release-state.txt"
            test -f "$state" -a ! -L "$state"
            beta_version="$(sed -n 's/^beta_version=//p' "$state")"
            base_sha="$(sed -n 's/^base_sha=//p' "$state")"
            beta_release_sha="$(sed -n 's/^beta_release_sha=//p' "$state")"
            github_beta_evidence_sha256="$(sed -n 's/^github_beta_evidence_sha256=//p' "$state")"
            yandex_beta_evidence_sha256="$(sed -n 's/^yandex_beta_evidence_sha256=//p' "$state")"
            version="$(sed -n 's/^version=//p' "$state")"
            tag="$(sed -n 's/^tag=//p' "$state")"
            previous_stable_tag="$(sed -n 's/^previous_stable_tag=//p' "$state")"
            release_sha="$(sed -n 's/^release_sha=//p' "$state")"
            git fetch "$RUNNER_TEMP/station-stable-candidate/source.bundle" "$release_sha"
            test "$(git rev-parse FETCH_HEAD)" = "$release_sha"
            git checkout --detach "$release_sha"
            node tools/station-release/artifacts.mjs validate-origin github stable \
              "$RUNNER_TEMP/station-stable-candidate/github" "$version"
            node tools/station-release/artifacts.mjs validate-origin yandex stable \
              "$RUNNER_TEMP/station-stable-candidate/yandex" "$version"
            node tools/station-release/artifacts.mjs compare-origins \
              "$RUNNER_TEMP/station-stable-candidate/github" \
              "$RUNNER_TEMP/station-stable-candidate/yandex" stable "$version"
            summary_source_beta_tag="$source_beta_tag"
            summary_base_sha="$base_sha"
            summary_github_beta_evidence_sha256="$github_beta_evidence_sha256"
            summary_yandex_beta_evidence_sha256="$yandex_beta_evidence_sha256"
          elif [ "$INPUT_MODE" = "promote-existing" ]; then
            beta_version="$BUILD_BETA_VERSION"
            base_sha="$BUILD_BASE_SHA"
            beta_release_sha="$BUILD_BETA_RELEASE_SHA"
            github_beta_evidence_sha256="$BUILD_GITHUB_BETA_EVIDENCE_SHA256"
            yandex_beta_evidence_sha256="$BUILD_YANDEX_BETA_EVIDENCE_SHA256"
            version="$BUILD_VERSION"
            tag="$BUILD_TAG"
            previous_stable_tag="$BUILD_PREVIOUS_STABLE_TAG"
            release_sha="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            summary_source_beta_tag="$source_beta_tag"
            summary_base_sha="$base_sha"
            summary_github_beta_evidence_sha256="$github_beta_evidence_sha256"
            summary_yandex_beta_evidence_sha256="$yandex_beta_evidence_sha256"
          else
            beta_version=""
            base_sha=""
            beta_release_sha=""
            github_beta_evidence_sha256=""
            yandex_beta_evidence_sha256=""
            version="$INPUT_SEED_STABLE_TAG"
            version="${version#station-v}"
            tag="$INPUT_SEED_STABLE_TAG"
            previous_stable_tag=""
            release_sha="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            summary_source_beta_tag="null"
            summary_base_sha="null"
            summary_github_beta_evidence_sha256="null"
            summary_yandex_beta_evidence_sha256="null"
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$tag" = "station-v$version"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          node tools/station-release/release-summary.mjs update \
            "$RUNNER_TEMP/station-stable-release-summary.json" \
            version "$version" \
            sourceBetaTag "$summary_source_beta_tag" \
            baseSha "$summary_base_sha" \
            releaseSha "$release_sha" \
            githubBetaEvidenceSha256 "$summary_github_beta_evidence_sha256" \
            yandexBetaEvidenceSha256 "$summary_yandex_beta_evidence_sha256"
          printf 'source_beta_tag=%s\nbeta_version=%s\nbase_sha=%s\nbeta_release_sha=%s\ngithub_beta_evidence_sha256=%s\nyandex_beta_evidence_sha256=%s\nversion=%s\ntag=%s\nprevious_stable_tag=%s\nrelease_sha=%s\n' \
            "$source_beta_tag" "$beta_version" "$base_sha" "$beta_release_sha" \
            "$github_beta_evidence_sha256" "$yandex_beta_evidence_sha256" \
            "$version" "$tag" "$previous_stable_tag" "$release_sha" >> "$GITHUB_ENV"

      - name: Publish immutable GitHub stable
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          github_tree="$RUNNER_TEMP/station-stable-candidate/github"
          candidate_ref="station-stable-release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "immutable GitHub stable release already exists" >&2
            exit 1
          fi
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth_header" push origin "HEAD:refs/heads/$candidate_ref"
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" github-publication-attempted
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$release_sha" \
            --title "Markiro Station $version" --notes-file "$github_tree/release-notes.md"
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" github-draft-created
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$github_tree"/*
          rm -rf "$RUNNER_TEMP/station-stable-github-public"
          mkdir "$RUNNER_TEMP/station-stable-github-public"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/station-stable-github-public"
          node tools/station-release/artifacts.mjs validate-origin github stable \
            "$RUNNER_TEMP/station-stable-github-public" "$version"
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" github-draft-assets-validated
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" github-undraft-attempted
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          rm -rf "$RUNNER_TEMP/station-stable-github-public"
          env -u GH_TOKEN -u GITHUB_TOKEN node tools/station-release/github-public.mjs \
            download-release stable "$version" "$RUNNER_TEMP/station-stable-github-public"
          node tools/station-release/artifacts.mjs validate-origin github stable \
            "$RUNNER_TEMP/station-stable-github-public" "$version"
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" github-public-validated

      - name: Publish immutable Yandex stable
        if: inputs.mode == 'publish'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_STATION_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY }}
          YANDEX_STATION_RELEASE_BUCKET: ${{ vars.YANDEX_STATION_RELEASE_BUCKET }}
          YANDEX_STATION_RELEASE_ENDPOINT: ${{ vars.YANDEX_STATION_RELEASE_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          cleanup_credentials() {
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          }
          trap cleanup_credentials EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          unset AWS_SESSION_TOKEN
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" \
            yandex-publication-attempted
          node tools/station-release/yandex-publisher.mjs publish-immutable \
            "$RUNNER_TEMP/station-stable-candidate/yandex" stable "$version"
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" both-origin-published

      - name: Download and validate public immutable stable trees
        if: inputs.mode == 'publish' || inputs.mode == 'promote-existing'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_STATION_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY }}
          YANDEX_STATION_RELEASE_BUCKET: ${{ vars.YANDEX_STATION_RELEASE_BUCKET }}
          YANDEX_STATION_RELEASE_ENDPOINT: ${{ vars.YANDEX_STATION_RELEASE_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          cleanup_credentials() {
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          }
          trap cleanup_credentials EXIT
          unset AWS_SESSION_TOKEN
          if [ "${{ inputs.mode }}" = "promote-existing" ]; then
            node tools/station-release/release-summary.mjs transition \
              "$RUNNER_TEMP/station-stable-release-summary.json" \
              existing-public-validation-started
          fi
          github_public="$RUNNER_TEMP/station-stable-github-public"
          yandex_public="$RUNNER_TEMP/station-stable-yandex-public"
          rm -rf "$github_public" "$yandex_public"
          mkdir "$yandex_public"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish \
            --jq 'select(.isDraft == false and .isPrerelease == false and .targetCommitish == "'"$release_sha"'") | .tagName')" = "$tag"
          unset GH_TOKEN GITHUB_TOKEN
          node tools/station-release/github-public.mjs download-release \
            stable "$version" "$github_public"
          installer="markiro-station-${version}-windows-x86_64-setup.exe"
          bundle="markiro-station-${version}-windows-x86_64.nsis.zip"
          yandex_release_base="https://releases.markiro.app/station/stable/releases/$version"
          for asset in \
            "$installer" \
            "$bundle" \
            "$bundle.sig" \
            latest.json \
            SHA256SUMS \
            release-evidence.json \
            release-notes.md; do
            curl --fail --silent --show-error --max-redirs 0 --connect-timeout 15 \
              --output "$yandex_public/$asset" "$yandex_release_base/$asset"
          done
          node tools/station-release/artifacts.mjs validate-origin github stable \
            "$github_public" "$version"
          node tools/station-release/artifacts.mjs validate-origin yandex stable \
            "$yandex_public" "$version"
          node tools/station-release/artifacts.mjs compare-origins \
            "$github_public" "$yandex_public" stable "$version"
          node tools/station-release/yandex-publisher.mjs validate-public \
            "$yandex_public" stable "$version"
          for evidence_path in \
            "$github_public/release-evidence.json" \
            "$yandex_public/release-evidence.json"; do
            SOURCE_BETA_TAG="$source_beta_tag" BETA_RELEASE_SHA="$beta_release_sha" \
            BETA_EVIDENCE_SHA256="$github_beta_evidence_sha256" BASE_SHA="$base_sha" \
            RELEASE_SHA="$release_sha" VERSION="$version" node -e '
              const e=require(process.argv[1]);
              if(e.sourceBetaTag!==process.env.SOURCE_BETA_TAG||e.betaReleaseSha!==process.env.BETA_RELEASE_SHA||e.betaEvidenceSha256!==process.env.BETA_EVIDENCE_SHA256||e.baseSha!==process.env.BASE_SHA||e.releaseSha!==process.env.RELEASE_SHA||e.version!==process.env.VERSION||e.acceptanceConfirmed!==true)process.exit(1)
            ' "$evidence_path"
          done
          sha256_file() {
            node -e 'const{createHash}=require("node:crypto"),{readFileSync}=require("node:fs");process.stdout.write(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"))' "$1"
          }
          names_prefix="markiro-station-${version}-windows-x86_64"
          node tools/station-release/release-summary.mjs update \
            "$RUNNER_TEMP/station-stable-release-summary.json" \
            githubManifestSha256 "$(sha256_file "$github_public/latest.json")" \
            yandexManifestSha256 "$(sha256_file "$yandex_public/latest.json")" \
            githubEvidenceSha256 "$(sha256_file "$github_public/release-evidence.json")" \
            yandexEvidenceSha256 "$(sha256_file "$yandex_public/release-evidence.json")" \
            installerSha256 "$(sha256_file "$github_public/${names_prefix}-setup.exe")" \
            bundleSha256 "$(sha256_file "$github_public/${names_prefix}.nsis.zip")" \
            signatureSha256 "$(sha256_file "$github_public/${names_prefix}.nsis.zip.sig")"
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" both-public-validated

      - name: Seed legacy stable rollback baseline
        if: inputs.mode == 'seed-baseline'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_STATION_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY }}
          YANDEX_STATION_RELEASE_BUCKET: ${{ vars.YANDEX_STATION_RELEASE_BUCKET }}
          YANDEX_STATION_RELEASE_ENDPOINT: ${{ vars.YANDEX_STATION_RELEASE_ENDPOINT }}
          SEED_STABLE_TAG: ${{ inputs.seed_stable_tag }}
          SEED_INFRASTRUCTURE_EVIDENCE: ${{ inputs.seed_infrastructure_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          cleanup_credentials() {
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          }
          trap cleanup_credentials EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          unset AWS_SESSION_TOKEN
          stable_releases="$RUNNER_TEMP/station-stable-seed-releases.json"
          latest_stable_output="$RUNNER_TEMP/station-stable-seed-latest.txt"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 10001 \
            --json tagName,isDraft,isPrerelease,publishedAt > "$stable_releases"
          node tools/station-release/stable-boundary.mjs resolve-latest-stable \
            "$stable_releases" "$latest_stable_output"
          seed_stable_tag="$SEED_STABLE_TAG"
          latest_stable_tag="$(tr -d '\r\n' < "$latest_stable_output")"
          test "$seed_stable_tag" = "$latest_stable_tag"
          release_metadata="$RUNNER_TEMP/station-stable-seed-release.json"
          infrastructure_evidence="$RUNNER_TEMP/station-stable-seed-infrastructure.json"
          github_tree="$RUNNER_TEMP/station-stable-seed-github"
          seed_backup="$RUNNER_TEMP/station-stable-yandex-seed-backup"
          bootstrap_record="$RUNNER_TEMP/station-stable-bootstrap-record.json"
          rm -rf "$github_tree" "$seed_backup"
          rm -f "$release_metadata" "$infrastructure_evidence" "$bootstrap_record"
          gh release view "$seed_stable_tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,targetCommitish > "$release_metadata"
          node -e 'const r=require(process.argv[1]);if(r.tagName!==process.argv[2]||r.isDraft||r.isPrerelease||!/^[0-9a-f]{40}$/.test(r.targetCommitish))process.exit(1)' \
            "$release_metadata" "$seed_stable_tag"
          env -u GH_TOKEN -u GITHUB_TOKEN node tools/station-release/github-public.mjs \
            download-release stable "${seed_stable_tag#station-v}" "$github_tree"
          test -n "$SEED_INFRASTRUCTURE_EVIDENCE"
          printf '%s' "$SEED_INFRASTRUCTURE_EVIDENCE" > "$infrastructure_evidence"
          chmod 600 "$release_metadata" "$infrastructure_evidence"
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" \
            seed-publication-attempted
          node tools/station-release/yandex-publisher.mjs seed-baseline \
            "$github_tree" "$seed_stable_tag" "$release_metadata" \
            "$infrastructure_evidence" stable "$seed_backup" "$bootstrap_record" \
            --confirm-empty-channel-bootstrap
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" \
            seeded-and-provider-verified

      - name: Preserve stable baseline recovery evidence
        if: always() && inputs.mode == 'seed-baseline'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: station-stable-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/station-stable-yandex-seed-backup
            ${{ runner.temp }}/station-stable-bootstrap-record.json
          if-no-files-found: warn
          retention-days: 30

      - name: Promote stable mutable targets
        if: inputs.mode == 'publish' || inputs.mode == 'promote-existing'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_STATION_RELEASE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY }}
          YANDEX_STATION_RELEASE_BUCKET: ${{ vars.YANDEX_STATION_RELEASE_BUCKET }}
          YANDEX_STATION_RELEASE_ENDPOINT: ${{ vars.YANDEX_STATION_RELEASE_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          unset AWS_SESSION_TOKEN
          github_may_have_changed=false
          yandex_may_have_changed=false
          restoration_failed=false
          yandex_backup="$RUNNER_TEMP/station-stable-yandex-channel-backup"

          rollback_transaction() {
            status="$?"
            trap - EXIT HUP INT TERM
            if [ "$status" -eq 0 ]; then
              unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
              return 0
            fi
            if [ "$yandex_may_have_changed" = true ]; then
              if ! node tools/station-release/yandex-publisher.mjs rollback stable "$yandex_backup"; then
                restoration_failed=true
              fi
            fi
            if [ "$github_may_have_changed" = true ]; then
              if ! gh release upload station-stable-channel --repo "$GITHUB_REPOSITORY" \
                "$RUNNER_TEMP/station-stable-github-channel-backup/latest.json" --clobber; then
                restoration_failed=true
              else
                if ! rm -rf "$RUNNER_TEMP/station-stable-github-rollback-verify" || \
                  ! mkdir "$RUNNER_TEMP/station-stable-github-rollback-verify"; then
                  restoration_failed=true
                elif ! env -u GH_TOKEN -u GITHUB_TOKEN \
                  node tools/station-release/github-public.mjs download-channel stable \
                    "$RUNNER_TEMP/station-stable-github-rollback-verify/latest.json" || \
                  ! cmp "$RUNNER_TEMP/station-stable-github-rollback-verify/latest.json" \
                    "$RUNNER_TEMP/station-stable-github-channel-backup/latest.json"; then
                  restoration_failed=true
                fi
              fi
            fi
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            if [ "$restoration_failed" = true ]; then
              node tools/station-release/release-summary.mjs transition \
                "$RUNNER_TEMP/station-stable-release-summary.json" \
                restoration-failed >/dev/null 2>&1 || true
              echo "station release mutable restoration failed" >&2
              exit 86
            fi
            if [ "$github_may_have_changed" = true ] || [ "$yandex_may_have_changed" = true ]; then
              node tools/station-release/release-summary.mjs transition \
                "$RUNNER_TEMP/station-stable-release-summary.json" \
                restored >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap rollback_transaction EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          rm -rf "$RUNNER_TEMP/station-stable-github-channel-backup"
          mkdir "$RUNNER_TEMP/station-stable-github-channel-backup"
          test "$(gh release view station-stable-channel --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == true) | .tagName')" = \
            "station-stable-channel"
          env -u GH_TOKEN -u GITHUB_TOKEN node tools/station-release/github-public.mjs \
            download-channel stable \
            "$RUNNER_TEMP/station-stable-github-channel-backup/latest.json"
          test -f "$RUNNER_TEMP/station-stable-github-channel-backup/latest.json"

          rm -rf "$yandex_backup"
          node tools/station-release/yandex-publisher.mjs backup-mutables stable "$yandex_backup"

          github_tree="$RUNNER_TEMP/station-stable-github-public"
          test -d "$github_tree"
          rm -rf "$RUNNER_TEMP/station-stable-github-channel-upload"
          mkdir "$RUNNER_TEMP/station-stable-github-channel-upload"
          cp "$github_tree/latest.json" "$RUNNER_TEMP/station-stable-github-channel-upload/latest.json"
          github_may_have_changed=true
          gh release upload station-stable-channel --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/station-stable-github-channel-upload/latest.json" --clobber
          rm -rf "$RUNNER_TEMP/station-stable-github-channel-verify"
          mkdir "$RUNNER_TEMP/station-stable-github-channel-verify"
          env -u GH_TOKEN -u GITHUB_TOKEN node tools/station-release/github-public.mjs \
            download-channel stable "$RUNNER_TEMP/station-stable-github-channel-verify/latest.json"
          cmp "$RUNNER_TEMP/station-stable-github-channel-verify/latest.json" "$github_tree/latest.json"
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" github-promoted

          yandex_may_have_changed=true
          node tools/station-release/yandex-publisher.mjs promote \
            "$RUNNER_TEMP/station-stable-yandex-public" stable "$yandex_backup"
          rm -rf "$RUNNER_TEMP/station-stable-yandex-channel-verify"
          mkdir "$RUNNER_TEMP/station-stable-yandex-channel-verify"
          curl --fail --silent --show-error --max-redirs 0 --connect-timeout 15 \
            --output "$RUNNER_TEMP/station-stable-yandex-channel-verify/latest.json" \
            "https://releases.markiro.app/station/stable/latest.json"
          curl --fail --silent --show-error --max-redirs 0 --connect-timeout 15 \
            --output "$RUNNER_TEMP/station-stable-yandex-channel-verify/download" \
            "https://releases.markiro.app/station/download"
          cmp "$RUNNER_TEMP/station-stable-yandex-channel-verify/latest.json" \
            "$RUNNER_TEMP/station-stable-yandex-public/latest.json"
          cmp "$RUNNER_TEMP/station-stable-yandex-channel-verify/download" \
            "$RUNNER_TEMP/station-stable-yandex-public/markiro-station-${version}-windows-x86_64-setup.exe"
          node tools/station-release/release-summary.mjs transition \
            "$RUNNER_TEMP/station-stable-release-summary.json" all-promoted

      - name: Summarize stable release
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node tools/station-release/release-summary.mjs render \
            "$RUNNER_TEMP/station-stable-release-summary.json" "$GITHUB_STEP_SUMMARY"

      - name: Cleanup owned candidate ref and stable release material
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          if [ "${{ inputs.mode }}" = "publish" ]; then
            candidate_ref="station-stable-release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$candidate_ref"
          fi
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          rm -rf \
            "$RUNNER_TEMP/station-stable-candidate" \
            "$RUNNER_TEMP/station-stable-github-public" \
            "$RUNNER_TEMP/station-stable-yandex-public" \
            "$RUNNER_TEMP/station-stable-github-channel-backup" \
            "$RUNNER_TEMP/station-stable-github-channel-upload" \
            "$RUNNER_TEMP/station-stable-github-channel-verify" \
            "$RUNNER_TEMP/station-stable-github-rollback-verify" \
            "$RUNNER_TEMP/station-stable-yandex-channel-backup" \
            "$RUNNER_TEMP/station-stable-yandex-channel-verify" \
            "$RUNNER_TEMP/station-stable-seed-github" \
            "$RUNNER_TEMP/station-stable-seed-release.json" \
            "$RUNNER_TEMP/station-stable-seed-infrastructure.json" \
            "$RUNNER_TEMP/station-stable-seed-releases.json" \
            "$RUNNER_TEMP/station-stable-seed-latest.txt"
