name: Build handheld release

# Produces a signed APK and, only when asked, publishes it to the channel the
# terminals poll. Building is the safe default: a run that merely produces an
# artifact changes nothing anyone is downloading.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build a release or refresh only the current download URL
        required: true
        type: choice
        default: release
        options: [release, sync-download]
      bump:
        description: Which part of the version this release moves
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      owner_confirmation:
        description: Type BUILD-HANDHELD-RELEASE; only the repository owner may dispatch
        required: true
        type: string
      publish:
        description: Publish to the channel terminals poll. Leave off to only build the artifact.
        required: false
        type: boolean
        default: false
      channel:
        description: Which channel to publish to
        required: false
        type: choice
        default: stable
        options: [stable, beta]

permissions:
  contents: read

concurrency:
  group: handheld-release
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      # Resolve the version with the tooling from this exact release source.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Authorize handheld release owner
        shell: bash
        env:
          OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_ACTOR" = "$RELEASE_OWNER"
          test "$OWNER_CONFIRMATION" = "BUILD-HANDHELD-RELEASE"

      # The version is computed from what the channel actually serves, never
      # typed. `versionCode` especially: typed by hand it is a repeat waiting to
      # happen, and a repeat is an update every installed terminal silently
      # refuses -- visible on a factory floor and nowhere else.
      #
      # The channel pointer is public, so this needs no credential, and it runs
      # here so that everything it can refuse is refused before the release job
      # puts a signing key on a runner.
      - name: Resolve the next version
        if: inputs.action != 'sync-download'
        id: version
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          node tools/handheld-release/resolve.mjs

  release:
    if: github.ref == 'refs/heads/main' && inputs.action != 'sync-download'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: handheld-release
    defaults:
      run:
        working-directory: apps/handheld
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Before the key exists on the runner. `pnpm install` runs whatever
      # lifecycle scripts the dependency tree carries, and there is no reason
      # for any of them to run in a process that can read a signing key or an
      # object-storage credential.
      - name: Install publishing dependencies
        if: ${{ inputs.publish }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Restore the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MARKIRO_HANDHELD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          # Outside the workspace so no build step, artifact upload or cache can
          # pick it up by accident.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/handheld.jks"
          test -s "$RUNNER_TEMP/handheld.jks"

      - name: Gates
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build the signed release
        shell: bash
        env:
          MARKIRO_HANDHELD_STORE_FILE: ${{ runner.temp }}/handheld.jks
          MARKIRO_HANDHELD_STORE_PASSWORD: ${{ secrets.MARKIRO_HANDHELD_STORE_PASSWORD }}
          MARKIRO_HANDHELD_KEY_ALIAS: ${{ secrets.MARKIRO_HANDHELD_KEY_ALIAS }}
          MARKIRO_HANDHELD_KEY_PASSWORD: ${{ secrets.MARKIRO_HANDHELD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease \
            -Pmarkiro.versionName="${{ needs.authorize.outputs.version_name }}" \
            -Pmarkiro.versionCode="${{ needs.authorize.outputs.version_code }}"

      - name: Prove the artifact is signed and name it
        shell: bash
        env:
          VERSION_NAME: ${{ needs.authorize.outputs.version_name }}
        run: |
          set -euo pipefail
          # An unsigned APK is what an absent key produces, and it installs
          # nowhere -- so the build "succeeding" is not evidence by itself.
          test ! -f app/build/outputs/apk/release/app-release-unsigned.apk
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/markiro-tsd-$VERSION_NAME.apk"
          {
            echo "### Markiro ТСД $VERSION_NAME (${{ needs.authorize.outputs.version_code }})"
            echo
            echo "- source: \`$GITHUB_SHA\`"
            echo "- sha256: \`$(shasum -a 256 "$APK" | cut -d' ' -f1)\`"
            echo
            echo 'Signing certificate:'
            echo '```'
            "$APKSIGNER" verify --print-certs "$APK" | grep -i 'digest\|DN'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The key has done its job the moment the signature is proven. Nothing
      # below needs it, so it goes before publication runs at all.
      - name: Discard the signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/handheld.jks"

      # Publication runs only after the signature has been proven, and it moves
      # the channel pointer after verifying immutable artifacts, then refreshes
      # the download URL. The storage credential is scoped
      # to this one command and to no build step.
      - name: Publish to the channel
        if: ${{ inputs.publish }}
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          YANDEX_STATION_RELEASE_ENDPOINT: https://storage.yandexcloud.net
          YANDEX_STATION_RELEASE_BUCKET: ${{ vars.YANDEX_STATION_RELEASE_BUCKET }}
          YANDEX_STATION_RELEASE_ACCESS_KEY_ID: ${{ secrets.YANDEX_STATION_RELEASE_ACCESS_KEY_ID }}
          YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test ! -f "$RUNNER_TEMP/handheld.jks"
          node tools/handheld-release/publish.mjs \
            "$RUNNER_TEMP/out/markiro-tsd-${{ needs.authorize.outputs.version_name }}.apk" \
            "${{ needs.authorize.outputs.version_name }}" \
            "${{ needs.authorize.outputs.version_code }}" \
            "${{ inputs.channel }}" | tee "$RUNNER_TEMP/published.txt"
          {
            echo
            echo "Опубликовано в канал \`${{ inputs.channel }}\`:"
            echo '```'
            cat "$RUNNER_TEMP/published.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-tsd-${{ needs.authorize.outputs.version_name }}
          path: ${{ runner.temp }}/out/markiro-tsd-${{ needs.authorize.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

  sync-download:
    if: github.ref == 'refs/heads/main' && inputs.action == 'sync-download'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: handheld-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install publishing dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Refresh the current download URL
        env:
          CHANNEL: ${{ inputs.channel }}
          YANDEX_STATION_RELEASE_ENDPOINT: https://storage.yandexcloud.net
          YANDEX_STATION_RELEASE_BUCKET: ${{ vars.YANDEX_STATION_RELEASE_BUCKET }}
          YANDEX_STATION_RELEASE_ACCESS_KEY_ID: ${{ secrets.YANDEX_STATION_RELEASE_ACCESS_KEY_ID }}
          YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY }}
        run: node tools/handheld-release/download.mjs
