name: Build handheld release

# Produces a signed APK and stops there. Publication to a store is a separate,
# deliberate act: this workflow only makes the artifact and proves what it is.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version shown to the operator, for example 0.2.0
        required: true
        type: string
      version_code:
        description: Monotonic integer; a store refuses an upload that does not grow it
        required: true
        type: string
      owner_confirmation:
        description: Type BUILD-HANDHELD-RELEASE; only the repository owner may dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: handheld-release
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Authorize handheld release owner
        shell: bash
        env:
          OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_ACTOR" = "$RELEASE_OWNER"
          test "$OWNER_CONFIRMATION" = "BUILD-HANDHELD-RELEASE"
          # A store rejects a malformed name and silently orders by the code, so
          # both are checked before any signing material is touched.
          printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          # `versionCode` is an Android int. Without the bound the value passes
          # here and only fails inside Gradle -- by which time the key has
          # already been written to the runner.  Ten digits at most keeps the
          # comparison below inside shell arithmetic.
          printf '%s' "$VERSION_CODE" | grep -Eq '^[1-9][0-9]{0,9}$'
          test "$VERSION_CODE" -le 2147483647

  release:
    if: github.ref == 'refs/heads/main'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: handheld-release
    defaults:
      run:
        working-directory: apps/handheld
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Restore the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MARKIRO_HANDHELD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          # Outside the workspace so no build step, artifact upload or cache can
          # pick it up by accident.
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/handheld.jks"
          test -s "$RUNNER_TEMP/handheld.jks"

      - name: Gates
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build the signed release
        shell: bash
        env:
          MARKIRO_HANDHELD_STORE_FILE: ${{ runner.temp }}/handheld.jks
          MARKIRO_HANDHELD_STORE_PASSWORD: ${{ secrets.MARKIRO_HANDHELD_STORE_PASSWORD }}
          MARKIRO_HANDHELD_KEY_ALIAS: ${{ secrets.MARKIRO_HANDHELD_KEY_ALIAS }}
          MARKIRO_HANDHELD_KEY_PASSWORD: ${{ secrets.MARKIRO_HANDHELD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease \
            -Pmarkiro.versionName="${{ inputs.version_name }}" \
            -Pmarkiro.versionCode="${{ inputs.version_code }}"

      - name: Prove the artifact is signed and name it
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          # An unsigned APK is what an absent key produces, and it installs
          # nowhere -- so the build "succeeding" is not evidence by itself.
          test ! -f app/build/outputs/apk/release/app-release-unsigned.apk
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/markiro-tsd-$VERSION_NAME.apk"
          {
            echo "### Markiro ТСД $VERSION_NAME (${{ inputs.version_code }})"
            echo
            echo "- source: \`$GITHUB_SHA\`"
            echo "- sha256: \`$(shasum -a 256 "$APK" | cut -d' ' -f1)\`"
            echo
            echo 'Signing certificate:'
            echo '```'
            "$APKSIGNER" verify --print-certs "$APK" | grep -i 'digest\|DN'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Discard the signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/handheld.jks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-tsd-${{ inputs.version_name }}
          path: ${{ runner.temp }}/out/markiro-tsd-${{ inputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30
