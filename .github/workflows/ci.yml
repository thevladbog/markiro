  station-rust:
    needs: classify-changes
    if: needs.classify-changes.outputs.station_rust == 'true'
    runs-on: ubuntu-latest
    # WebKit pulls a large dependency tree and GitHub's Azure apt mirror can
    # occasionally take more than 20 minutes to serve it before Rust even runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux webkit and serial deps
        # libudev is required by the `serialport` crate on Linux only (the
        # scanner reader) — it is absent from the runner image, so cargo's
        # build script panics without it. macOS and Windows need no equivalent.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libudev-dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: pnpm install --frozen-lockfile
      # `tauri::generate_context!` needs `apps/station/dist` to exist at
      # compile time, so the webview (and its workspace deps' `dist/`) must
      # be built before cargo ever touches src-tauri.
      - name: Build station webview + workspace deps
        run: pnpm turbo build --filter '@markiro/station...'
      - name: cargo build + test (station core)
        run: |
          cargo build --manifest-path apps/station/src-tauri/Cargo.toml
          cargo test  --manifest-path apps/station/src-tauri/Cargo.toml

  station-windows-build:
    needs: classify-changes
    if: needs.classify-changes.outputs.station_windows_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
