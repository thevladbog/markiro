name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The verification gate is split into three isolated jobs so they run on
# separate runners in parallel. Each job still executes its own Turbo slice
# with `--concurrency=1 --force`: the serialization decision from
# "fix(ci): serialize the full verification gate" is preserved inside every
# runner — only process-isolated jobs overlap, so the API e2e suite keeps a
# whole runner (and the only Postgres) to itself. The local full gate stays
# `pnpm turbo lint typecheck test build --concurrency=1 --force`.
jobs:
  classify-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.affected.outputs.full }}
      verify_static: ${{ steps.affected.outputs.verify_static }}
      verify_api_tests: ${{ steps.affected.outputs.verify_api_tests }}
      verify_app_tests: ${{ steps.affected.outputs.verify_app_tests }}
      tenant_team_infrastructure: ${{ steps.affected.outputs.tenant_team_infrastructure }}
      production_bundle: ${{ steps.affected.outputs.production_bundle }}
      platform_contracts: ${{ steps.affected.outputs.platform_contracts }}
      landing_browser: ${{ steps.affected.outputs.landing_browser }}
      landing_lighthouse: ${{ steps.affected.outputs.landing_lighthouse }}
      saas_admin_browser: ${{ steps.affected.outputs.saas_admin_browser }}
      cabinet_station_galleries: ${{ steps.affected.outputs.cabinet_station_galleries }}
      station_rust: ${{ steps.affected.outputs.station_rust }}
      station_windows_build: ${{ steps.affected.outputs.station_windows_build }}
      signer_rust: ${{ steps.affected.outputs.signer_rust }}
      signer_windows_build: ${{ steps.affected.outputs.signer_windows_build }}
      handheld_android: ${{ steps.affected.outputs.handheld_android }}
      standalone_rust: ${{ steps.affected.outputs.standalone_rust }}
      standalone_windows_build: ${{ steps.affected.outputs.standalone_windows_build }}
      standalone_app_tests: ${{ steps.affected.outputs.standalone_app_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_base="$PR_BASE_SHA"
            diff_head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE_SHA" =~ ^0{40}$ ]]; then
            diff_base="$PUSH_BEFORE_SHA"
            diff_head="$PUSH_HEAD_SHA"
          else
            node tools/ci/affected.mjs --full --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$diff_base" =~ ^[0-9a-f]{40}$ || ! "$diff_head" =~ ^[0-9a-f]{40}$ ]]; then
            node tools/ci/affected.mjs --full --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT
          if git diff --name-only --no-renames -z "$diff_base" "$diff_head" > "$diff_file"; then
            node tools/ci/affected.mjs --stdin-zero --github-output "$GITHUB_OUTPUT" < "$diff_file"
          else
            node tools/ci/affected.mjs --full --github-output "$GITHUB_OUTPUT"
          fi

  verify-static:
    needs: classify-changes
    if: needs.classify-changes.outputs.verify_static == 'true'
    runs-on: ubuntu-latest
    # Successful runs 27.09-16.10.2026: median 10.8 min, longest 13.5 min. A
    # 15-minute budget left 1.5 minutes, so one slow runner cancelled the job
    # after its steps were green. 20 keeps a hung job bounded.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Manifests pin exact versions, so a sweep has to use `pnpm update
      # --latest`, which crosses majors indiscriminately. These two steps are
      # what make that safe: the guard fails on a breaking version change
      # against `tools/dependency-baseline.json`, and its own tests keep the
      # guard from silently degrading into one that always passes.
      - run: pnpm check:deps
      - run: pnpm test:dependency-guard
      - run: pnpm test:indexnow
      - run: pnpm test:rospatent
      # The cloud → standalone export (plan IMP): its pure tests run here, its
      # SQL test skips without a database and runs in verify-api-tests. The
      # export's SSCC rules are compared with packages/domain, so build that
      # first (the comparison skips explicitly when it is not built).
      - run: pnpm turbo run build --filter=@markiro/domain
      - run: pnpm test:standalone-export
      - run: pnpm test:handheld-release:contract
      # The maker's tool for the encrypted usage statistics of a support text.
      - run: pnpm test:standalone-support:contract
      # The CI policy suite guards this very file -- the reviewed workflow list,
      # the classifier's job gating, the trigger scopes. It was in the repository
      # but in no workflow, so a workflow added without registering it stayed
      # green for as long as nobody ran the guard by hand.
      - run: pnpm test:ci-policy
      - run: pnpm turbo lint typecheck build --concurrency=1 --force

  verify-api-tests:
    needs: classify-changes
    if: needs.classify-changes.outputs.verify_api_tests == 'true'
    runs-on: ubuntu-latest
    # The db+api matrix finished all seven tasks in 29:08 on run 36059314055,
    # but the 30-minute job budget cancelled the runner after its green summary
    # because checkout, install, and migrations count toward the same budget.
    # Successful runs 27.09-16.10.2026 took a median of 32.8 and at most 38.8
    # minutes, so 40 left 1.2 minutes; 50 restores about 30% headroom.
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: markiro
          POSTGRES_PASSWORD: markiro
          POSTGRES_DB: markiro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U markiro" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://markiro:markiro@localhost:5432/markiro
      INVENTORY_TEST_DATABASE_URL: postgres://markiro:markiro@localhost:5432/markiro
      SUPPORT_CHAT_ISOLATED_DB: "1"
      SUPPORT_CHAT_TEST_MAINTENANCE_URL: postgres://markiro:markiro@localhost:5432/markiro
      BETTER_AUTH_SECRET: insecure-dummy-ci-placeholder-not-a-secret
      BETTER_AUTH_URL: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:5173
      PLATFORM_AUTH_SECRET: insecure-dummy-ci-platform-auth-placeholder-not-a-secret
      PLATFORM_AUTH_URL: http://localhost:3000
      SAAS_ADMIN_ORIGIN: http://localhost:5473
      KIOSK_ORIGIN: http://localhost:5373
      PAIRING_CODE_PEPPER: insecure-dummy-ci-pairing-pepper-not-a-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Minted per run rather than hardcoded: the signer suites only need *a*
      # valid 32-byte key, and a literal one here reads as a leaked secret to
      # scanners.
      - name: Mint a throwaway CHZ token encryption key
        run: echo "CHZ_TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markiro/db db:migrate
      # export.sql of the cloud → standalone export against the migrated
      # cloud schema; it seeds and removes two tenants of its own.
      - run: pnpm test:standalone-export
        env:
          STANDALONE_EXPORT_TEST_DATABASE_URL: postgres://markiro:markiro@localhost:5432/markiro
      # `api#test` already declares `dependsOn: @markiro/db#test`, so the two
      # Postgres consumers stay serialized against the single database here.
      - run: pnpm turbo test --filter=@markiro/db --filter=@markiro/api --concurrency=1 --force

  verify-app-tests:
    needs: classify-changes
    if: needs.classify-changes.outputs.verify_app_tests == 'true'
    runs-on: ubuntu-latest
    # The app suites (admin, kiosk, station, domain, ui, ...) take 11-15 min on
    # a hosted runner as of 2026-09-18; at 15 the job was cut off after every
    # step had already passed (shown as "cancelled"). A wall-clock budget for
    # the whole job, not a test timeout.
    # Successful runs 27.09-16.10.2026: median 17.4, longest 22.9 minutes, so 25
    # left 2.1 minutes; 30 restores about 30% headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ubuntu-latest moved to 26.04, where /tmp is a tmpfs. Astro moves the
      # prerendered assets out of apps/landing/.astro with rename(), so the
      # landing render tests' build into os.tmpdir() failed with EXDEV (run
      # 39546812945). Temporary directories stay on the workspace disk; turbo
      # passes TMPDIR through (turbo.json globalPassThroughEnv).
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # No Postgres and no DATABASE_URL on purpose: every suite in this slice
      # is database-free, and a suite that grows a database dependency must
      # move to verify-api-tests instead of silently skipping here. The
      # standalone app's suite runs in standalone-app-tests: added to this
      # slice it ran past the 25-minute budget (run 38221455774).
      - run: pnpm turbo test --filter=!@markiro/db --filter=!@markiro/api --filter=!@markiro/standalone --concurrency=1 --force

  standalone-app-tests:
    needs: classify-changes
    if: needs.classify-changes.outputs.standalone_app_tests == 'true'
    runs-on: ubuntu-latest
    # The suite (187 files, 5555 tests) took 130 s locally on 4 workers
    # against 133 s for the station's, which takes 6 min on a hosted runner
    # (run 38221455774); run 38221455774 cut it off still running after
    # 4.6 min. About 6 min of tests plus checkout, install and the domain/ui
    # builds: a wall-clock budget for the whole job, not a test timeout.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Database-free like verify-app-tests; Turbo builds the app's workspace
      # dependencies (domain, ui) first.
      - run: pnpm turbo test --filter=@markiro/standalone --concurrency=1 --force

  tenant-team-infrastructure:
    needs: classify-changes
    if: needs.classify-changes.outputs.tenant_team_infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      LOCAL_INFRA_SMOKE: "1"
      DATABASE_URL: postgres://markiro:markiro@127.0.0.1:5432/markiro
      BETTER_AUTH_SECRET: insecure-dummy-ci-placeholder-not-a-secret
      BETTER_AUTH_URL: http://127.0.0.1:3000
      ADMIN_ORIGIN: http://127.0.0.1:5173
      PLATFORM_AUTH_SECRET: insecure-dummy-ci-platform-auth-placeholder-not-a-secret
      PLATFORM_AUTH_URL: http://127.0.0.1:3000
      SAAS_ADMIN_ORIGIN: http://127.0.0.1:5473
      PAIRING_CODE_PEPPER: insecure-dummy-ci-pairing-pepper-not-a-secret
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM_EMAIL: no-reply@markiro.local
      SMTP_FROM_NAME: Markiro
      MAIL_PAYLOAD_ENCRYPTION_KEY: bW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW0=
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: markiro-private
      S3_ACCESS_KEY_ID: markiro
      S3_SECRET_ACCESS_KEY: markiro-development-only
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL, Mailpit, and SeaweedFS
        run: >-
          docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 120
          postgres mailpit seaweedfs
      - run: pnpm --filter @markiro/db db:migrate
      - name: Build API workspace dependencies
        run: pnpm turbo build --filter '@markiro/api...'
      - name: Run tenant provisioning and activation tests
        run: >-
          pnpm --filter @markiro/api exec vitest run
          test/provision-tenant-owner.e2e.test.ts
          test/tenant-owner-activation.e2e.test.ts
      - name: Run real SMTP and object-storage smoke
        run: >-
          pnpm --filter @markiro/api exec vitest run
          test/local-infrastructure.e2e.test.ts
      - name: Verify National Catalog images in private S3 storage
        run: >-
          pnpm --filter @markiro/api exec vitest run
          test/national-catalog-image.test.ts
      - name: Show infrastructure logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color
      - name: Stop local infrastructure
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes

  production-bundle:
    needs: classify-changes
    if: needs.classify-changes.outputs.production_bundle == 'true'
    # Pinned: on ubuntu-26.04 (ubuntu-latest since October 2026) the backup
    # harness's recovery-image export fails with ERR_RECOVERY_IMAGE (runs
    # 39549522646, 39544537071; 24.04 passes). Move together with a harness fix.
    runs-on: ubuntu-24.04
    # The platform gate only: what the Timeweb host runs (API image, platform
    # edge with its PDF/A check, roles/TLS, backups, recovery, the stack) and
    # the contract suites the platform release re-runs. The retired Yandex
    # contour left CI on 2026-10-21; the landing, SaaS-admin and cabinet/station
    # browser suites run in their own jobs below. On run 39454185717 these steps
    # took about 21 minutes of the old 55-minute job, image builds without a
    # layer cache included.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # deploy/platform/ci-stack.mjs smokes the stack in this Chromium.
      - name: Install Chromium for the platform stack browser smoke
        run: |
          pnpm --dir tools/production-browser --ignore-workspace install --frozen-lockfile
          pnpm --dir tools/production-browser --ignore-workspace exec playwright install --with-deps chromium
      - name: Build legal verifier dependencies
        run: |
          pnpm --filter @markiro/domain build
          pnpm --filter @markiro/legal-documents build
      # The platform release (release-platform-images.yml) re-runs this suite
      # before it builds anything, so a change that breaks it must fail here.
      - name: Verify production bundle contracts
        run: pnpm test:production-bundle:contract
      # Layer cache only: pull requests read what main wrote, and only main
      # writes, so pull requests cannot evict each other from the 10 GB Actions
      # cache. The platform release still builds both images from scratch.
      # `use: false`: the backup and recovery harnesses below run plain
      # `docker build` and need the default builder, whose results land in the
      # local image store. Only the two cached builds name this one.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          use: false
          # Removed explicitly below, before the recovery harness.
          cleanup: false
      - name: Build local SHA-tagged API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/production/api.Dockerfile
          tags: ghcr.io/thevladbog/markiro-api:${{ github.sha }}
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=platform-api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=platform-api,mode=max,ignore-error=true' || '' }}
      - name: Build local platform-only edge preparation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/platform/edge.Dockerfile
          tags: ghcr.io/thevladbog/markiro-platform-edge:${{ github.sha }}
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=platform-edge
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=platform-edge,mode=max,ignore-error=true' || '' }}
      # The recovery harness accepts only an empty Docker host: no container,
      # no volume. The cache builder runs as a container with a state volume.
      - name: Remove the image cache builder
        run: docker buildx rm "${{ steps.buildx.outputs.name }}"
      - name: Verify isolated PostgreSQL roles and TLS
        run: |
          pnpm --filter @markiro/db build
          node deploy/platform/postgres/roles-ci.mjs --local-ci
      - name: Verify isolated PostgreSQL backup and restore
        run: node deploy/platform/backup/backup-ci.mjs --local-ci --export-image "$RUNNER_TEMP/platform-recovery-image"
      - name: Preserve verified recovery worker image
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-recovery-worker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-recovery-image/recovery-image.tar
            ${{ runner.temp }}/platform-recovery-image/recovery-image.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Verify isolated ICU PostgreSQL backup and restore
        run: node deploy/platform/backup/backup-ci.mjs --local-ci --icu --export-image "$RUNNER_TEMP/platform-recovery-image-icu"
      - name: Preserve verified ICU recovery worker image
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-recovery-worker-icu-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-recovery-image-icu/recovery-image.tar
            ${{ runner.temp }}/platform-recovery-image-icu/recovery-image.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Verify isolated failed-activation recovery integration
        run: sudo --preserve-env=RUNNER_TEMP,GITHUB_SHA "$(command -v node)" deploy/platform/recovery-ci.mjs --local-ci
      - name: Verify isolated platform-only preparation stack
        env:
          MARKIRO_SOURCE_SHA: ${{ github.sha }}
          PLATFORM_CI_EVIDENCE_DIR: ${{ runner.temp }}/platform-preparation-evidence
        run: node deploy/platform/ci-stack.mjs --local-ci
      - name: Preserve platform preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-preparation-evidence
          path: ${{ runner.temp }}/platform-preparation-evidence
          if-no-files-found: ignore

  # The deploy/platform Node contracts, split off production-bundle. They are
  # CPU-bound: each slow case starts hundreds of real fake-docker processes
  # through the production process adapter (~70 ms of CPU each), and on one
  # 4-vCPU runner the suite took 252-367 s however its files were arranged.
  # `--test-shard` splits the files by index, so a new test file always lands
  # in one of the shards.
  platform-contracts:
    needs: classify-changes
    if: needs.classify-changes.outputs.platform_contracts == 'true'
    # The same image as production-bundle, where these contracts ran before.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: platform-contracts (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # deploy/platform/browser-smoke.mjs resolves @playwright/test from here.
      - name: Install the browser harness package
        run: pnpm --dir tools/production-browser --ignore-workspace install --frozen-lockfile
      - name: Verify portable platform preparation contracts
        # The host executor rejects ambient Compose overrides.
        run: env -u COMPOSE_PROJECT_NAME node --test --test-shard=${{ matrix.shard }}/2 deploy/platform/test/*.test.mjs

  # The landing is built once, with the environment both gates expect
  # (tools/production-browser/scripts/landing-build.mjs), and the browser and
  # Lighthouse jobs judge the same files.
  landing-build:
    needs: classify-changes
    if: needs.classify-changes.outputs.landing_browser == 'true' || needs.classify-changes.outputs.landing_lighthouse == 'true'
    # The browser gates ran on 24.04 inside production-bundle; their thresholds
    # were tuned there, so the landing jobs stay on the same image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the landing's workspace dependencies
        run: pnpm turbo run build --filter='@markiro/landing^...'
      - name: Build the landing once for both gates
        run: node tools/production-browser/scripts/landing-build.mjs
      - name: Hand the build to the browser and Lighthouse jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: landing-dist-${{ github.sha }}-${{ github.run_attempt }}
