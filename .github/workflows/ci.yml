  standalone-rust:
    needs: classify-changes
    if: needs.classify-changes.outputs.standalone_rust == 'true'
    runs-on: ubuntu-latest
    # Same WebKit apt headroom as station-rust.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux webkit and serial deps
        # libudev is required by the `serialport` crate on Linux only (the
        # shell's COM scanners and printers, plan 2a4), as in station-rust.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libudev-dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: cargo fmt --check (standalone workspace)
        run: cargo fmt --manifest-path apps/standalone/Cargo.toml --all -- --check
      # `tauri::generate_context!` needs `apps/standalone/dist` at compile time.
      - name: Build standalone webview + workspace deps
        run: pnpm turbo build --filter '@markiro/standalone...'
      # `--no-fail-fast`: one run reports the failures of every test binary,
      # not only those of the first one that fails.
      - name: cargo build + test (protocol, host and shell)
        run: |
          cargo build --manifest-path apps/standalone/Cargo.toml --workspace
          cargo test  --manifest-path apps/standalone/Cargo.toml --workspace --no-fail-fast

  # The installer half of the standalone Windows build; the Windows tests run
  # beside it in standalone-windows-tests (they shared one serial job of
  # ~55-60 minutes until the split). The runbooks name this job and its artifact.
  standalone-windows-build:
    needs: classify-changes
    if: needs.classify-changes.outputs.standalone_windows_build == 'true'
    runs-on: windows-latest
    # Measured on the serial job: setup with pnpm install ~5 min, release host
    # ~6 min, NSIS installer ~6.5 min, smoke ~1.5 min, plus the webview build:
    # ~20-25 min. The smoke step's own 25-minute bound must fit inside.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The notes draft below reads the history since the previous release.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: pnpm install --frozen-lockfile
      # The contracts of the installer's own inputs (this workflow, smoke.ps1,
      # prepare.mjs, the notes draft): checked before anything is built.
      - run: pnpm test:standalone-release:contract
      # The Tauri bundle embeds `apps/standalone/dist`.
      - name: Build standalone webview + workspace deps
        run: pnpm turbo build --filter '@markiro/standalone...'
      - name: Build the host for the installer
        run: cargo build --release --locked --manifest-path apps/standalone/Cargo.toml -p markiro-host
      # The release host trusts the production keys alone (spec 2026-10-13
      # §5.2, plan ЛЦ-1): a test key (`test-…`) never reaches an installer.
      - name: The release host trusts no test key
        shell: bash
        run: |
          kids="$(apps/standalone/target/release/markiro-host.exe trust-keys)"
          printf '%s\n' "$kids"
          # A here-string, not a pipe: under pipefail an early `grep -q` exit
          # could SIGPIPE printf and hide a match.
          if grep -q '^test-' <<<"$kids"; then
            echo "the release host trusts a test key" >&2
            exit 1
          fi
      # Tauri bundles `bundle.externalBin` from src-tauri/binaries under the
      # target triple; tauri.installer.conf.json names it.
      - name: Put the host beside the app as its sidecar
        shell: bash
        run: |
          mkdir -p apps/standalone/src-tauri/binaries
          cp apps/standalone/target/release/markiro-host.exe \
            apps/standalone/src-tauri/binaries/markiro-host-x86_64-pc-windows-msvc.exe
      - name: Build the installer (NSIS, per machine, with roles)
        run: pnpm --filter @markiro/standalone tauri build --config src-tauri/tauri.installer.conf.json --bundles nsis
      - name: Install, crash, reinstall and uninstall on this runner
        shell: pwsh
        # Each installer run is bounded inside the script; this stops a hang
        # that is not an installer run (the first Windows run waited 49 minutes).
        timeout-minutes: 25
        run: ./tools/standalone-release/smoke.ps1 -BundleDir apps/standalone/target/release/bundle/nsis
      - name: Prepare the installer artifact
        shell: pwsh
        # On pull_request GITHUB_SHA is the synthetic merge commit: the
        # evidence names the head that was reviewed.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $installer = Get-ChildItem apps/standalone/target/release/bundle/nsis/*-setup.exe
          $status = (Get-AuthenticodeSignature $installer.FullName).Status.ToString()
          node tools/standalone-release/prepare.mjs `
            --bundle-dir apps/standalone/target/release/bundle/nsis `
            --output-dir "$env:RUNNER_TEMP/standalone-installer" `
            --source-repository "$env:GITHUB_REPOSITORY" `
            --source-sha "$env:PR_HEAD_SHA" `
            --authenticode $status
      # A draft of the release notes for the owner to review and edit; it
      # is not a release asset (not in SHA256SUMS) and nothing signs it here.
      - name: Draft the release notes
        shell: pwsh
        run: node tools/standalone-release/draft-notes.mjs --output-dir "$env:RUNNER_TEMP/standalone-installer"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-installer-${{ github.sha }}
          path: ${{ runner.temp }}/standalone-installer
          if-no-files-found: error
          retention-days: 30

  # The Windows test half of the standalone build, beside the installer job and
  # gated by the same classifier output; ci-required needs both.
  standalone-windows-tests:
    needs: classify-changes
    if: needs.classify-changes.outputs.standalone_windows_build == 'true'
    runs-on: windows-latest
    # Measured on the serial job: setup with pnpm install ~5 min, the cold
    # debug build plus ~1900 tests 36-40 min, the load-test compile and the
    # webview build a few minutes: ~50 min, with headroom for a slow runner.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: pnpm install --frozen-lockfile
      # `tauri::generate_context!` needs `apps/standalone/dist` at compile time.
      - name: Build standalone webview + workspace deps
        run: pnpm turbo build --filter '@markiro/standalone...'
      # The export tool compares its SSCC rules with packages/domain, built
      # by the step above (the test skips without it).
      - run: pnpm test:standalone-export
      # The Windows service entry point and its installer seam only compile on
      # Windows, so this job (with the installer job's release build) is the
      # only one that exercises them. `--no-fail-fast` as in standalone-rust:
      # every Windows-only failure in one run.
      # The load-test crate (apps/standalone/loadtest, ~170 tests that start real
      # in-process hosts) is a dev/acceptance tool and added ~5.5 minutes to this
      # job; standalone-rust runs it on ubuntu, so it is excluded here and only
      # compiled by the next step. Trade-off: its Windows-only code (procstat
      # PowerShell vitals, scenario skips) broke on Windows once (two tests failed
      # only there in PR #778); a regression like that is now caught only when the
      # load test is run on Windows (runbook docs/runbooks/standalone-load-test.md
      # section 14, workflow standalone-load.yml), not by this job.
      - name: cargo test (Windows paths)
        run: cargo test --manifest-path apps/standalone/Cargo.toml --workspace --exclude markiro-loadtest --no-fail-fast
      # Compile-only: the host and proto libraries are already built by the step
      # above (same debug profile), so this adds the loadtest crate and its few
      # own dependencies, not another test run.
      - name: load test crate compiles on Windows
        run: cargo test --no-run -p markiro-loadtest --manifest-path apps/standalone/Cargo.toml

  handheld-android:
    needs: classify-changes
    if: needs.classify-changes.outputs.handheld_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/handheld
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Verify shared offline grant fixtures
        run: |
          cmp ../../packages/platform-contracts/fixtures/offline-grants-v1.json app/src/test/resources/offline-grants-v1.json
          cmp ../../packages/platform-contracts/fixtures/offline-grant-budgets-v1.json app/src/test/resources/offline-grant-budgets-v1.json
      - name: Unit tests, lint, debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  ci-required:
    needs:
      - classify-changes
      - verify-static
      - verify-api-tests
      - verify-app-tests
      - tenant-team-infrastructure
      - production-bundle
      - platform-contracts
      - station-rust
      - station-windows-build
      - signer-rust
      - signer-windows-build
      - handheld-android
      - standalone-rust
      - standalone-windows-build
      - standalone-windows-tests
      - standalone-app-tests
      - landing-browser
      - landing-lighthouse
      - saas-admin-browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify required CI results
        id: result
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci/required-results.mjs --needs-env CI_NEEDS_JSON
