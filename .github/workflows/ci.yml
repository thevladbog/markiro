  landing-browser:
    needs: [classify-changes, landing-build]
    if: needs.classify-changes.outputs.landing_browser == 'true'
    runs-on: ubuntu-24.04
    # 210 tests took 4 minutes on run 39454185717.
    timeout-minutes: 20
    steps:
      - name: Reserve browser harness ports
        # Every browser job reserves the same range first. The
        # tools/production-browser harnesses listen on fixed ports, and
        # 43179-43188 lie inside the runner's ephemeral range (32768-60999).
        # Suites run back to back, so a loopback connection from one can be
        # handed such a port as its source port and hold it, TIME_WAIT
        # included, when the next `--strictPort` server starts: run 36201712862
        # failed with "Port 43182 is already in use". Reserved ports are never
        # assigned automatically; an explicit listen on them still works.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=43179-43188
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Chromium
        run: |
          pnpm --dir tools/production-browser --ignore-workspace install --frozen-lockfile
          pnpm --dir tools/production-browser --ignore-workspace exec playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: landing-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/landing/dist
      - name: Verify the landing browser release gate
        env:
          MARKIRO_LANDING_PREBUILT: "1"
        run: pnpm test:landing:browser

  landing-lighthouse:
    needs: [classify-changes, landing-build]
    if: needs.classify-changes.outputs.landing_lighthouse == 'true'
    runs-on: ubuntu-24.04
