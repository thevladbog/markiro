name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: markiro
          POSTGRES_PASSWORD: markiro
          POSTGRES_DB: markiro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U markiro" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://markiro:markiro@localhost:5432/markiro
      BETTER_AUTH_SECRET: insecure-dummy-ci-placeholder-not-a-secret
      BETTER_AUTH_URL: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:5173
      KIOSK_ORIGIN: http://localhost:5373
      PAIRING_CODE_PEPPER: insecure-dummy-ci-pairing-pepper-not-a-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter @markiro/db db:migrate
      - run: pnpm turbo lint typecheck test build --concurrency=1 --force

  tenant-team-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      LOCAL_INFRA_SMOKE: "1"
      DATABASE_URL: postgres://markiro:markiro@127.0.0.1:5432/markiro
      BETTER_AUTH_SECRET: insecure-dummy-ci-placeholder-not-a-secret
      BETTER_AUTH_URL: http://127.0.0.1:3000
      ADMIN_ORIGIN: http://127.0.0.1:5173
      PAIRING_CODE_PEPPER: insecure-dummy-ci-pairing-pepper-not-a-secret
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM_EMAIL: no-reply@markiro.local
      SMTP_FROM_NAME: Markiro
      MAIL_PAYLOAD_ENCRYPTION_KEY: bW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW0=
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: markiro-private
      S3_ACCESS_KEY_ID: markiro
      S3_SECRET_ACCESS_KEY: markiro-development-only
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL, Mailpit, and MinIO
        run: >-
          docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 120
          postgres mailpit minio
      - name: Initialize the private development bucket
        run: docker compose -f docker-compose.dev.yml run --rm minio-init
      - run: pnpm --filter @markiro/db db:migrate
      - name: Build API workspace dependencies
        run: pnpm turbo build --filter '@markiro/api...'
      - name: Run real SMTP and object-storage smoke
        run: >-
          pnpm --filter @markiro/api exec vitest run
          test/provision-tenant-owner.e2e.test.ts
          test/tenant-owner-activation.e2e.test.ts
          test/local-infrastructure.e2e.test.ts
      - name: Show infrastructure logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color
      - name: Stop local infrastructure
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes

  production-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: markiro-production
      MARKIRO_IMAGE_TAG: ${{ github.sha }}
      MARKIRO_API_IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      MARKIRO_EDGE_IMAGE_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      MARKIRO_DOMAIN: localhost
      MARKIRO_KIOSK_DOMAIN: kiosk.localhost
      MARKIRO_HTTP_PORT: "18080"
      MARKIRO_HTTPS_PORT: "18443"
      ACME_EMAIL: ci@markiro.local
    steps:
      - name: Initialize protected production environment
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/markiro-production-test.env"
          umask 077
          : > "$env_file"
          chmod 600 "$env_file"
          printf '%s\n' "MARKIRO_ENV_FILE=$env_file" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for production documentation smoke
        run: |
          pnpm --dir tools/production-browser --ignore-workspace install --frozen-lockfile
          pnpm --dir tools/production-browser --ignore-workspace exec playwright install --with-deps chromium
      - name: Verify Yandex runtime contracts
        run: pnpm test:yandex-runtime
      - name: Verify production bundle contracts
        run: pnpm test:production-bundle:contract
      - name: Generate masked test-only environment
        run: |
          set -euo pipefail
          better_auth_secret="$(openssl rand -base64 48)"
          pairing_code_pepper="$(openssl rand -hex 32)"
          mail_payload_key="$(openssl rand -base64 32)"
          smtp_user="markiro-ci"
          smtp_password="$(openssl rand -hex 24)"
          database_url="postgresql://markiro:markiro@postgres:5432/markiro"
          for credential in \
            "$better_auth_secret" \
            "$pairing_code_pepper" \
            "$mail_payload_key" \
            "$smtp_user" \
            "$smtp_password" \
            "$database_url" \
            "markiro" \
            "markiro-development-only"; do
            echo "::add-mask::$credential"
          done
          umask 077
          {
            printf '%s\n' "DATABASE_URL=$database_url"
            printf '%s\n' "BETTER_AUTH_SECRET=$better_auth_secret"
            printf '%s\n' "BETTER_AUTH_URL=https://localhost:18443"
            printf '%s\n' "ADMIN_ORIGIN=https://localhost:18443"
            printf '%s\n' "KIOSK_ORIGIN=https://kiosk.localhost:18443"
            printf '%s\n' "PAIRING_CODE_PEPPER=$pairing_code_pepper"
            printf '%s\n' "SMTP_HOST=mailpit"
            printf '%s\n' "SMTP_PORT=1025"
            printf '%s\n' "SMTP_SECURE=false"
            printf '%s\n' "SMTP_USER=$smtp_user"
            printf '%s\n' "SMTP_PASSWORD=$smtp_password"
            printf '%s\n' "SMTP_FROM_EMAIL=no-reply@markiro.local"
            printf '%s\n' "SMTP_FROM_NAME=Markiro CI"
            printf '%s\n' "SMTP_REPLY_TO="
            printf '%s\n' "MAIL_PAYLOAD_ENCRYPTION_KEY=$mail_payload_key"
            printf '%s\n' "S3_ENDPOINT=http://minio:9000"
            printf '%s\n' "S3_REGION=us-east-1"
            printf '%s\n' "S3_BUCKET=markiro-private"
            printf '%s\n' "S3_ACCESS_KEY_ID=markiro"
            printf '%s\n' "S3_SECRET_ACCESS_KEY=markiro-development-only"
            printf '%s\n' "S3_FORCE_PATH_STYLE=true"
          } > "$MARKIRO_ENV_FILE"
          chmod 600 "$MARKIRO_ENV_FILE"
      - name: Build local SHA-tagged production images
        run: |
          docker build --file deploy/production/api.Dockerfile --tag "ghcr.io/thevladbog/markiro-api:${{ github.sha }}" .
          docker build --file deploy/production/edge.Dockerfile --tag "ghcr.io/thevladbog/markiro-edge:${{ github.sha }}" .
      - name: Validate the production bundle
        run: node deploy/production/preflight.mjs
      - name: Start production-bundle dependencies
        run: >-
          docker compose --env-file "$MARKIRO_ENV_FILE" -f compose.production.yml
          -f deploy/production/compose.ci.yml up -d --wait --wait-timeout 120
          postgres mailpit minio
      - name: Initialize the test bucket
        run: >-
          docker compose --env-file "$MARKIRO_ENV_FILE" -f compose.production.yml
          -f deploy/production/compose.ci.yml run --rm minio-init
      - name: Run production migrations twice
        run: |
          docker compose --env-file "$MARKIRO_ENV_FILE" -f compose.production.yml -f deploy/production/compose.ci.yml run --rm migrate
          docker compose --env-file "$MARKIRO_ENV_FILE" -f compose.production.yml -f deploy/production/compose.ci.yml run --rm migrate
      - name: Start the API and edge
        run: >-
          docker compose --env-file "$MARKIRO_ENV_FILE" -f compose.production.yml
          -f deploy/production/compose.ci.yml up -d --wait --wait-timeout 120 --no-deps api edge
      - name: Smoke the production bundle
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: MARKIRO_SMOKE_CI_OVERLAY=1 SMOKE_ASSERT_DEPENDENCY_ISOLATION=1 SMOKE_ASSERT_SHUTDOWN=1 node deploy/production/smoke.mjs
      - name: Browser-smoke production API documentation
        run: pnpm test:production-docs:browser
      - name: Show sanitized production-bundle logs on failure
        if: failure()
        run: >-
          docker compose --env-file "$MARKIRO_ENV_FILE" -f compose.production.yml
          -f deploy/production/compose.ci.yml logs --no-color
      - name: Remove production-bundle containers and volumes
        if: always()
        run: >-
          docker compose --env-file "$MARKIRO_ENV_FILE" -f compose.production.yml
          -f deploy/production/compose.ci.yml down --volumes --remove-orphans

  station-rust:
    runs-on: ubuntu-latest
    # WebKit pulls a large dependency tree and GitHub's Azure apt mirror can
    # occasionally take more than 20 minutes to serve it before Rust even runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux webkit and serial deps
        # libudev is required by the `serialport` crate on Linux only (the
        # scanner reader) — it is absent from the runner image, so cargo's
        # build script panics without it. macOS and Windows need no equivalent.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libudev-dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: pnpm install --frozen-lockfile
      # `tauri::generate_context!` needs `apps/station/dist` to exist at
      # compile time, so the webview (and its workspace deps' `dist/`) must
      # be built before cargo ever touches src-tauri.
      - name: Build station webview + workspace deps
        run: pnpm turbo build --filter '@markiro/station...'
      - name: cargo build + test (station core)
        run: |
          cargo build --manifest-path apps/station/src-tauri/Cargo.toml
          cargo test  --manifest-path apps/station/src-tauri/Cargo.toml

  station-windows-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: pnpm install --frozen-lockfile
      - name: Verify station release contracts
        run: pnpm test:station-release:contract
      # vite can't resolve `@markiro/ui`/`@markiro/db`/`@markiro/domain`
      # without their `dist/` present, and `tauri build` needs the webview
      # built for the same reason as the `station-rust` job above.
      - name: Build station webview + workspace deps
        run: pnpm turbo build --filter '@markiro/station...'
      - name: Compile the Windows Tauri application
        run: pnpm --filter @markiro/station tauri build --debug --no-bundle
