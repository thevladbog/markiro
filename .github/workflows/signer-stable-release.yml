name: Publish signer stable

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish a new version or repair the one pending draft
        required: true
        type: choice
        default: publish
        options: [publish, repair]
      bump:
        description: Semantic bump for publish; ignored by repair
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      owner_confirmation:
        description: Type PUBLISH-SIGNER-STABLE; only the repository owner may dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: us-development-locked-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SIGNER_RELEASE_REPOSITORY: thevladbog/markiro-station-releases

jobs:
  authorize:
    # US development is not releasable. Re-enable only through an approved change.
    if: ${{ false }}
    # Before US release lock: if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Authorize signer stable release owner
        shell: bash
        env:
          OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_ACTOR" = "$RELEASE_OWNER"
          test "$OWNER_CONFIRMATION" = "PUBLISH-SIGNER-STABLE"
          test "$RELEASE_MODE" = "publish" -o "$RELEASE_MODE" = "repair"
          test "$RELEASE_BUMP" = "patch" -o "$RELEASE_BUMP" = "minor" -o "$RELEASE_BUMP" = "major"

  state:
    # US development is not releasable. Re-enable only through an approved change.
    if: ${{ false }}
    # Before US release lock: if: github.ref == 'refs/heads/main'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: station-release
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve GitHub and Yandex stable state
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATION_RELEASE_REPOSITORY_TOKEN }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/signer-releases.json"
          manifest="$RUNNER_TEMP/signer-latest.json"
          gh release list --repo "$SIGNER_RELEASE_REPOSITORY" --limit 200 \
            --json tagName,isDraft,isPrerelease > "$releases"
          curl --fail --silent --show-error --max-redirs 0 --connect-timeout 15 \
            --retry 3 --retry-all-errors --retry-max-time 30 \
            --output "$manifest" \
            https://releases.markiro.app/signer/stable/latest.json
          RELEASES_FILE="$releases" MANIFEST_FILE="$manifest" node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          import { assertValidSignerManifest } from "./tools/signer-release/manifest.mjs";
          import { resolveSignerReleaseAction } from "./tools/signer-release/version.mjs";

          const releases = JSON.parse(await readFile(process.env.RELEASES_FILE, "utf8"));
          const manifest = JSON.parse(await readFile(process.env.MANIFEST_FILE, "utf8"));
          assertValidSignerManifest(manifest);
          const action = resolveSignerReleaseAction({
            mode: process.env.RELEASE_MODE,
            bump: process.env.RELEASE_BUMP,
            githubPublishedTags: releases
              .filter((release) => !release.isDraft && !release.isPrerelease)
              .map((release) => release.tagName),
            githubDraftTags: releases
              .filter((release) => release.isDraft)
              .map((release) => release.tagName),
            yandexVersion: manifest.version,
          });
          await appendFile(
            process.env.GITHUB_OUTPUT,
            `mode=${action.mode}\nversion=${action.version}\ntag=${action.tag}\n`,
          );
          NODE

  release:
    # US development is not releasable. Re-enable only through an approved change.
    if: ${{ false }}
    # Before US release lock: if: inputs.mode == 'publish'
    needs: [authorize, state]
    runs-on: windows-latest
    timeout-minutes: 60
    environment: station-release
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.state.outputs.version }}
      RELEASE_TAG: ${{ needs.state.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Configure release working paths
        shell: bash
        run: |
          printf 'VERSION_OVERLAY=%s\n' "$RUNNER_TEMP/signer-version-overlay.json" >> "$GITHUB_ENV"
          printf 'RELEASE_DIR=%s\n' "$RUNNER_TEMP/signer-release" >> "$GITHUB_ENV"

      - name: Install locked workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Prepare the effective release version
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNER_TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNER_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_KEY_PASSWORD"
          RELEASE_VERSION="$RELEASE_VERSION" VERSION_OVERLAY="$VERSION_OVERLAY" \
            node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { buildTauriVersionOverlay } from "./tools/signer-release/version.mjs";
          await writeFile(
            process.env.VERSION_OVERLAY,
            `${JSON.stringify(buildTauriVersionOverlay(process.env.RELEASE_VERSION))}\n`,
          );
          NODE
          pnpm test:signer-release:contract

      - name: Verify the signer before releasing it
        shell: bash
        run: |
          set -euo pipefail
          pnpm turbo build --filter '@markiro/signer...'
          pnpm --filter @markiro/signer test
          pnpm --filter @markiro/signer typecheck
          pnpm --filter @markiro/signer lint
          cargo test --manifest-path apps/signer/Cargo.toml

      - name: Build signed Windows artifacts
        id: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNER_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNER_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | node tools/station-release/normalize-signing-key.mjs > /dev/null
          signing_key_file="$RUNNER_TEMP/signer-stable-updater.key"
          trap 'rm -f "$signing_key_file"' EXIT
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$signing_key_file"
          chmod 600 "$signing_key_file"
          export TAURI_SIGNING_PRIVATE_KEY="$signing_key_file"
          pnpm --filter @markiro/signer tauri build \
            --config src-tauri/tauri.stable.conf.json \
            --config "$VERSION_OVERLAY"
          bundle_dir="apps/signer/target/release/bundle/nsis"
          test -n "$(find "$bundle_dir" -maxdepth 1 -type f -name '*-setup.exe' -print -quit)"
          printf 'bundle_dir=%s\n' "$bundle_dir" >> "$GITHUB_OUTPUT"

      - name: Prepare immutable release assets
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.build.outputs.bundle_dir }}
        run: |
          set -euo pipefail
          mkdir "$RELEASE_DIR"
          RELEASE_VERSION="$RELEASE_VERSION" BUNDLE_DIR="$BUNDLE_DIR" RELEASE_DIR="$RELEASE_DIR" \
            SOURCE_REPOSITORY="$GITHUB_REPOSITORY" SOURCE_SHA="$GITHUB_SHA" \
            node --input-type=module <<'NODE'
          import { prepareSignerRelease } from "./tools/signer-release/prepare.mjs";
          await prepareSignerRelease({
            version: process.env.RELEASE_VERSION,
            sourceRepository: process.env.SOURCE_REPOSITORY,
            sourceSha: process.env.SOURCE_SHA,
            bundleDir: process.env.BUNDLE_DIR,
            outputDir: process.env.RELEASE_DIR,
            pubDate: new Date().toISOString(),
          });
          NODE

      - name: Stage exact assets in a draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATION_RELEASE_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          target_sha="$(gh api "repos/$SIGNER_RELEASE_REPOSITORY/commits/main" --jq .sha)"
          notes="$RUNNER_TEMP/notes.md"
          {
            printf 'Установщик агента подписи Честного ЗНАКа для Windows.\n\n'
            printf 'Исходный код: %s@%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'Постоянная ссылка: https://releases.markiro.app/signer/download\n\n'
            printf 'Обновление устанавливается только после подтверждения оператора.\n'
          } > "$notes"
          gh release create "$RELEASE_TAG" "$RELEASE_DIR"/* --draft \
            --repo "$SIGNER_RELEASE_REPOSITORY" \
            --target "$target_sha" \
            --title "Markiro Подписант $RELEASE_VERSION" \
            --notes-file "$notes"

      - name: Publish exact assets to the release mirror
        id: mirror
        shell: bash
        env:
          YANDEX_STATION_RELEASE_ENDPOINT: ${{ vars.YANDEX_STATION_RELEASE_ENDPOINT }}
          YANDEX_STATION_RELEASE_BUCKET: ${{ vars.YANDEX_STATION_RELEASE_BUCKET }}
          YANDEX_STATION_RELEASE_ACCESS_KEY_ID: ${{ secrets.YANDEX_STATION_RELEASE_ACCESS_KEY_ID }}
          YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          node tools/signer-release/publish.mjs "$RELEASE_VERSION" "$RELEASE_DIR" \
            | tee "$RUNNER_TEMP/published.txt"
          printf 'manifest_url=%s\n' "$(sed -n 1p "$RUNNER_TEMP/published.txt")" >> "$GITHUB_OUTPUT"
          printf 'installer_url=%s\n' "$(sed -n 2p "$RUNNER_TEMP/published.txt")" >> "$GITHUB_OUTPUT"
          printf 'download_url=%s\n' "$(sed -n 3p "$RUNNER_TEMP/published.txt")" >> "$GITHUB_OUTPUT"

      - name: Publish the verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATION_RELEASE_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --repo "$SIGNER_RELEASE_REPOSITORY"

  repair:
    # US development is not releasable. Re-enable only through an approved change.
    if: ${{ false }}
    # Before US release lock: if: inputs.mode == 'repair'
    needs: [authorize, state]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: station-release
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.state.outputs.version }}
      RELEASE_TAG: ${{ needs.state.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure release working paths
        shell: bash
        run: printf 'RELEASE_DIR=%s\n' "$RUNNER_TEMP/signer-release" >> "$GITHUB_ENV"

      - name: Install locked workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Download and verify the pending draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATION_RELEASE_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir "$RELEASE_DIR"
          gh release download "$RELEASE_TAG" --repo "$SIGNER_RELEASE_REPOSITORY" \
            --dir "$RELEASE_DIR"
          RELEASE_VERSION="$RELEASE_VERSION" RELEASE_DIR="$RELEASE_DIR" \
            node --input-type=module <<'NODE'
          import { verifyPreparedSignerRelease } from "./tools/signer-release/prepare.mjs";
          await verifyPreparedSignerRelease({
            directory: process.env.RELEASE_DIR,
            version: process.env.RELEASE_VERSION,
          });
          NODE

      - name: Repair the release mirror from exact draft bytes
        shell: bash
        env:
          YANDEX_STATION_RELEASE_ENDPOINT: ${{ vars.YANDEX_STATION_RELEASE_ENDPOINT }}
          YANDEX_STATION_RELEASE_BUCKET: ${{ vars.YANDEX_STATION_RELEASE_BUCKET }}
          YANDEX_STATION_RELEASE_ACCESS_KEY_ID: ${{ secrets.YANDEX_STATION_RELEASE_ACCESS_KEY_ID }}
          YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          node tools/signer-release/publish.mjs "$RELEASE_VERSION" "$RELEASE_DIR"

      - name: Publish the repaired GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STATION_RELEASE_REPOSITORY_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --repo "$SIGNER_RELEASE_REPOSITORY"
