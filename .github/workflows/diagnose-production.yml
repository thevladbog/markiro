name: Diagnose production runtime

on:
  workflow_dispatch:
    inputs:
      national_catalog:
        description: Run the read-only National Catalog production contract
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: markiro-production-deployment
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-deploy
    permissions:
      contents: read
    env:
      YC_APP_PUBLIC_ADDRESS: ${{ vars.YC_APP_PUBLIC_ADDRESS }}
      APP_SSH_HOST_KEYS_B64: ${{ vars.APP_SSH_HOST_KEYS_B64 }}
      YC_APP_DEPLOY_LOGIN: markiro-deploy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Diagnose production runtime
        env:
          YC_APP_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.YC_APP_DEPLOY_SSH_PRIVATE_KEY }}
          RUN_NATIONAL_CATALOG_DIAGNOSTIC: ${{ inputs.national_catalog }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/markiro-diagnostic-key"
          test ! -e "$key_path"
          trap 'rm -f -- "$key_path"' EXIT
          printf '%s\n' "$YC_APP_DEPLOY_SSH_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          export YC_APP_DEPLOY_SSH_PRIVATE_KEY_PATH="$key_path"
          node deploy/yandex/runtime-diagnostics.mjs run
          if [[ "$RUN_NATIONAL_CATALOG_DIAGNOSTIC" == "true" ]]; then
            node deploy/yandex/national-catalog-diagnostics.mjs run
          fi

      - name: Remove local diagnostic credentials
        if: always()
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/markiro-diagnostic-key"
