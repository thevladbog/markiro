name: DNS convergence verification

"on":
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current main release SHA whose public DNS was applied
        required: true
        type: string
      dns_apply_run_id:
        description: Successful approved Yandex infrastructure DNS apply workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: markiro-production-dns-convergence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-dns-convergence
    env:
      MARKIRO_DOMAIN: ${{ vars.MARKIRO_DOMAIN }}
      MARKIRO_AUTHORITATIVE_DNS_SERVER: ${{ vars.MARKIRO_AUTHORITATIVE_DNS_SERVER }}
      MARKIRO_PUBLIC_DNS_RESOLVERS: ${{ vars.MARKIRO_PUBLIC_DNS_RESOLVERS }}
      MARKIRO_APPROVED_DNS_A: ${{ vars.MARKIRO_APPROVED_DNS_A }}
      MARKIRO_APPROVED_DNS_AAAA: ${{ vars.MARKIRO_APPROVED_DNS_AAAA }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DNS_APPLY_RUN_ID: ${{ inputs.dns_apply_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate exact DNS apply and current main
        id: provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DNS_APPLY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          main_ref_path="$RUNNER_TEMP/main-ref.json"
          dns_run_path="$RUNNER_TEMP/dns-run.json"
          artifact_path="$RUNNER_TEMP/dns-artifact.json"
          curl --fail --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --output "$main_ref_path"
          jq -e --arg release_sha "$RELEASE_SHA" '.object.sha == $release_sha' "$main_ref_path" > /dev/null
          curl --fail --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DNS_APPLY_RUN_ID" \
            --output "$dns_run_path"
          jq -e --arg release_sha "$RELEASE_SHA" '
            .name == "Yandex infrastructure" and
            .path == ".github/workflows/yandex-infrastructure.yml" and
            .event == "workflow_dispatch" and
            .head_branch == "main" and
            .head_sha == $release_sha and
            .conclusion == "success"
          ' "$dns_run_path" > /dev/null
          artifact_name="yandex-public-dns-apply-$RELEASE_SHA"
          curl --fail --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DNS_APPLY_RUN_ID/artifacts?name=$artifact_name" \
            --output "$artifact_path"
          jq -e --arg name "$artifact_name" '
            .total_count == 1 and
            (.artifacts | length) == 1 and
            .artifacts[0].name == $name and
            .artifacts[0].expired == false
          ' "$artifact_path" > /dev/null
          artifact_digest="$(jq -er '.artifacts[0].digest' "$artifact_path")"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'artifact-digest=%s\n' "$artifact_digest" >> "$GITHUB_OUTPUT"
          rm -f "$main_ref_path" "$dns_run_path" "$artifact_path"
      - name: Download exact approved public DNS apply evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yandex-public-dns-apply-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/dns-apply
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.dns_apply_run_id }}
      - name: Run authoritative and public DNS convergence verifier
        env:
          DNS_APPLY_ARTIFACT_DIGEST: ${{ steps.provenance.outputs.artifact-digest }}
          DNS_APPLY_RECEIPT_PATH: ${{ runner.temp }}/dns-apply/public-dns-apply.json
          DNS_CONVERGENCE_RECEIPT_PATH: ${{ runner.temp }}/dns-convergence.json
        run: node deploy/yandex/dns-convergence.mjs run
      - name: Upload immutable DNS convergence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-dns-convergence-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/dns-convergence.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove local DNS evidence
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP:?}/dns-apply"
          rm -f -- "${RUNNER_TEMP:?}/main-ref.json" "${RUNNER_TEMP:?}/dns-run.json"
          rm -f -- "${RUNNER_TEMP:?}/dns-artifact.json" "${RUNNER_TEMP:?}/dns-convergence.json"
