name: Repair signer stable download alias

on:
  workflow_dispatch:
    inputs:
      owner_confirmation:
        description: Type REPAIR-SIGNER-DOWNLOAD; only the repository owner may dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: us-development-locked-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    # US development is not releasable. Re-enable only through an approved change.
    if: ${{ false }}
    # Before US release lock: if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Authorize signer download repair owner
        shell: bash
        env:
          OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
          REPAIR_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$REPAIR_ACTOR" = "$REPOSITORY_OWNER"
          test "$OWNER_CONFIRMATION" = "REPAIR-SIGNER-DOWNLOAD"

  repair:
    # US development is not releasable. Re-enable only through an approved change.
    if: ${{ false }}
    # Before US release lock: if: github.ref == 'refs/heads/main'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: station-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Repair and publicly verify the stable download alias
        shell: bash
        env:
          YANDEX_STATION_RELEASE_ENDPOINT: ${{ vars.YANDEX_STATION_RELEASE_ENDPOINT }}
          YANDEX_STATION_RELEASE_BUCKET: ${{ vars.YANDEX_STATION_RELEASE_BUCKET }}
          YANDEX_STATION_RELEASE_ACCESS_KEY_ID: ${{ secrets.YANDEX_STATION_RELEASE_ACCESS_KEY_ID }}
          YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STATION_RELEASE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          pnpm test:signer-release:contract
          node tools/signer-release/repair-download.mjs
