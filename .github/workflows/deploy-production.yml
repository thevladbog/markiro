name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Publish production images workflow run ID
        required: true
        type: string
      release_sha:
        description: Exact 40-character release commit
        required: true
        type: string

permissions: {}

concurrency:
  group: markiro-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      YC_APP_PUBLIC_ADDRESS: ${{ vars.YC_APP_PUBLIC_ADDRESS }}
      APP_SSH_HOST_KEYS_B64: ${{ vars.APP_SSH_HOST_KEYS_B64 }}
      MARKIRO_DOMAIN: ${{ vars.MARKIRO_DOMAIN }}
      MARKIRO_KIOSK_DOMAIN: ${{ vars.MARKIRO_KIOSK_DOMAIN }}
      MARKIRO_LANDING_DOMAIN: ${{ vars.MARKIRO_LANDING_DOMAIN }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      YC_APP_DEPLOY_LOGIN: markiro-deploy
    steps:
      - name: Resolve exact trusted release
        id: release
        env:
          DISPATCH_RUN_ID: ${{ inputs.release_run_id }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DISPATCH_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_path="$RUNNER_TEMP/release-run.json"
          trap 'rm -f -- "$run_path"' EXIT
          curl --fail --silent --show-error --max-time 30 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DISPATCH_RUN_ID" \
            --output "$run_path"
          jq -e --arg run_id "$DISPATCH_RUN_ID" --arg sha "$DISPATCH_SHA" '
            def normalized_main_workflow_path:
              if endswith("@refs/heads/main") then rtrimstr("@refs/heads/main")
              elif endswith("@main") then rtrimstr("@main")
              else . end;
            .id == ($run_id | tonumber) and
            .name == "Publish production images" and
            (.path | normalized_main_workflow_path) == ".github/workflows/release-images.yml" and
            .event == "push" and .head_branch == "main" and
            .head_sha == $sha and .conclusion == "success"
          ' "$run_path" > /dev/null
          printf 'release-run-id=%s\nrelease-sha=%s\n' "$DISPATCH_RUN_ID" "$DISPATCH_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.release-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: markiro-release-manifest-${{ steps.release.outputs.release-sha }}
          path: ${{ runner.temp }}/release-manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.release-run-id }}

      - name: Validate exact release
        env:
          EXPECTED_RELEASE_RUN_ID: ${{ steps.release.outputs.release-run-id }}
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.release-sha }}
          RELEASE_MANIFEST_PATH: ${{ runner.temp }}/release-manifest/release-manifest.json
        run: |
          set -euo pipefail
          node deploy/production/release-manifest.mjs validate "$RELEASE_MANIFEST_PATH" "$EXPECTED_RELEASE_RUN_ID" > /dev/null
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RELEASE_SHA" ]]

      - name: Deploy immutable Compose bundle
        env:
          EXPECTED_RELEASE_RUN_ID: ${{ steps.release.outputs.release-run-id }}
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.release-sha }}
          RELEASE_MANIFEST_PATH: ${{ runner.temp }}/release-manifest/release-manifest.json
          YC_APP_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.YC_APP_DEPLOY_SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/markiro-deploy-key"
          test ! -e "$key_path"
          trap 'rm -f -- "$key_path"' EXIT
          printf '%s\n' "$YC_APP_DEPLOY_SSH_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          export YC_APP_DEPLOY_SSH_PRIVATE_KEY_PATH="$key_path"
          node deploy/yandex/remote-deploy.mjs run

      - name: Remove local deployment credentials
        if: always()
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/markiro-deploy-key" "$RUNNER_TEMP/release-run.json"
