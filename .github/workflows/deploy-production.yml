name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Publish production images workflow run ID
        required: true
        type: string
      release_sha:
        description: Exact 40-character release commit
        required: true
        type: string
      deployment_phase:
        description: First deployment only skips the pre-existing ALB-health gate and performs pre-DNS probes.
        required: true
        default: repeat
        type: choice
        options: [first, repeat]
      rollback_rehearsal:
        description: Separately approved first-release rollback rehearsal; never enabled by automatic delivery.
        required: true
        default: false
        type: boolean
      rehearsal_run_id:
        description: Exact prior rollback-rehearsal run ID; required only for a successful first deployment.
        required: true
        default: none
        type: string
      rehearsal_run_attempt:
        description: Exact prior rollback-rehearsal run attempt; required only for a successful first deployment.
        required: true
        default: none
        type: string
  workflow_run:
    workflows: [Publish production images]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: markiro-production-deployment
  cancel-in-progress: false

jobs:
  controller:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-controller
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      deployment-id: ${{ steps.runner.outputs.deployment-id }}
      app-host-keys-b64: ${{ steps.runner.outputs.app-host-keys-b64 }}
      runner-id: ${{ steps.runner.outputs.runner-id }}
      runner-label: ${{ steps.runner.outputs.runner-label }}
      release-run-id: ${{ steps.release.outputs.release-run-id }}
      release-sha: ${{ steps.release.outputs.release-sha }}
    env:
      YC_OIDC_AUDIENCE: ${{ vars.YC_OIDC_AUDIENCE }}
      YC_DEPLOYMENT_CONTROLLER_SERVICE_ACCOUNT_ID: ${{ vars.YC_DEPLOYMENT_CONTROLLER_SERVICE_ACCOUNT_ID }}
      YC_RUNNER_REGISTRATION_SECRET_ID: ${{ vars.YC_RUNNER_REGISTRATION_SECRET_ID }}
      YC_RUNNER_INSTANCE_ID: ${{ vars.YC_RUNNER_INSTANCE_ID }}
      YC_APP_INSTANCE_ID: ${{ vars.YC_APP_INSTANCE_ID }}
      YC_POSTGRES_CLUSTER_ID: ${{ vars.YC_POSTGRES_CLUSTER_ID }}
      YC_LOAD_BALANCER_ID: ${{ vars.YC_LOAD_BALANCER_ID }}
      YC_BACKEND_GROUP_ID: ${{ vars.YC_BACKEND_GROUP_ID }}
      YC_TARGET_GROUP_ID: ${{ vars.YC_APP_TARGET_GROUP_ID }}
      MARKIRO_DEPLOYMENT_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_phase || 'repeat' }}
      MARKIRO_ROLLBACK_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_rehearsal && '1' || '0' }}
    steps:
      - name: Resolve exact trusted release identity
        id: release
        env:
          DISPATCH_RUN_ID: ${{ inputs.release_run_id }}
          DISPATCH_SHA: ${{ inputs.release_sha }}
          DISPATCH_PHASE: ${{ inputs.deployment_phase }}
          DISPATCH_REHEARSAL: ${{ inputs.rollback_rehearsal }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id || 'none' }}
          REHEARSAL_RUN_ATTEMPT: ${{ inputs.rehearsal_run_attempt || 'none' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ "$MARKIRO_DEPLOYMENT_PHASE" == repeat ]]
            [[ "$MARKIRO_ROLLBACK_REHEARSAL" == 0 ]]
            [[ "$REHEARSAL_RUN_ID" == none ]]
            [[ "$REHEARSAL_RUN_ATTEMPT" == none ]]
            release_run_id="$EVENT_RUN_ID"
            release_sha="$EVENT_SHA"
          else
            if [[ "$DISPATCH_REHEARSAL" == true ]]; then
              [[ "$DISPATCH_PHASE" == first ]]
              [[ "$REHEARSAL_RUN_ID" == none ]]
              [[ "$REHEARSAL_RUN_ATTEMPT" == none ]]
            elif [[ "$DISPATCH_PHASE" == first ]]; then
              [[ "$REHEARSAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$REHEARSAL_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            else
              [[ "$DISPATCH_PHASE" == repeat ]]
              [[ "$REHEARSAL_RUN_ID" == none ]]
              [[ "$REHEARSAL_RUN_ATTEMPT" == none ]]
            fi
            release_run_id="$DISPATCH_RUN_ID"
            release_sha="$DISPATCH_SHA"
          fi
          [[ "$release_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          run_path="$RUNNER_TEMP/release-run.json"
          curl --fail --silent \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$release_run_id" \
            --output "$run_path"
          jq -e --arg release_run_id "$release_run_id" --arg sha "$release_sha" '
            def normalized_main_workflow_path:
              if endswith("@refs/heads/main") then rtrimstr("@refs/heads/main")
              elif endswith("@main") then rtrimstr("@main")
              else . end;
            .id == ($release_run_id | tonumber) and
            .name == "Publish production images" and
            (.path | normalized_main_workflow_path) == ".github/workflows/release-images.yml" and
            .event == "push" and .head_branch == "main" and
            .head_sha == $sha and .conclusion == "success" and
            (.run_attempt | type == "number" and . >= 1 and floor == .)
          ' "$run_path" > /dev/null
          rm -f "$run_path"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$DISPATCH_PHASE" == first && "$DISPATCH_REHEARSAL" == false ]]; then
            rehearsal_run_path="$RUNNER_TEMP/rehearsal-run.json"
            curl --fail --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL_RUN_ID" \
              --output "$rehearsal_run_path"
            jq -e \
              --arg rehearsal_run_id "$REHEARSAL_RUN_ID" \
              --arg rehearsal_run_attempt "$REHEARSAL_RUN_ATTEMPT" \
              --arg sha "$release_sha" '
                def normalized_main_workflow_path:
                  if endswith("@refs/heads/main") then rtrimstr("@refs/heads/main")
                  elif endswith("@main") then rtrimstr("@main")
                  else . end;
                .id == ($rehearsal_run_id | tonumber) and
                .name == "Deploy production" and
                (.path | normalized_main_workflow_path) == ".github/workflows/deploy-production.yml" and
                .event == "workflow_dispatch" and .head_branch == "main" and
                .head_sha == $sha and .conclusion == "success" and
                .run_attempt == ($rehearsal_run_attempt | tonumber)
              ' "$rehearsal_run_path" > /dev/null
            rm -f "$rehearsal_run_path"
          fi
          printf 'release-run-id=%s\nrelease-sha=%s\n' "$release_run_id" "$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.release-sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download the exact trusted release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: markiro-release-manifest-${{ steps.release.outputs.release-sha }}
          path: ${{ runner.temp }}/release-manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.release-run-id }}
      - name: Download prerequisite rollback rehearsal evidence
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_phase == 'first' && inputs.rollback_rehearsal == false
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: markiro-rollback-rehearsal-${{ steps.release.outputs.release-sha }}-attempt-${{ inputs.rehearsal_run_attempt }}
          path: ${{ runner.temp }}/rollback-rehearsal-prerequisite
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rehearsal_run_id }}
      - name: Download prerequisite cleanup receipt
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_phase == 'first' && inputs.rollback_rehearsal == false
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: markiro-cleanup-${{ steps.release.outputs.release-sha }}-attempt-${{ inputs.rehearsal_run_attempt }}
          path: ${{ runner.temp }}/cleanup-prerequisite
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.rehearsal_run_id }}
      - name: Validate manifest, infrastructure, backup, then start the one-use runner
        id: runner
        env:
          EXPECTED_RELEASE_RUN_ID: ${{ steps.release.outputs.release-run-id }}
          EXPECTED_RELEASE_SHA: ${{ steps.release.outputs.release-sha }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id || 'none' }}
          REHEARSAL_RUN_ATTEMPT: ${{ inputs.rehearsal_run_attempt || 'none' }}
          RELEASE_MANIFEST_PATH: ${{ runner.temp }}/release-manifest/release-manifest.json
        run: |
          set -euo pipefail
          node deploy/production/release-manifest.mjs validate "$RELEASE_MANIFEST_PATH" "$EXPECTED_RELEASE_RUN_ID" > /dev/null
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RELEASE_SHA" ]]
          if [[ "$MARKIRO_DEPLOYMENT_PHASE" == first && "$MARKIRO_ROLLBACK_REHEARSAL" == 0 ]]; then
            rehearsal_path="$RUNNER_TEMP/rollback-rehearsal-prerequisite/rollback-rehearsal.json"
            cleanup_path="$RUNNER_TEMP/cleanup-prerequisite/cleanup-receipt.json"
            jq -e \
              --argjson deployment_run_attempt "$REHEARSAL_RUN_ATTEMPT" \
              --arg deployment_run_id "$REHEARSAL_RUN_ID" \
              --arg release_run_id "$EXPECTED_RELEASE_RUN_ID" \
              --arg release_sha "$EXPECTED_RELEASE_SHA" '
              type == "object" and
              (keys | sort) == ["deploymentPhase", "deploymentRunAttempt", "deploymentRunId", "rehearsedAt", "releaseRunId", "releaseSha", "rollbackRehearsal", "sourceEvent", "sourceRef", "sourceWorkflow", "state"] and
              .deploymentRunAttempt == $deployment_run_attempt and
              .deploymentRunId == $deployment_run_id and
              .releaseRunId == $release_run_id and .releaseSha == $release_sha and
              .deploymentPhase == "first" and .rollbackRehearsal == true and
              .sourceEvent == "workflow_dispatch" and .sourceRef == "refs/heads/main" and
              .sourceWorkflow == ".github/workflows/deploy-production.yml" and
              .state == "rehearsed" and
              (.rehearsedAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.000Z$"))
            ' "$rehearsal_path" > /dev/null
            jq -e \
              --argjson deployment_run_attempt "$REHEARSAL_RUN_ATTEMPT" \
              --arg deployment_run_id "$REHEARSAL_RUN_ID" \
              --arg release_sha "$EXPECTED_RELEASE_SHA" '
              type == "object" and
              (keys | sort) == ["cleanupAt", "deploymentRunAttempt", "deploymentRunId", "releaseSha", "runnerDeregistered", "runnerVmStopped", "state"] and
              .deploymentRunAttempt == $deployment_run_attempt and
              .deploymentRunId == $deployment_run_id and .releaseSha == $release_sha and
              .runnerDeregistered == true and .runnerVmStopped == true and .state == "clean" and
              (.cleanupAt | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.000Z$"))
            ' "$cleanup_path" > /dev/null
            rehearsed_at="$(jq -er '.rehearsedAt' "$rehearsal_path")"
            cleanup_at="$(jq -er '.cleanupAt' "$cleanup_path")"
            [[ "$cleanup_at" == "$rehearsed_at" || "$cleanup_at" > "$rehearsed_at" ]]
          fi
          github_oidc_response="$(curl --fail --silent --get \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$YC_OIDC_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          github_oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' <<<"$github_oidc_response")"
          echo "::add-mask::$github_oidc_token"
          iam_response="$(curl --fail --silent \
            --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_DEPLOYMENT_CONTROLLER_SERVICE_ACCOUNT_ID" \
            --data-urlencode "subject_token=$github_oidc_token" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)"
          iam_token="$(jq -er '.access_token | select(type == "string" and length > 0)' <<<"$iam_response")"
          echo "::add-mask::$iam_token"
          lockbox_path="$RUNNER_TEMP/runner-lockbox.json"
          curl --fail --silent \
            --header "Authorization: Bearer $iam_token" \
            "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$YC_RUNNER_REGISTRATION_SECRET_ID/payload" \
            --output "$lockbox_path"
          jq -e '
            (.entries | type == "array" and length == 1) and
            .entries[0].key == "GITHUB_RUNNER_ADMIN_TOKEN" and
            (.entries[0].textValue | type == "string" and length > 0)
          ' "$lockbox_path" > /dev/null
          github_runner_admin_token="$(jq -er '.entries[0].textValue' "$lockbox_path")"
          echo "::add-mask::$github_runner_admin_token"
          rm -f "$lockbox_path"
          export YC_GATE_IAM_TOKEN="$iam_token" YC_IAM_TOKEN="$iam_token"
          export GITHUB_RUNNER_ADMIN_TOKEN="$github_runner_admin_token"
          export RUNNER_WAIT_DISCOVERY=1 RUNNER_OUTPUT_PATH="$GITHUB_OUTPUT"
          node deploy/yandex/runner-control.mjs start
          unset github_oidc_token github_runner_admin_token iam_token
          unset YC_GATE_IAM_TOKEN YC_IAM_TOKEN GITHUB_RUNNER_ADMIN_TOKEN

  deploy:
    needs: controller
    if: needs.controller.result == 'success'
    runs-on: [self-hosted, linux, "${{ needs.controller.outputs.runner-label }}"]
    timeout-minutes: 40
    environment: production-deploy
    permissions:
      actions: read
      contents: read
      id-token: "none"
    env:
      EXPECTED_RELEASE_RUN_ID: ${{ needs.controller.outputs.release-run-id }}
      EXPECTED_RELEASE_SHA: ${{ needs.controller.outputs.release-sha }}
      YC_APP_INSTANCE_ID: ${{ vars.YC_APP_INSTANCE_ID }}
      MARKIRO_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
      YC_REGISTRY_SECRET_ID: ${{ vars.YC_REGISTRY_SECRET_ID }}
      YC_OS_LOGIN: ${{ vars.YC_RUNNER_OS_LOGIN }}
      YC_ORGANIZATION_ID: ${{ vars.YC_ORGANIZATION_ID }}
      YC_LOAD_BALANCER_ID: ${{ vars.YC_LOAD_BALANCER_ID }}
      YC_BACKEND_GROUP_ID: ${{ vars.YC_BACKEND_GROUP_ID }}
      YC_TARGET_GROUP_ID: ${{ vars.YC_APP_TARGET_GROUP_ID }}
      MARKIRO_DOMAIN: ${{ vars.MARKIRO_DOMAIN }}
      MARKIRO_DEPLOYMENT_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_phase || 'repeat' }}
      YC_LOAD_BALANCER_ADDRESS: ${{ vars.YC_LOAD_BALANCER_ADDRESS }}
      MARKIRO_ROLLBACK_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_rehearsal && '1' || '0' }}
      APP_SSH_HOST_KEYS_B64: ${{ needs.controller.outputs.app-host-keys-b64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.controller.outputs.release-sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download the exact trusted release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: markiro-release-manifest-${{ needs.controller.outputs.release-sha }}
          path: ${{ runner.temp }}/release-manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.controller.outputs.release-run-id }}
      - name: Deploy the immutable private bundle by digest
        env:
          RELEASE_MANIFEST_PATH: ${{ runner.temp }}/release-manifest/release-manifest.json
        run: |
          set -euo pipefail
          if [[ "$MARKIRO_ROLLBACK_REHEARSAL" == 1 ]]; then
            node deploy/yandex/remote-deploy.mjs run > "$RUNNER_TEMP/rollback-rehearsal-result.json"
            jq -e --arg release_sha "$EXPECTED_RELEASE_SHA" '
              type == "object" and (keys | sort) == ["state", "tag"] and
              .state == "rehearsed" and .tag == $release_sha
            ' "$RUNNER_TEMP/rollback-rehearsal-result.json" > /dev/null
          else
            node deploy/yandex/remote-deploy.mjs run
          fi
      - name: Record the exact finalized release
        if: env.MARKIRO_ROLLBACK_REHEARSAL != '1'
        env:
          RELEASE_RUN_ID: ${{ needs.controller.outputs.release-run-id }}
          RELEASE_SHA: ${{ needs.controller.outputs.release-sha }}
          DEPLOYMENT_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_phase || 'repeat' }}
        run: |
          set -euo pipefail
          finalized_path="$RUNNER_TEMP/finalized-release.json"
          test ! -e "$finalized_path"
          umask 077
          phase="$DEPLOYMENT_PHASE"
          deployment_run_id="$GITHUB_RUN_ID"
          finalized_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          jq -n \
            --arg phase "$phase" \
            --arg deployment_run_id "$deployment_run_id" \
            --arg finalized_at "$finalized_at" \
            --arg release_run_id "$RELEASE_RUN_ID" \
            --arg release_sha "$RELEASE_SHA" \
            '{deploymentPhase: $phase, deploymentRunId: $deployment_run_id, finalizedAt: $finalized_at, releaseRunId: $release_run_id, releaseSha: $release_sha}' \
            > "$finalized_path"
          chmod 600 "$finalized_path"
      - name: Record authenticated bounded rollback rehearsal evidence
        if: env.MARKIRO_ROLLBACK_REHEARSAL == '1'
        env:
          RELEASE_RUN_ID: ${{ needs.controller.outputs.release-run-id }}
          RELEASE_SHA: ${{ needs.controller.outputs.release-sha }}
        run: |
          set -euo pipefail
          result_path="$RUNNER_TEMP/rollback-rehearsal-result.json"
          evidence_path="$RUNNER_TEMP/rollback-rehearsal.json"
          test -s "$result_path"
          test ! -e "$evidence_path"
          jq -e --arg release_sha "$RELEASE_SHA" '
            type == "object" and (keys | sort) == ["state", "tag"] and
            .state == "rehearsed" and .tag == $release_sha
          ' "$result_path" > /dev/null
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/deploy-production.yml@refs/heads/main" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$MARKIRO_DEPLOYMENT_PHASE" == first ]]
          [[ "$MARKIRO_ROLLBACK_REHEARSAL" == 1 ]]
          umask 077
          jq -n \
            --arg deployment_phase "$MARKIRO_DEPLOYMENT_PHASE" \
            --argjson deployment_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg deployment_run_id "$GITHUB_RUN_ID" \
            --arg release_run_id "$RELEASE_RUN_ID" \
            --arg release_sha "$RELEASE_SHA" \
            --arg rehearsed_at "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            --arg source_event "$GITHUB_EVENT_NAME" \
            --arg source_ref "$GITHUB_REF" \
            '{deploymentPhase: $deployment_phase, deploymentRunAttempt: $deployment_run_attempt, deploymentRunId: $deployment_run_id, rehearsedAt: $rehearsed_at, releaseRunId: $release_run_id, releaseSha: $release_sha, rollbackRehearsal: true, sourceEvent: $source_event, sourceRef: $source_ref, sourceWorkflow: ".github/workflows/deploy-production.yml", state: "rehearsed"}' \
            > "$evidence_path"
          chmod 600 "$evidence_path"
      - name: Upload finalized release evidence
        if: env.MARKIRO_ROLLBACK_REHEARSAL != '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-finalized-release-${{ needs.controller.outputs.release-sha }}
          path: ${{ runner.temp }}/finalized-release.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload rollback rehearsal evidence
        if: env.MARKIRO_ROLLBACK_REHEARSAL == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-rollback-rehearsal-${{ needs.controller.outputs.release-sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-rehearsal.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove local deployment material
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "${RUNNER_TEMP:?}/release-manifest" "${RUNNER_TEMP:?}/markiro-os-login"
          rm -f -- "${RUNNER_TEMP:?}/finalized-release.json" "${RUNNER_TEMP:?}/rollback-rehearsal-result.json" "${RUNNER_TEMP:?}/rollback-rehearsal.json"

  cleanup:
    needs: [controller, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-cleanup
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_ID: ${{ needs.controller.outputs.deployment-id }}
      RELEASE_SHA: ${{ needs.controller.outputs.release-sha }}
      RUNNER_ID: ${{ needs.controller.outputs.runner-id }}
      YC_OIDC_AUDIENCE: ${{ vars.YC_OIDC_AUDIENCE }}
      YC_DEPLOYMENT_CONTROLLER_SERVICE_ACCOUNT_ID: ${{ vars.YC_DEPLOYMENT_CONTROLLER_SERVICE_ACCOUNT_ID }}
      YC_RUNNER_REGISTRATION_SECRET_ID: ${{ vars.YC_RUNNER_REGISTRATION_SECRET_ID }}
      YC_RUNNER_INSTANCE_ID: ${{ vars.YC_RUNNER_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.controller.outputs.release-sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Deregister any stale runner and stop the VM independently
        run: |
          set -euo pipefail
          github_oidc_response="$(curl --fail --silent --get \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$YC_OIDC_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          github_oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' <<<"$github_oidc_response")"
          echo "::add-mask::$github_oidc_token"
          iam_response="$(curl --fail --silent \
            --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_DEPLOYMENT_CONTROLLER_SERVICE_ACCOUNT_ID" \
            --data-urlencode "subject_token=$github_oidc_token" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)"
          iam_token="$(jq -er '.access_token | select(type == "string" and length > 0)' <<<"$iam_response")"
          echo "::add-mask::$iam_token"
          lockbox_path="$RUNNER_TEMP/runner-lockbox.json"
          curl --fail --silent \
            --header "Authorization: Bearer $iam_token" \
            "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$YC_RUNNER_REGISTRATION_SECRET_ID/payload" \
            --output "$lockbox_path"
          jq -e '
            (.entries | type == "array" and length == 1) and
            .entries[0].key == "GITHUB_RUNNER_ADMIN_TOKEN" and
            (.entries[0].textValue | type == "string" and length > 0)
          ' "$lockbox_path" > /dev/null
          github_runner_admin_token="$(jq -er '.entries[0].textValue' "$lockbox_path")"
          echo "::add-mask::$github_runner_admin_token"
          rm -f "$lockbox_path"
          export YC_IAM_TOKEN="$iam_token" GITHUB_RUNNER_ADMIN_TOKEN="$github_runner_admin_token"
          node deploy/yandex/runner-control.mjs cleanup
          unset github_oidc_token github_runner_admin_token iam_token YC_IAM_TOKEN GITHUB_RUNNER_ADMIN_TOKEN
      - name: Record authenticated bounded cleanup receipt
        run: |
          set -euo pipefail
          cleanup_path="$RUNNER_TEMP/cleanup-receipt.json"
          test ! -e "$cleanup_path"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          jq -n \
            --arg cleanup_at "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            --argjson deployment_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg deployment_run_id "$GITHUB_RUN_ID" \
            --arg release_sha "$RELEASE_SHA" \
            '{cleanupAt: $cleanup_at, deploymentRunAttempt: $deployment_run_attempt, deploymentRunId: $deployment_run_id, releaseSha: $release_sha, runnerDeregistered: true, runnerVmStopped: true, state: "clean"}' \
            > "$cleanup_path"
          chmod 600 "$cleanup_path"
      - name: Upload cleanup receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-cleanup-${{ needs.controller.outputs.release-sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cleanup-receipt.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove local cleanup material
        if: always()
        run: |
          set -euo pipefail
          rm -f -- "${RUNNER_TEMP:?}/cleanup-receipt.json" "${RUNNER_TEMP:?}/runner-lockbox.json"
