name: US development isolation

on:
  push:
    branches: [codex/us-mvp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      us-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: markiro_us
          POSTGRES_PASSWORD: markiro-us-development-only
          POSTGRES_DB: markiro_us_dev
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U markiro_us -d markiro_us_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject release capabilities and merges into main
        run: node tools/us-development/check-isolation.mjs
      - run: node --test tools/us-development/test/*.test.mjs
      - name: Verify shared domain foundation
        run: pnpm --filter @markiro/domain test && pnpm --filter @markiro/domain typecheck && pnpm --filter @markiro/domain lint && pnpm --filter @markiro/domain build
      - name: Build isolated API dependencies and entry points
        run: pnpm turbo build --filter '@markiro/api...'
      - name: Verify API entry boundaries
        run: pnpm --filter @markiro/api exec vitest run test/deployment-entry.test.ts test/us-development.e2e.test.ts test/env.test.ts test/health.e2e.test.ts
      - name: Build shared browser components
        run: pnpm --filter @markiro/ui build
      - name: Verify US browser flow and contracts
        run: pnpm --filter @markiro/admin exec vitest run test/us-client.test.ts test/us-master-data-client.test.ts test/us-master-data-forms.test.ts test/us-master-data-ui.test.tsx test/us-catalog-client.test.ts test/us-catalog-ui.test.tsx test/us-product-profile-client.test.ts test/us-product-profile-ui.test.tsx test/us-lot-client.test.ts test/us-lots-ui.test.tsx test/us-app.test.tsx
      - name: Verify receiving draft, finalization and exempt-review browser boundaries
        run: pnpm --filter @markiro/admin exec vitest run test/us-receiving-client.test.ts test/us-receiving-command-acknowledgement.test.ts test/us-receiving-live-client.test.ts test/us-receiving-revision-acknowledgement.test.ts test/us-receiving-lifecycle-client.test.ts test/us-receiving-lifecycle.test.tsx test/us-receiving-amendment-editor.test.tsx test/us-receiving-amendment-finalization.test.tsx test/us-receiving-ui.test.tsx test/us-receiving-references.test.tsx test/us-receiving-readiness-client.test.ts test/us-receiving-readiness.test.tsx test/us-receiving-finalization-client.test.ts test/us-receiving-finalization.test.tsx test/us-receiving-exemption-client.test.ts test/us-receiving-exemption.test.tsx
      - name: Verify exact receiving revision navigation
        run: pnpm --filter @markiro/admin exec vitest run test/us-receiving-history.test.tsx
      - name: Build local-only US browser entry
        env:
          VITE_DEPLOYMENT_EDITION: US
        run: pnpm --filter @markiro/admin build:us
      - name: Verify compiled local-only runtime
        run: node --test tools/us-development/test/runtime-entry.smoke.mjs tools/us-development/test/owner-command.smoke.mjs
      - name: Verify US profile, session and master-data persistence on disposable databases
        env:
          US_TEST_DATABASE_URL: postgres://markiro_us:markiro-us-development-only@127.0.0.1:55432/markiro_us_dev
        run: |
          pnpm --filter @markiro/domain exec vitest run test/traceability-location-description.test.ts test/us-access.test.ts test/us-receiving-exemption.test.ts
          pnpm --filter @markiro/platform-contracts exec vitest run test/us-profile.test.ts test/us-access.test.ts test/us-master-data.test.ts test/us-catalog.test.ts test/us-product-profile.test.ts test/us-lot.test.ts test/us-lot-records.test.ts test/us-receiving-inputs.test.ts test/us-reference-documents.test.ts
          pnpm --filter @markiro/db exec vitest run test/traceability-profile-schema.test.ts test/traceability-profile-migration.e2e.test.ts test/us-auth-schema.test.ts test/us-auth-migration.e2e.test.ts test/traceability-master-data-schema.test.ts test/traceability-master-data-migration.e2e.test.ts test/us-catalog-schema.test.ts test/us-catalog-migration.e2e.test.ts test/us-product-profile-schema.test.ts test/us-product-profile-migration.e2e.test.ts test/us-lot-schema.test.ts test/us-lot-migration.e2e.test.ts test/us-lot-source-migration.e2e.test.ts test/us-reference-document-schema.test.ts test/us-reference-document-migration.e2e.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-profile-store.e2e.test.ts test/us-auth.e2e.test.ts test/us-http.e2e.test.ts test/us-master-data.e2e.test.ts test/us-master-data-http.e2e.test.ts test/us-catalog-operational-boundaries.e2e.test.ts test/us-catalog.e2e.test.ts test/us-catalog-http.e2e.test.ts test/us-product-profile.e2e.test.ts test/us-lot.e2e.test.ts test/us-owner-command.test.ts test/us-development-owner.e2e.test.ts test/us-reference-document.e2e.test.ts
          pnpm --filter @markiro/platform-contracts exec vitest run test/us-receiving-records.test.ts test/us-receiving-readiness.test.ts test/us-receiving-finalization.test.ts test/us-receiving-exemption.test.ts test/us-receiving-finalization-v2.test.ts test/us-receiving-lifecycle.test.ts test/us-receiving-finalization-v3.test.ts test/us-receiving-live-records.test.ts
          pnpm --filter @markiro/db exec vitest run test/us-receiving-schema.test.ts test/us-receiving-migration.e2e.test.ts test/us-receiving-finalization-migration.e2e.test.ts test/us-receiving-exemption-migration.e2e.test.ts test/us-receiving-basis-version-migration.e2e.test.ts test/us-receiving-roots-migration.e2e.test.ts test/us-receiving-lifecycle-migration.e2e.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-receiving.e2e.test.ts test/us-receiving-http.e2e.test.ts test/us-receiving-readiness.e2e.test.ts test/us-receiving-finalization.e2e.test.ts test/us-receiving-finalization-concurrency.e2e.test.ts test/us-receiving-finalization-child-concurrency.e2e.test.ts test/us-receiving-finalization-snapshot-guards.e2e.test.ts test/us-receiving-finalization-url-boundary.e2e.test.ts test/us-receiving-exemption.e2e.test.ts test/us-receiving-exemption-concurrency.e2e.test.ts test/us-receiving-exemption-compatibility.e2e.test.ts test/us-receiving-basis-version.e2e.test.ts test/us-receiving-roots.e2e.test.ts test/us-receiving-basis.e2e.test.ts test/us-receiving-history.e2e.test.ts test/us-receiving-read-concurrency.e2e.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-receiving-lifecycle.e2e.test.ts test/us-receiving-lifecycle-concurrency.e2e.test.ts test/us-receiving-lifecycle-compatibility.e2e.test.ts test/us-receiving-original-command.e2e.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-receiving-amendment-save.e2e.test.ts test/us-receiving-amendment-save-concurrency.e2e.test.ts
          pnpm --filter @markiro/platform-contracts exec vitest run test/us-receiving-revision-readiness.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-receiving-revision-readiness.e2e.test.ts test/us-receiving-revision-readiness-concurrency.e2e.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-receiving-revision-finalization.e2e.test.ts test/us-receiving-revision-finalization-concurrency.e2e.test.ts
          pnpm --filter @markiro/platform-contracts exec vitest run test/us-receiving-registry.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-receiving-registry.e2e.test.ts
          pnpm --filter @markiro/platform-contracts exec vitest run test/us-receiving-lifecycle-errors.test.ts test/us-receiving-command-contracts.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-receiving-command-contracts.e2e.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-receiving-draft-command-bridge.e2e.test.ts
          pnpm --filter @markiro/api exec vitest run test/us-receiving-finalization-command-bridge.e2e.test.ts
