name: Publish platform images

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run for this exact dispatch SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-images-${{ github.sha }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.images.outputs.artifact-id }}
      ci-run-id: ${{ steps.ci.outputs.ci-run-id }}
      ci-run-attempt: ${{ steps.ci.outputs.ci-run-attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select classic store for portable platform images
        # The deployment contract pins a single amd64 manifest and its config ID.
        # Run only on this fresh hosted runner, before any image build/load.
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          test -z "$(docker ps -aq)"
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json
          else
            printf '{}'
          fi | jq '. + {"features": ((.features // {}) + {"containerd-snapshotter": false}), "storage-driver": "overlay2"}' > "$RUNNER_TEMP/platform-docker-daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/platform-docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          test "$(docker info --format '{{.Driver}}')" = "overlay2"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify exact successful main CI attempt
        id: ci
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node deploy/platform/release-images.mjs fetch-ci "$RUNNER_TEMP/platform-ci"
      - run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          corepack pnpm --dir tools/production-browser --ignore-workspace install --frozen-lockfile
          corepack pnpm --dir tools/production-browser --ignore-workspace exec playwright install --with-deps chromium
      - name: Verify release contracts
        run: |
          corepack pnpm --filter @markiro/domain build
          corepack pnpm --filter @markiro/legal-documents build
          node --test deploy/platform/test/*.test.mjs
          corepack pnpm test:production-bundle:contract
          corepack pnpm test:ci-policy
      - name: Build local Linux amd64 images once
        env:
          PUBLIC_DEMO_SUBMISSION_ENABLED: ${{ vars.PUBLIC_DEMO_SUBMISSION_ENABLED }}
          PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${{ vars.PUBLIC_SMARTCAPTCHA_CLIENT_KEY }}
          PUBLIC_PHONE: ${{ vars.PUBLIC_PHONE }}
          PUBLIC_INDEXNOW_KEY: ${{ vars.PUBLIC_INDEXNOW_KEY }}
        run: |
          docker build --platform linux/amd64 --file deploy/production/api.Dockerfile --tag "ghcr.io/thevladbog/markiro-api:$RELEASE_SHA" .
          docker build --platform linux/amd64 \
            --build-arg PUBLIC_DEMO_SUBMISSION_ENABLED="$PUBLIC_DEMO_SUBMISSION_ENABLED" \
            --build-arg PUBLIC_SMARTCAPTCHA_CLIENT_KEY="$PUBLIC_SMARTCAPTCHA_CLIENT_KEY" \
            --build-arg PUBLIC_PHONE="$PUBLIC_PHONE" \
            --build-arg PUBLIC_INDEXNOW_KEY="$PUBLIC_INDEXNOW_KEY" \
            --file deploy/platform/edge.Dockerfile \
            --tag "ghcr.io/thevladbog/markiro-platform-edge:$RELEASE_SHA" .
      - name: Capture image identities before verification
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.ci-run-id }}
          CI_RUN_ATTEMPT: ${{ steps.ci.outputs.ci-run-attempt }}
        run: node deploy/platform/release-images.mjs capture "$RUNNER_TEMP/platform-captured.json"
      - name: Verify exact local platform images
        env:
          MARKIRO_SOURCE_SHA: ${{ github.sha }}
          PLATFORM_CI_EVIDENCE_DIR: ${{ runner.temp }}/platform-harness
        run: node deploy/platform/ci-stack.mjs --local-ci
      - name: Export verified IDs under unique platform tags
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.ci-run-id }}
          CI_RUN_ATTEMPT: ${{ steps.ci.outputs.ci-run-attempt }}
        run: node deploy/platform/release-images.mjs export "$RUNNER_TEMP/platform-images" "$RUNNER_TEMP/platform-captured.json"
      - name: Upload immutable verified images
        id: images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-platform-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-images/images.tar
            ${{ runner.temp }}/platform-images/verified-images.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload sanitized harness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-platform-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-harness/verification.json
            ${{ runner.temp }}/platform-harness/platform-login.png
            ${{ runner.temp }}/platform-harness/platform-landing.png
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: build
    environment: production-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      CI_RUN_ID: ${{ needs.build.outputs.ci-run-id }}
      CI_RUN_ATTEMPT: ${{ needs.build.outputs.ci-run-attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Select classic store for portable platform images
        # The deployment contract pins a single amd64 manifest and its config ID.
        # Run only on this fresh hosted runner, before any image build/load.
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          test -z "$(docker ps -aq)"
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json
          else
            printf '{}'
          fi | jq '. + {"features": ((.features // {}) + {"containerd-snapshotter": false}), "storage-driver": "overlay2"}' > "$RUNNER_TEMP/platform-docker-daemon.json"
          sudo install -m 0644 "$RUNNER_TEMP/platform-docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          test "$(docker info --format '{{.Driver}}')" = "overlay2"
      - name: Download exact verified artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-images
      - name: Validate archive and loaded image IDs
        run: node deploy/platform/release-images.mjs load "$RUNNER_TEMP/platform-images"
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck IDs and publish exact verified images
        run: node deploy/platform/release-images.mjs publish "$RUNNER_TEMP/platform-images" "$RUNNER_TEMP/platform-published"
      - name: Upload complete release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-platform-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-published/platform-manifest.json
            ${{ runner.temp }}/platform-published/release-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload incomplete publication evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markiro-platform-incomplete-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-published/release-evidence.json
          if-no-files-found: warn
          retention-days: 90
