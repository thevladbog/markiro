name: Yandex infrastructure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main commit to apply
        required: true
        type: string
      enable_public_dns:
        description: Point admin, SaaS admin, kiosk, and landing directly to the app VM
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: markiro-yandex-production-state
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.15.8

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Configure provider mirror
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/terraform.tfrc"
          printf '%s\n' \
            'provider_installation {' \
            '  network_mirror {' \
            '    url     = "https://terraform-mirror.yandexcloud.net/"' \
            '    include = ["registry.terraform.io/yandex-cloud/yandex"]' \
            '  }' \
            '  direct {' \
            '    exclude = ["registry.terraform.io/yandex-cloud/yandex"]' \
            '  }' \
            '}' > "$config"
          chmod 600 "$config"
          printf 'TF_CLI_CONFIG_FILE=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate the direct VM MVP configuration
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/yandex
          node infra/yandex/scripts/check-toolchain.mjs
          terraform -chdir=infra/yandex/bootstrap init -backend=false -lockfile=readonly
          terraform -chdir=infra/yandex/bootstrap validate
          terraform -chdir=infra/yandex/production init -backend=false -lockfile=readonly
          terraform -chdir=infra/yandex/production validate
          pnpm test:yandex-infra:contract
          node --test deploy/yandex/test/remote-deploy.test.mjs deploy/yandex/test/hosted-deploy-workflow.test.mjs

  apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production-infrastructure
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      ENABLE_PUBLIC_DNS: ${{ inputs.enable_public_dns }}
      YC_CLOUD_ID: ${{ vars.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
      YC_OIDC_AUDIENCE: ${{ vars.YC_OIDC_AUDIENCE }}
      YC_TERRAFORM_SERVICE_ACCOUNT_ID: ${{ vars.YC_TERRAFORM_SERVICE_ACCOUNT_ID }}
      YC_STATE_BACKEND_SECRET_ID: ${{ vars.YC_STATE_BACKEND_SECRET_ID }}
      YC_STATE_BUCKET_NAME: ${{ vars.YC_STATE_BUCKET_NAME }}
      TF_VAR_cloud_id: ${{ vars.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ vars.YC_FOLDER_ID }}
      TF_VAR_zone: ${{ vars.YC_ZONE }}
      TF_VAR_app_subnet_cidr: ${{ vars.YC_APP_SUBNET_CIDR }}
      TF_VAR_data_subnet_cidr: ${{ vars.YC_DATA_SUBNET_CIDR }}
      TF_VAR_app_deploy_ssh_public_key: ${{ vars.YC_APP_DEPLOY_SSH_PUBLIC_KEY }}
      TF_VAR_ubuntu_lts_image_family: ubuntu-2404-lts
      TF_VAR_kms_key_id: ${{ vars.YC_KMS_KEY_ID }}
      TF_VAR_terraform_service_account_id: ${{ vars.YC_TERRAFORM_SERVICE_ACCOUNT_ID }}
      TF_VAR_app_service_account_id: ${{ vars.YC_APP_SERVICE_ACCOUNT_ID }}
      TF_VAR_runtime_secret_id: ${{ vars.YC_RUNTIME_SECRET_ID }}
      TF_VAR_database_name: ${{ vars.YC_DATABASE_NAME }}
      TF_VAR_database_disk_size_gb: ${{ vars.YC_DATABASE_DISK_SIZE_GB }}
      TF_VAR_state_bucket_name: ${{ vars.YC_STATE_BUCKET_NAME }}
      TF_VAR_media_bucket_name: ${{ vars.YC_MEDIA_BUCKET_NAME }}
      TF_VAR_audit_bucket_name: ${{ vars.YC_AUDIT_BUCKET_NAME }}
      TF_VAR_domain: ${{ vars.MARKIRO_DOMAIN }}
      TF_VAR_saas_admin_domain: ${{ vars.MARKIRO_SAAS_ADMIN_DOMAIN }}
      TF_VAR_kiosk_domain: ${{ vars.MARKIRO_KIOSK_DOMAIN }}
      TF_VAR_landing_domain: ${{ vars.MARKIRO_LANDING_DOMAIN }}
      TF_VAR_dns_zone_id: ${{ vars.YC_DNS_ZONE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Configure provider mirror
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/terraform.tfrc"
          printf '%s\n' \
            'provider_installation {' \
            '  network_mirror {' \
            '    url     = "https://terraform-mirror.yandexcloud.net/"' \
            '    include = ["registry.terraform.io/yandex-cloud/yandex"]' \
            '  }' \
            '  direct {' \
            '    exclude = ["registry.terraform.io/yandex-cloud/yandex"]' \
            '  }' \
            '}' > "$config"
          chmod 600 "$config"
          printf 'TF_CLI_CONFIG_FILE=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Authenticate, guard protected data and apply one saved plan
        run: |
          set -euo pipefail
          umask 077
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          case "$ENABLE_PUBLIC_DNS" in true|false) ;; *) exit 1 ;; esac
          export TF_VAR_public_dns_enabled="$ENABLE_PUBLIC_DNS"

          if ! github_oidc_token="$(curl --fail --silent --show-error --max-time 30 --get \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$YC_OIDC_AUDIENCE" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value | select(type == "string" and length > 0)')"; then
            printf '%s\n' '::error::GitHub OIDC token request failed' >&2
            exit 1
          fi
          echo "::add-mask::$github_oidc_token"
          if ! iam_token="$(curl --fail --silent --show-error --max-time 30 \
            --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_TERRAFORM_SERVICE_ACCOUNT_ID" \
            --data-urlencode "subject_token=$github_oidc_token" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token | jq -er '.access_token | select(type == "string" and length > 0)')"; then
            printf '%s\n' '::error::Yandex token exchange failed' >&2
            exit 1
          fi
          echo "::add-mask::$iam_token"
          export YC_TOKEN="$iam_token"

          payload="$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $iam_token" \
            "https://payload.lockbox.api.cloud.yandex.net/lockbox/v1/secrets/$YC_STATE_BACKEND_SECRET_ID/payload")"
          jq -e '
            (type == "object") and
            ((keys | sort) == ["entries", "versionId"]) and
            (.versionId | type == "string" and length > 0) and
            (.entries | type == "array" and length == 2) and
            ([.entries[].key] | sort) == ["AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"] and
            all(.entries[];
              (type == "object") and
              ((keys | sort) == ["key", "textValue"]) and
              (.textValue | type == "string") and
              (.textValue | length > 0))
          ' <<<"$payload" > /dev/null
          export AWS_ACCESS_KEY_ID="$(jq -er '.entries[] | select(.key == "AWS_ACCESS_KEY_ID") | .textValue' <<<"$payload")"
          export AWS_SECRET_ACCESS_KEY="$(jq -er '.entries[] | select(.key == "AWS_SECRET_ACCESS_KEY") | .textValue' <<<"$payload")"
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"

          backend="$RUNNER_TEMP/backend.hcl"
          plan="$RUNNER_TEMP/production.tfplan"
          plan_json="$RUNNER_TEMP/production-plan.json"
          tf_data="$RUNNER_TEMP/terraform-data"
          cleanup() {
            unset github_oidc_token iam_token payload YC_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
            rm -f -- "$backend" "$plan" "$plan_json"
            rm -rf -- "$tf_data"
          }
          trap cleanup EXIT
          install -d -m 700 "$tf_data"
          export TF_DATA_DIR="$tf_data"
          printf '%s\n' \
            'endpoints = { s3 = "https://storage.yandexcloud.net" }' \
            "bucket = \"$YC_STATE_BUCKET_NAME\"" \
            'region = "ru-central1"' \
            'key = "production/terraform.tfstate"' \
            'skip_region_validation = true' \
            'skip_credentials_validation = true' \
            'skip_requesting_account_id = true' \
            'skip_s3_checksum = true' \
            'use_path_style = true' > "$backend"
          chmod 600 "$backend"

          terraform -chdir=infra/yandex/production init -input=false -lockfile=readonly -backend-config="$backend"
          terraform -chdir=infra/yandex/production validate
          terraform -chdir=infra/yandex/production plan -input=false -out="$plan" > /dev/null
          terraform -chdir=infra/yandex/production show -json "$plan" > "$plan_json"
          node infra/yandex/scripts/guard-production-plan.mjs "$plan_json"
          jq -c '[.resource_changes[]? | select(.change.actions != ["no-op"]) | {address, actions: .change.actions}]' "$plan_json"
          terraform -chdir=infra/yandex/production apply -input=false -auto-approve "$plan"
