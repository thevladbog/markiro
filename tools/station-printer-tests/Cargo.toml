[package]
name = "markiro-station-printer-tests"
version = "0.0.0"
edition = "2021"
publish = false

# Runs the real printer core without linking Tauri/WebView2 into the test executable.
[lib]
path = "lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing",
  "Win32_Security", "Win32_Storage_Xps",
] }

[dev-dependencies]
serde_json = "1"
